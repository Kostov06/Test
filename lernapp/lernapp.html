<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e6dc">
<title>Ältestenrat — Lernstoff</title>
<style>
/* Optik der Prototypen: gedecktes Papier, Serifen für Namen, ruhige Flächen.
   Der einzige Schlagschatten im ganzen Blatt liegt unter dem Farbband. */
:root{
  --ink:#1b1d1a; --paper:#e9e6dc; --paper-2:#f6f4ee;
  --rule:#c3bfb0; --muted:#6c6b62; --accent:#3d5a3f;
  --warn:#7d3a2e;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0 auto; max-width:560px; background:var(--paper); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:18px 16px 40px;
}
h1,h2,.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:17px;margin:22px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
a{color:var(--ink)}

/* ---------------------------------------------------------- Kopfzeile */
.kopf{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
.kopf .sub{margin:0}
.zurueck{font-size:13px;color:var(--muted);background:none;border:0;padding:6px 2px;cursor:pointer;flex:0 0 auto}
.zurueck:hover{color:var(--ink)}

/* ------------------------------------------------------------- Knöpfe */
button{
  font:inherit;font-size:15px;border:1px solid var(--ink);background:var(--paper-2);
  color:var(--ink);padding:12px 14px;border-radius:3px;flex:1;cursor:pointer;
  text-align:center;
}
button:active{transform:translateY(1px)}
button.solid{background:var(--ink);color:var(--paper-2)}
button.ghost{border-color:var(--rule);color:var(--muted);flex:0 0 auto}
button[disabled]{opacity:.4;cursor:default}
button[disabled]:active{transform:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,li:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px
}
.row{display:flex;gap:8px;margin-top:14px}
.row.eng{margin-top:8px}
.modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.modes button{font-size:13.5px;padding:9px 10px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper-2)}

/* --------------------------------------------------------- Stapelwahl */
.stapel{list-style:none;padding:0;margin:0 0 18px}
.stapel li{border-top:1px solid var(--rule)}
.stapel li:last-child{border-bottom:1px solid var(--rule)}
.stapel label{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;cursor:pointer}
.stapel label > div{flex:1 1 auto;min-width:0}
.stapel input[type=checkbox]{margin:2px 0 0;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.stapel .titel{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:18px;line-height:1.25}
.stapel .zeile{font-size:13px;color:var(--muted);margin-top:3px}
.stapel .zeile b{color:var(--ink);font-weight:600}

/* Fächerbalken: fünf Segmente, Fach 5 am dunkelsten. Keine Verläufe. */
.faecher{display:flex;gap:2px;height:6px;margin-top:8px}
.faecher span{flex:0 0 auto;min-width:2px}
.faecher .f0,.faecher .f1{background:#d6d2c4}  /* Fach 1 ist die leere Spur */
.faecher .f2{background:#b9b09a}
.faecher .f3{background:#93927f}
.faecher .f4{background:#6f7861}
.faecher .f5{background:var(--accent)}

/* -------------------------------------------------------------- Karte */
.band{
  height:216px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(0,0,0,.18),0 12px 28px -16px rgba(0,0,0,.55);
}
.band span{flex:1 1 0;position:relative;display:block}
.band span.hell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
.prompt{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 0}
.frage{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:21px;
  line-height:1.3;margin:0;padding:22px 2px 6px}
.frage.klein{font-size:18px}
.antwort{background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;padding:16px;margin-top:14px}
.antwort .farben{font-size:13px;color:var(--muted);margin:0 0 12px}
.antwort .name{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-size:20px;line-height:1.25;margin:0 0 2px}
.antwort .meta{font-size:13px;color:var(--muted);margin:0}
.antwort .text{font-size:16px;line-height:1.45;margin:0}
.antwort .text + .text{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.eintrag{margin:0 0 12px}
.eintrag:last-child{margin-bottom:0}
.multi{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--rule);
  padding-bottom:8px;margin:0 0 12px}
.notiz{font-size:13px;color:var(--muted);line-height:1.45;margin:12px 0 0;
  padding-top:10px;border-top:1px solid var(--rule)}

/* Der Wechsel zur Antwort ist die einzige Bewegung im Blatt. */
.antwort{animation:auf .16s ease-out}
@keyframes auf{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.antwort{animation:none}}

/* --------------------------------------------------------- Lückentext */
.lueckentext{font-size:16px;line-height:1.9;white-space:pre-wrap;margin:0}
.luecke{border-bottom:1px solid var(--ink);padding:0 .45em;color:transparent}
.luecke.gefuellt{border-bottom-color:var(--accent);color:var(--ink);font-weight:600;
  background:rgba(61,90,63,.09)}

/* --------------------------------------------------------- Reihenfolge */
.reihe{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.reihe button{
  display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;
  border-color:var(--rule);padding:11px 12px;font-size:15px;
}
.reihe button[aria-pressed="true"]{border-color:var(--ink)}
.reihe .nr{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);
  min-width:1.4em;flex:0 0 auto}
.reihe button[aria-pressed="true"] .nr{color:var(--ink);font-weight:600}
.reihe .richtig{border-color:var(--accent)}
.reihe .falsch{border-color:var(--warn)}
.reihe .richtig .nr{color:var(--accent)}
.reihe .falsch .nr{color:var(--warn)}

/* ------------------------------------------------------------- Fußzeile */
.score{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  color:var(--muted);border-top:1px solid var(--rule);margin-top:22px;padding-top:10px;gap:12px}
.score b{color:var(--ink);font-weight:600}

/* ------------------------------------------------------------ Statistik */
.tabelle{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tabelle th,.tabelle td{text-align:left;padding:9px 6px 9px 0;border-bottom:1px solid var(--rule)}
.tabelle th{font-size:12.5px;color:var(--muted);font-weight:400}
.tabelle td.zahl,.tabelle th.zahl{text-align:right;padding:9px 0 9px 12px;font-variant-numeric:tabular-nums}
.hakt{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.hakt li{padding:8px 0;border-bottom:1px solid var(--rule);display:flex;
  justify-content:space-between;gap:12px;align-items:center}
.hakt .was{display:flex;gap:9px;align-items:center;min-width:0;line-height:1.3}
.hakt .wie{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.hakt .miniband{display:flex;flex-direction:column;width:34px;height:20px;
  border-radius:2px;overflow:hidden;flex:0 0 auto}
.hakt .miniband span{flex:1 1 0}

/* ------------------------------------------------------------ Redaktion */
.feld{margin:0 0 14px}
.feld label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],textarea,select{
  font:inherit;font-size:15px;width:100%;background:var(--paper-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:10px 11px;
}
textarea{line-height:1.5;resize:vertical;min-height:96px}
textarea.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px}
.hinweis{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.fehler{font-size:13.5px;color:var(--warn);line-height:1.5;margin:10px 0 0}
.fehler ul{margin:6px 0 0;padding-left:18px}
.streifen{display:flex;gap:8px;align-items:center;margin:0 0 6px}
.streifen input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--rule);
  border-radius:3px;background:var(--paper-2);flex:0 0 auto}
.streifen input[type=text]{flex:1 1 auto}
.streifen input.breite{flex:0 0 76px}
.streifen button{flex:0 0 auto;padding:10px 12px;border-color:var(--rule);color:var(--muted)}
.leer{color:var(--muted);font-size:14px;line-height:1.5}

/* Auf dem Handy gibt es keine Tastatur — der Hinweis wäre nur Rauschen. */
@media (hover:none) and (pointer:coarse){ .tasten-hinweis{display:none} }
</style>
</head>

mann Löns","jahr":1954,"verband":"WJSC"}]},{"id":"adv-helenia-monasteria-1988","typ":"couleur","rev":1,"band":{"streifen":[{"farbe":"#c3c6cb"},{"farbe":"#2fd3bd"},{"farbe":"#f0c31c"}]},"farben":"silber-türkisgrün-gold","antworten":[{"name":"ADV Helenia Monasteria","jahr":1988,"verband":"verbandsfrei"}]},{"id":"adv-athena-2012","typ":"couleur","rev":1,"band":{"streifen":[{"farbe":"#ffffff"},{"farbe":"#f3b4c6"},{"farbe":"#141414"}]},"farben":"weiß-rosa-schwarz","antworten":[{"name":"ADV Athena","jahr":2012,"verband":"verbandsfrei"}]}]},{"schema":1,"id":"ingvaeonia-geschichte","titel":"Geschichte des AMB Ingvaeonia","untertitel":"Von der AB Universitas bis heute","quelle":"Ältestenrat, „Die Geschichte des AMB Ingvaeonia“","stand":"2026-09-07","karten":[{"id":"j-1947","typ":"frage","rev":1,"frage":"17.05.1947","antworten":["Gründungsdatum — Feier des ersten Verbindungsfests"],"notiz":"Der Bund heißt zunächst AB Universitas: Männerbund, nicht schlagend, farbentragend (schwarz-gold-rot-gold-schwarz), hauptsächlich Studenten aus Osnabrück."},{"id":"j-1950","typ":"frage","rev":1,"frage":"1950","antworten":["Umbenennung in AB Ingvaeonia"]},{"id":"j-1952","typ":"frage","rev":1,"frage":"22.05.1952","antworten":["Vorläufige Aufnahme in den SV — der Kontakt lief über den OV Osnabrück"],"notiz":"Die Bänder wurden abgelegt, der Bund blieb aber farbenführend. Das führte zur Spaltung: die schlagende Verbindung „Salingia“ wurde gegründet, ging aber schnell wieder ein."},{"id":"j-1953","typ":"frage","rev":1,"frage":"Pfingsten 1953","antworten":["Endgültige Aufnahme in den SV"],"notiz":"Damit: Praktizierung des musikalischen Prinzips, Lebensbundprinzip als gelebte Wirklichkeit durch den Austausch mit anderen Bünden, Alternative zur Eindimensionalität des Fachstudiums."},{"id":"j-1954","typ":"frage","rev":1,"frage":"19.06.1954","antworten":["Patenschaftsabkommen mit dem AHV der Fridericiana zu Breslau (1883–1937)"]},{"id":"j-1957","typ":"frage","rev":1,"frage":"16.02.1957","antworten":["Heim in der Wolbecker Straße"],"notiz":"Kneipsaal, Vorstandszimmer, Nebenräume und Keller. Finanzierung und Ausgestaltung waren Gemeinschaftsleistung der Aktiven, der SV-Alten Herren und der Partnerverbindung Fridericiana zu Breslau."},{"id":"j-1961","typ":"frage","rev":1,"frage":"Ende WiSe 1961/62","antworten":["Auszug aus der Wolbecker Straße"],"notiz":"Danach nur noch ein Nebenzimmer im „Schlegeleck“ am Ludgeriplatz."},{"id":"j-1963","typ":"frage","rev":1,"frage":"Ab 1963","antworten":["Kellerraum in der Königsstraße 45"]},{"id":"j-1968-haus","typ":"frage","rev":1,"frage":"Sommer 1968","antworten":["Kauf des Hauses in der Wehrstraße 1a für 150.000 DM"],"notiz":"Der Umbau dauerte 2½ Jahre und kostete weitere 150.000 DM. Die Aktiven konnten Ende 1970 einziehen."},{"id":"j-1968-satzung","typ":"frage","rev":1,"frage":"WiSe 1968/69","antworten":["Satzungsänderung"],"notiz":"Abgeschafft: Fuxenstatus, Burschung, Zipfel, Kommerse, Singen von Studentenliedern. Umbenannt: AB Ingvaeonia in AMB Münster, Verbindung in Bund, Konvent in Mitgliederversammlung, Präside in 1. Vorsitzender."},{"id":"j-1971","typ":"frage","rev":1,"frage":"1971","antworten":["Kieler Beschlüsse — die Aufnahme von Damen wird erlaubt"],"notiz":"Wenig Unterstützung vom SV. Der AMB war damals drittstärkster Bund im SV und wuchs durch die Aufnahme von Frauen und das Haus stark."},{"id":"j-bis-1983","typ":"frage","rev":1,"frage":"Bis 1983","antworten":["Zwar Bewohner und Mitglieder auf dem Haus, aber kein Bundesleben"]},{"id":"j-1983","typ":"frage","rev":1,"frage":"1983","antworten":["Wiederbelebung des AMB durch die Verbandsbrüder Ingo Freiherr von Stillfried und Uwe Focke"],"notiz":"Beide zweitaktiv in Münster."},{"id":"j-1985","typ":"frage","rev":1,"frage":"WiSe 1985/86","antworten":["SV-Vertretertag in München — Umbenennung in AMB Ingvaeonia und Verabschiedung der neuen Satzung"],"notiz":"Das „Bonner SV-Präsidium“ war komplett zweitaktiv in Münster. Verstärktes Interesse am AMB als Gemischtbund, der AMB wurde zum „Musterbund“. Erste Verleihung des Traditionsträgers der Fridericiana zu Breslau."},{"id":"j-1987","typ":"frage","rev":1,"frage":"1987","antworten":["Großes Stiftungsfest zum 40-jährigen Bestehen"]},{"id":"j-1988","typ":"frage","rev":1,"frage":"1988","antworten":["Stiftung des bronzenen Hausschilds durch „OK“ Dietrich Heinemann"]},{"id":"j-1980er","typ":"frage","rev":1,"frage":"Ende der 1980er Jahre","antworten":["Viel Engagement im SV — insgesamt vier Mal das komplette SV-Präsidium gestellt und zwei Mal den SV-Kassenwart"]},{"id":"j-1993","typ":"frage","rev":1,"frage":"Ab 1993","antworten":["Aufnahme von Damen in den AHV"],"notiz":"Erst zu diesem Zeitpunkt erlaubte der VASV Damen."},{"id":"j-1996","typ":"frage","rev":1,"frage":"1996","antworten":["Überreichung des Fechters durch die Fridericiana zu Breslau"]},{"id":"j-2000er","typ":"frage","rev":1,"frage":"2000er Jahre","antworten":["Große Fluktuation auf dem Haus und dadurch wenige Eintritte in den AHV"]},{"id":"warum-universitas","typ":"frage","rev":1,"frage":"Warum hieß der Bund bei der Gründung AB Universitas und nicht Ingvaeonia?","antworten":["Der englischen Militärregierung gefiel der Name Ingvaeonia nicht. Außerdem wünschte sie sich Frauen im Bund. Der Bund erhielt die Wahl: entweder ein entmilitarisierter Name oder Frauen im Bund — der Name wurde geopfert."]},{"id":"woher-ingvaeonia","typ":"frage","rev":1,"frage":"Wonach ist der Name Ingvaeonia benannt?","antworten":["Nach der Kulturgemeinschaft germanischer Stämme, die im Raum Münster/Osnabrück siedelten"]},{"id":"warum-patenschaft","typ":"frage","rev":1,"frage":"Warum schloss der Bund 1954 ein Patenschaftsabkommen mit dem AHV der Fridericiana zu Breslau?","antworten":["Die AB Ingvaeonia hatte eine Aktivitas, aber keinen bzw. nur einen sehr kleinen AHV. Breslau hatte einen AHV, aber keine Aktivitas mehr."]},{"id":"abgeschafft-1968","typ":"frage","rev":1,"frage":"Was wurde mit der Satzungsänderung im WiSe 1968/69 abgeschafft?","antworten":["Fuxenstatus, Burschung, Zipfel, Kommerse und das Singen von Studentenliedern"]},{"id":"umbenannt-1968","typ":"frage","rev":1,"frage":"Was wurde mit der Satzungsänderung im WiSe 1968/69 umbenannt?","antworten":["AB Ingvaeonia in AMB Münster, Verbindung in Bund, Konvent in Mitgliederversammlung, Präside in 1. Vorsitzender"]},{"id":"gesundschrumpfen","typ":"frage","rev":1,"frage":"Was folgte auf die lose Führung des Bundes nach 1971?","antworten":["Motivgruppen und Info-AG statt erzwungener Teilnahme am Bundesleben, dazu fehlende bzw. aufgelöste Strukturen — daraus ein starker Schwund der Mitgliederzahlen, das „Gesundschrumpfen“. Die Gefahr wurde zu spät erkannt."]},{"id":"fruehes-bundesleben","typ":"frage","rev":1,"frage":"Wie sah das frühe Bundesleben nach der Aufnahme in den SV aus?","antworten":["Wöchentliche Fuxenstunden durch den Fuxmajor, Chorübungen, wöchentliche Treffen und wissenschaftliche Vorträge. Füxe durften am Burschenkonvent nicht teilnehmen."]},{"id":"reihe-heime","typ":"reihenfolge","rev":1,"frage":"Bringe die Heime des Bundes in die richtige Reihenfolge.","elemente":["Wolbecker Straße (ab 1957)","Nebenzimmer im „Schlegeleck“ am Ludgeriplatz (ab 1961/62)","Kellerraum in der Königsstraße 45 (ab 1963)","Eigenes Haus in der Wehrstraße 1a (Einzug Ende 1970)"]},{"id":"reihe-namen","typ":"reihenfolge","rev":1,"frage":"Bringe die Namen des Bundes in die richtige Reihenfolge.","elemente":["AB Universitas","AB Ingvaeonia","AMB Münster","AMB Ingvaeonia"]}]},{"schema":1,"id":"comment-kneipe","titel":"Comment: Kneipe und Kommers","untertitel":"Ablauf, Regeln, Kleidung","quelle":"Ältestenrat, Fuxenstunde „Studentische Traditionen und Bummeln“","stand":"2026-09-07","karten":[{"id":"reihe-drei-teile","typ":"reihenfolge","rev":1,"frage":"Bringe die drei Teile eines Kneipabends in die richtige Reihenfolge.","elemente":["Officium","Inoffizium","Bierdorf"]},{"id":"reihe-ablauf","typ":"reihenfolge","rev":1,"frage":"Bringe den Ablauf einer Kneipe in die richtige Reihenfolge.","elemente":["Eröffnung","Begrüßung","Grußworte","Prinzipienrede","Kolloquium",["Biermimik","Spiele"],"Bierdorf"],"notiz":"Eröffnung bis Kolloquium gehören zum Officium, Biermimik und Spiele zum Inoffizium. Untereinander ist ihre Reihenfolge nicht festgelegt."},{"id":"eroeffnungssatz","typ":"frage","rev":1,"frage":"Mit welchem Satz eröffnet der oder die Präsid*in die Kneipe?","antworten":["„Das Kommando dieser Veranstaltung liegt bei mir und nur bei mir.“"]},{"id":"kneiplatein-regel","typ":"lueckentext","rev":1,"titel":"Die Regel auf der Kneipe","text":"non licet {{vagari}} neque {{fumare}} neque {{telecomunicare}}","notiz":"Nicht aufstehen (außer in den Kolloquien), nicht rauchen, nicht telefonieren."},{"id":"regeln-kneipe","typ":"frage","rev":1,"frage":"Welche Regeln gelten auf der Kneipe?","antworten":["Nicht aufstehen (außer in den Kolloquien), nicht rauchen, nicht telefonieren, nicht laut reden — aufpassen und aktiv teilnehmen"],"notiz":"„non licet vagari neque fumare neque telecomunicare“"},{"id":"sehr-verehrlich","typ":"frage","rev":1,"frage":"Welche Bünde werden bei der Begrüßung mit „sehr verehrlich“ angesprochen?","antworten":["Die Gründungsbünde und die Bünde, die das Präsidium stellen. Alle anderen werden mit „verehrlich“ angesprochen."],"notiz":"Im SV also München und Berlin (immer) sowie der Bund, der den SVx stellt."},{"id":"begruessung-ablauf","typ":"frage","rev":1,"frage":"Wie läuft die Begrüßung auf einer Kneipe ab?","antworten":["Alle anwesenden Bünde werden namentlich genannt — man steht auf und stößt an. Träger von Ehrenzeichen werden persönlich begrüßt, wichtige Vorstände oder Vertreter namentlich."]},{"id":"grussworte","typ":"frage","rev":1,"frage":"Wann meldet man Grußworte an, und was gehört hinein?","antworten":["Ist man irgendwo zu Gast, meldet man Grußworte an und richtet sie an den Gastgeberbund: Danken, Loben, Werben."],"notiz":"Gerne bringt man ein Gastgeschenk mit, bei uns häufig Sasse — eine Münsteraner Spezialität."},{"id":"prinzipienrede","typ":"frage","rev":1,"frage":"Wer hält die Prinzipienrede und worüber?","antworten":["Der oder die Kneippräsid*in hält eine dem Anlass angemessene Rede, gerne mit persönlichen Meinungen."]},{"id":"kolloquium-regel","typ":"frage","rev":1,"frage":"Was darf man im Kolloquium, und was nicht?","antworten":["Man darf miteinander sprechen, bleibt aber an seinem Platz, bis der oder die Kneippräsid*in das OK gibt. Im Zweifel bittet man durch Handzeichen darum."],"notiz":"Das Kolloquium wird vom Kneippräsidium ausgerufen."},{"id":"spiele-sv","typ":"frage","rev":1,"frage":"Auf wessen Kneipen gibt es Spiele, und wie sehen sie aus?","antworten":["Nur auf Kneipen des Sondershäuser Verbands. Das Präsidium überlegt sie sich für die Kneipe, gerne kurz gehalten, häufig ein Abdecken der Musen: Schreiben, Malen, Theater, Singen."]},{"id":"bierdorf-ablauf","typ":"frage","rev":1,"frage":"Was geschieht nach Beendigung der Kneipe?","antworten":["Das Bierdorf wird eingeläutet: geselliges Zusammensitzen, Tanzen und die Wahl eines Bürgermeisters oder einer Bürgermeisterin."]},{"id":"kleidung-herren","typ":"frage","rev":1,"frage":"Was schreibt der Kleidungscomment den Herren vor?","antworten":["Anzug, mindestens Jackett und Hemd, dazu Krawatte oder Fliege. Das Jackett bleibt an, bis der oder die Präsid*in das eigene Jackett auszieht. Die SV-Nadel sitzt am rechten Revers und zeigt zum Herzen."],"notiz":"Bei uns gilt: zieht das an, worin ihr euch wohlfühlt — aber dem Anlass angemessen."},{"id":"kleidung-damen","typ":"frage","rev":1,"frage":"Was schreibt der Kleidungscomment den Damen vor?","antworten":["Anzug oder Kleid, schick: Schultern bedeckt, knielang oder mit Strumpfhose, nicht zu freizügig. Die SV-Nadel sitzt rechts und zeigt zum Herzen."],"notiz":"Bei uns gilt: zieht das an, worin ihr euch wohlfühlt — aber dem Anlass angemessen."},{"id":"sv-nadel","typ":"frage","rev":1,"frage":"Wo wird die SV-Nadel getragen?","antworten":["Rechts, zum Herzen zeigend — bei den Herren am rechten Revers"]},{"id":"rollen-kneipe","typ":"frage","rev":1,"frage":"In welche Rollen sind die Kneipant*innen unterteilt?","antworten":["Präsidium, Chargen, Zapfen, Contrarium, Biermusikus bzw. Bierorgel, Bierversorgung und Corona"]},{"id":"zipfel-wann","typ":"frage","rev":1,"frage":"Wann werden Zipfel getauscht?","antworten":["Das erste Mal üblicherweise im Offiz einer Kneipe oder eines Kommerses. Freundschaftszipfel hingegen, wenn überhaupt, im Inoffiz."]},{"id":"zipfel-farben","typ":"frage","rev":1,"frage":"Wessen Farben tragen getauschte Zipfel?","antworten":["Immer die Farben des oder der Schenkenden"]},{"id":"braeuche-bummeln","typ":"frage","rev":1,"frage":"Welche drei Bräuche beim Bummeln nennt die Fuxenstunde?","antworten":["Die (An- und Ab-)Stafette, der Bierjunge (BJ) und der Generalbierjunge (GBJ)"],"notiz":"Scherzhaft auch Tierlunge und Generaltierlunge."},{"id":"couleurbummel-sitte","typ":"frage","rev":1,"frage":"Was erhält ein Korporierter, der auf dem Couleurbummel um Einlass bittet?","antworten":["Nach guter Sitte ein kostenloses Couleurbier"]},{"id":"couleurbummel-gruppe","typ":"frage","rev":1,"frage":"Wie groß ist eine Bummelgruppe üblicherweise, und wann kündigt man sich an?","antworten":["Normalerweise spontan und nicht größer als drei bis fünf Leute. Will man sicher eingelassen werden oder plant einen größeren Bummel, etwa im Semesterferienprogramm, ruft man vorher auf den angepeilten Häusern an und kündigt sich an."]}]},{"schema":1,"id":"begriffe","titel":"Fachbegriffe","untertitel":"Was heißt das eigentlich?","quelle":"Ältestenrat, Fuxenstunde „Studentische Traditionen und Bummeln“","stand":"2026-09-07","karten":[{"id":"kommers","typ":"begriff","rev":1,"richtung":"beide","begriff":"Kommers","definition":"Umtrunk, dessen äußerer Ablauf mit seinen Trinksitten durch einen Comment geregelt wird — die feierliche Form der Kneipe.","notiz":"Hat sich aus Bräuchen des 18. und 19. Jahrhunderts entwickelt und ist mehr als eine scherzhafte Parodie des früher streng eingehaltenen allgemeinen Comments."},{"id":"kneipe","typ":"begriff","rev":1,"richtung":"beide","begriff":"Kneipe","definition":"Lockerer Comment, freiere Gestaltung mit Reden, Einlagen und Gesängen — von unterhaltsamem Charakter."},{"id":"kolloquium","typ":"begriff","rev":1,"richtung":"beide","begriff":"Kolloquium","definition":"Vom Kneippräsidium ausgerufener Abschnitt, in dem miteinander gesprochen werden darf. Alle bleiben an ihren Plätzen, bis das Präsidium das OK gibt."},{"id":"biermimik","typ":"begriff","rev":1,"richtung":"beide","begriff":"Biermimik","definition":"Ein Sketch, den ein oder mehrere Verbindungsmitglieder auf einer Kneipe halten.","notiz":"Auch Bierschwefel oder Fuxenulk genannt."},{"id":"bierdorf","typ":"begriff","rev":1,"richtung":"beide","begriff":"Bierdorf","definition":"Wird nach Beendigung der Kneipe eingeläutet: geselliges Zusammensitzen, Tanzen und die Wahl eines Bürgermeisters oder einer Bürgermeisterin."},{"id":"leibverhaeltnis","typ":"begriff","rev":1,"richtung":"beide","begriff":"Leib- bzw. Bierverhältnis","definition":"Beziehung zwischen einem endgültigen und traditionell einem vorläufigen Mitglied, vergleichbar mit Pat*innen — geprägt von tiefer Freundschaft und Verbundenheit.","notiz":"Begrifflichkeiten: Biervater und Biermutter, Biertochter und Biersohn. Symbolisiert durch den Zipfeltausch."},{"id":"zipfelbund","typ":"begriff","rev":1,"richtung":"beide","begriff":"Zipfelbund","definition":"Besteht aus zwei- oder mehrfarbigen Bändern und einigen gravierten Metallschiebern, die die Bänder halten. Ein Zipfelbund enthält immer einen Bierzipfel und unterschiedlich viele, später getauschte Weinzipfel."},{"id":"bierzipfel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Bierzipfel","definition":"Das breite Band im Zipfelbund. Jeder Zipfelbund enthält genau einen."},{"id":"weinzipfel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Weinzipfel","definition":"Das schmale Band im Zipfelbund. Davon gibt es unterschiedlich viele, sie werden später getauscht."},{"id":"couleurbummel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Couleurbummel","definition":"Zug über die Häuser verschiedener Verbindungen. Gute Sitte ist, dass ein Korporierter, der um Einlass bittet, ein kostenloses Couleurbier erhält."},{"id":"fuxenbummel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Fuxenbummel","definition":"Besondere Form des Couleurbummels: der Fuxmajor zieht mit den Füxen über die Häuser, um sie in die couleurstudentische Gesellschaft einzuführen und ihnen andere Verbindungen zu zeigen."},{"id":"zirkel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Zirkel","definition":"Erkennungszeichen einer Verbindung oder eines Verbandes, bestehend aus einem Zusammenschluss einzelner Anfangsbuchstaben — etwa des Verbindungsnamens oder des Wahlspruchs."},{"id":"wahlspruch","typ":"begriff","rev":1,"richtung":"beide","begriff":"Wahlspruch","definition":"Stellt die wesentlichen Prinzipien einer Verbindung heraus, wobei immer die aktuell aktiv gelebte Interpretation Bedeutung haben sollte."},{"id":"wappen","typ":"begriff","rev":1,"richtung":"beide","begriff":"Wappen","definition":"In Verbindungen weit verbreitet; enthält neben den Farben und dem Zirkel meist weitere Elemente aus der Stadt, der Region oder der Fakultät."},{"id":"studentische-farben","typ":"begriff","rev":1,"richtung":"beide","begriff":"Studentische Farben","definition":"Erkennungsmerkmal einzelner Verbindungen oder Dachverbände. Sie finden sich in Fahnen, Zipfeln, Mützen, Farbbändern und sonstigen Couleurartikeln."}]},{"schema":1,"id":"verbandskunde","titel":"Verbandskunde","untertitel":"SV, Prinzipien, Zirkel","quelle":"Ältestenrat, Fuxenstunde „Studentische Traditionen und Bummeln“","stand":"2026-09-07","karten":[{"id":"sv-wahlspruch","typ":"frage","rev":1,"frage":"Wie lautet der Wahlspruch des SV?","antworten":["„Lied, Freundschaft, Vaterland“"]},{"id":"farbentragend","typ":"begriff","rev":1,"richtung":"beide","begriff":"Farbentragend","definition":"Die Mitglieder tragen üblicherweise Band und Mütze, sobald sie in Verbindungssache unterwegs sind."},{"id":"farbenfuehrend","typ":"begriff","rev":1,"richtung":"beide","begriff":"Farbenführend","definition":"Die Mitglieder führen Farben zu bestimmten Anlässen mit sich — etwa in Form von Zipfelbünden, Fahnen, Wappen und sonstigen Couleurgegenständen. Auf Band und Mütze wird verzichtet.","notiz":"Viele SV-Bünde sind farbenführend."},{"id":"schwarzes-prinzip","typ":"begriff","rev":1,"richtung":"beide","begriff":"Schwarzes Prinzip","definition":"Die Verbindung führt gar keine Farben, vereinzelt nur in Fahne und Wappen. Besteht zwischen den Mitgliedern ein echtes Freundschaftsband, muss dieses nicht durch äußere Zeichen bekundet werden."},{"id":"ingvaeonia-farben","typ":"frage","rev":1,"frage":"Wie beschreibt man die Farben des AMB Ingvaeonia?","antworten":["Schwarz mit goldgelber Perkussion auf karmesinrotem Grund","Karmesinrot-Goldgelb-Schwarz-Goldgelb-Karmesinrot"]},{"id":"zirkel-ingvaeonia","typ":"frage","rev":1,"frage":"Welche Buchstaben enthält unser Zirkel, und wofür stehen sie?","antworten":["V(ivat), C(rescat), F(loreat), I(ngvaeonia) — Blühe, wachse und gedeihe, Ingvaeonia"]},{"id":"zirkel-ausrufezeichen","typ":"frage","rev":1,"frage":"Was bedeutet das Ausrufezeichen „!“ im Zirkel?","antworten":["Es wird im SV als Zeichen der Aktiven geführt"]},{"id":"zirkel-wohin","typ":"frage","rev":1,"frage":"Wo gehört der Zirkel hin, und wer sollte ihn schreiben können?","antworten":["Jedes endgültige Mitglied sollte den Zirkel schreiben können. Er gehört in Verbindungsgästebücher und in den Schriftverkehr zwischen Verbindungen — hinter die Unterschrift, wenn man mag."]},{"id":"kein-wappen","typ":"frage","rev":1,"frage":"Warum haben wir weder ein „richtiges“ Wappen noch einen eigenen Wahlspruch?","antworten":["Wir mussten uns in der Gründungszeit den strengen Auflagen der englischen Besatzung unterwerfen, die keine Vereinigung mit konservativen Ansä n brauset, ihr {{Stürme}}, daher und dahin!\nWir aber sind allzeit zu {{singen}} bereit:\nNoch ist die blühende, goldene Zeit,\nnoch sind ¦:die {{Tage der Rosen}}!:¦"},{"id":"adk","typ":"frage","rev":1,"frage":"Was ist das ADK, und seit wann gibt es es?","antworten":["Das „Allgemeine Deutsche Kommersbuch“, seit 1858. Viele besitzen es."]},{"id":"sv-liederbuch","typ":"frage","rev":1,"frage":"Wie kam es zum SV-Liederbuch?","antworten":["Es wurde zu Beginn der 2000er Jahre unter Leitung von Vbr. Hans Dieter Fleischmann ausgearbeitet. Heute gilt die 2. Auflage von 2010."],"notiz":"Anlass waren die politisch-gesellschaftlichen Veränderungen seit Mitte des 20. Jahrhunderts und die daraus folgende Auswahl der Lieder. Einige alte Lieder sind im Bestand geblieben — als Gedenken an vergangene Zeiten, nicht als Bekenntnis unserer Gesinnung."},{"id":"liederbuch-struktur","typ":"reihenfolge","rev":1,"frage":"Wie ist das SV-Liederbuch gegliedert? Bringe die Teile in die richtige Reihenfolge.","elemente":["A — Verbandslieder, Nationalhymne, Bundeslieder","B — Lieder zum festlichen Kommers","C — Lieder zu Inoffizium, Fidulität und Bierdorf","D — Liedsätze und Kanons aus fünf Jahrhunderten"]}]}];

      karte.antworten = nimm("a");

    } else if (typ === "begriff") {
      karte.begriff = erste("b");
      karte.definition = erste("d");
      karte.richtung = "beide";
      if (!karte.definition) fehler.push(`Block ${nr + 1}: keine Definition (D:)`);

      karte.text = nimm("t").join("\n");

      karte.frage = erste("r");

        const teile = z.split("|").map((s) => s.trim()).filter(Boolean);
        return teile.length > 1 ? teile : teile[0];

      if (karte.elemente.length < 2) fehler.push(`Block ${nr + 1}: weniger als zwei Elemente (E:)`);
    }
    if (notiz) karte.notiz = notiz;
    karten.push(karte);
  });
  return { karten, fehler };
}

  aktualisiere();

  return [
    h("h1", { text: "Ältestenrat" }),
    h("p", { class: "sub", text: "Stoff für die Neuen: Couleur, Comment, Verbandskunde, Geschichte." }),
    kaputt.length ? h("p", { class: "fehler" },
      `${kaputt.length} Stapel konnten nicht geladen werden: ${kaputt.map((k) => k.id).join(", ")}. `,
      "Die Redaktionsansicht sagt, was fehlt.") : null,
    !store.speicherVerfuegbar() ? h("p", { class: "fehler",
      text: "Dieses Gerät lässt keinen Speicher zu — der Fortschritt gilt nur für diese Sitzung." }) : null,
    h("div", { class: "modes" },
      modusKnopf("faellig", "Fällige"),
      modusKnopf("alle", "Alle"),
      modusKnopf("fehler", "Nur Fehler")),
    liste,
    h("div", { class: "row" },
      knopfLernen,
      h("button", { class: "ghost", onclick: () => { location.hash = "#/statistik"; } }, "Statistik")),
    h("div", { class: "row eng" },
      h("button", { class: "ghost", onclick: () => { location.hash = "#/redaktion"; } }, "Redaktion")),
    h("p", { class: "hinweis" },
      "Fünf Fächer nach Leitner: gewusst rückt eine Karte ein Fach weiter (1 Tag, 3, 7, 21), ",
      "falsch setzt sie zurück auf Fach 1. Der Fortschritt bleibt auf diesem Gerät."),
  ];

  function faecherBalken(w) {
    if (!w.gesamt) return null;
    return h("div", { class: "faecher", "aria-hidden": "true" },
      w.faecher.map((n, i) => n
        ? h("span", { class: `f${i + 1}`, style: `flex:${n} 0 auto` })
        : null),
      w.faecher.reduce((a, b) => a + b, 0) < w.gesamt ? h("span", { class: "f0", style: "flex:1" }) : null);
  }
}

// ----------------------------------------------------------------- Lernen
function starteSitzung() {
  const einheiten = alleStapel
    .filter((s) => gewaehlt.has(s.id))
    .flatMap((s) => lerneinheiten(s));
  sitzung = neueSitzung(einheiten, modus);
  enthuellt = false;
  kartenObjekt = null;
  location.hash = "#/lernen";
}

function ansichtLernen() {
  if (!sitzung) { location.hash = "#/"; return []; }
  if (sitzung.fertig) return ansichtFertig();

  const einheit = sitzung.aktuell;
  if (!kartenObjekt) {
    kartenObjekt = erstelleKarte(einheit, () => zeichne());
    enthuellt = false;
  }

  const weiter = (gewusst) => {
    sitzung.antworte(gewusst);
    kartenObjekt = null;
    enthuellt = false;
    zeichne();
  };

  const kannEnthuellen = !kartenObjekt.bereit || kartenObjekt.bereit();
  const vorschlag = enthuellt && kartenObjekt.vorschlag ? kartenObjekt.vorschlag() : null;

  const knoepfe = enthuellt
    ? h("div", { class: "row" },
        h("button", { class: vorschlag === false ? "solid" : null, onclick: () => weiter(false) }, "Falsch"),
        h("button", { class: vorschlag === null || vorschlag === true ? "solid" : null,
                      onclick: () => weiter(true) }, "Gewusst"))
    : h("div", { class: "row" },
        h("button", { class: "solid", disabled: !kannEnthuellen,
                      onclick: () => { enthuellt = true; zeichne(); } }, "Antwort zeigen"),
        h("button", { class: "ghost", onclick: () => { sitzung.zurueckstellen(); kartenObjekt = null; zeichne(); } },
          "Später"));

  return [
    h("div", { class: "kopf" },
      h("p", { class: "sub", text: einheit.stapel.titel }),
      h("button", { class: "zurueck", onclick: () => { location.hash = "#/"; } }, "Übersicht")),
    kartenObjekt.frage(),
    enthuellt ? kartenObjekt.antwort() : null,
    knoepfe,
    h("div", { class: "score" },
      h("span", {}, "Offen ", h("b", { text: String(sitzung.schlange.length) }),
        " von ", h("b", { text: String(sitzung.gesamt) })),
      h("span", {}, "Gewusst ", h("b", { text: String(sitzung.richtig) }),
        " · Falsch ", h("b", { text: String(sitzung.falsch) }))),
    h("p", { class: "hinweis tasten-hinweis", text: enthuellt
      ? "Tastatur: G gewusst, F falsch."
      : "Tastatur: Leertaste zeigt die Antwort, S stellt zurück." }),
  ];
}

function ansichtFertig() {
  const s = sitzung;
  return [
    h("h1", { text: "Durch." }),
    h("p", { class: "sub",
      text: `${s.gesamt} Karten, ${s.richtig} mal gewusst, ${s.falsch} mal falsch.` }),
    h("div", { class: "row" },
      h("button", { class: "solid", onclick: () => { location.hash = "#/"; } }, "Zur Übersicht")),
  ];
}

// -------------------------------------------------------------- Statistik
function ansichtStatistik() {
  const werte = alleStapel.map(statistik);
  return [
    h("div", { class: "kopf" },
      h("h1", { text: "Statistik" }),
      h("button", { class: "zurueck", onclick: () => { location.hash = "#/"; } }, "Übersicht")),

      h("thead", {}, h("tr", {},
        h("th", { text: "Stapel" }),
        h("th", { class: "zahl", text: "Karten" }),
        h("th", { class: "zahl", text: "neu" }),
        h("th", { class: "zahl", text: "sitzen" }),

      h("tbody", {}, werte.map((w) => h("tr", {},

        h("td", { class: "zahl", text: String(w.gesamt) }),
        h("td", { class: "zahl", text: String(w.neu) }),
        h("td", { class: "zahl", text: String(w.sitzt) }),
        h("td", { class: "zahl", text: String(w.haken) }))))),
    h("p", { class: "hinweis",
      text: `„Sitzen“ heißt Fach 4 oder 5 von ${FAECHER}, „haken“ heißt: zuletzt falsch und noch in Fach 1 oder 2.` }),
    ...werte.flatMap((w) => {
      const liste = wasHakt(w.stapel);
      if (!liste.length) return [];
      return [
        h("h2", { text: `Was hakt — ${w.stapel.titel}` }),
        h("ul", { class: "hakt" }, liste.map(({ einheit, s }) => h("li", {},
          h("span", { class: "was" },
            einheit.karte.typ === "couleur"
              ? band(einheit.karte, hellPruefer(einheit.stapel), "miniband")
              : null,
            bezeichnung(einheit)),
          h("span", { class: "wie", text: `${s.falsch}× falsch · Fach ${s.fach}` })))),
      ];

    werte.every((w) => !wasHakt(w.stapel).length)
      ? h("p", { class: "leer", text: "Nichts hakt gerade." }) : null,
  ];
}

// ---------------------------------------------------------------- Rahmen
function zeichne() {
  const route = location.hash || "#/";
  leere(wurzel);
  let inhalt;
  if (route === "#/lernen") inhalt = ansichtLernen();
  else if (route === "#/statistik") inhalt = ansichtStatistik();
  else if (route === "#/redaktion") inhalt = redaktionsAnsicht(alleStapel, kaputt, () => { location.hash = "#/"; });
  else inhalt = ansichtStart();
  for (const teil of [inhalt].flat(Infinity)) if (teil) wurzel.append(teil);
}

function tasten(ev) {
  if (location.hash !== "#/lernen" || !sitzung || sitzung.fertig) return;
  const ziel = ev.target;
  if (ziel && (ziel.matches("input, textarea, select") || ziel.isContentEditable)) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

  const taste = ev.key.toLowerCase();
  if (!enthuellt && (ev.key === " " || taste === "enter")) {
    if (!kartenObjekt.bereit || kartenObjekt.bereit()) {
      ev.preventDefault(); enthuellt = true; zeichne();
    }
  } else if (!enthuellt && taste === "s") {
    ev.preventDefault(); sitzung.zurueckstellen(); kartenObjekt = null; zeichne();
  } else if (enthuellt && (taste === "g" || taste === "j")) {
    ev.preventDefault(); sitzung.antworte(true); kartenObjekt = null; enthuellt = false; zeichne();
  } else if (enthuellt && (taste === "f" || taste === "n")) {
    ev.preventDefault(); sitzung.antworte(false); kartenObjekt = null; enthuellt = false; zeichne();
  }
}

async function start() {
  try {
    const geladen = await ladeStapel();

      "Beim Öffnen per Doppelklick benutze bitte die Einzeldatei lernapp.html."));
    return;
  }

  const gemerkt = store.auswahl();
  const bekannt = new Set(alleStapel.map((s) => s.id));
  gewaehlt = new Set(
    (gemerkt && gemerkt.filter((id) => bekannt.has(id)).length ? gemerkt.filter((id) => bekannt.has(id))
      : alleStapel.map((s) => s.id)));

  window.addEventListener("hashchange", () => {
    if (location.hash === "#/lernen" && !sitzung) location.hash = "#/";
    else zeichne();
  });
  document.addEventListener("keydown", tasten);
  zeichne();
}

start();
