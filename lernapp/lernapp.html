<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e6dc">
<title>Ältestenrat — Lernstoff</title>
<style>
/* Optik der Prototypen: gedecktes Papier, Serifen für Namen, ruhige Flächen.
   Der einzige Schlagschatten im ganzen Blatt liegt unter dem Farbband. */
:root{
  --ink:#1b1d1a; --paper:#e9e6dc; --paper-2:#f6f4ee;
  --rule:#c3bfb0; --muted:#6c6b62; --accent:#3d5a3f;
  --warn:#7d3a2e;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0 auto; max-width:560px; background:var(--paper); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:18px 16px 40px;
}
h1,h2,.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:17px;margin:22px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
a{color:var(--ink)}

/* ---------------------------------------------------------- Kopfzeile */
.kopf{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
.kopf .sub{margin:0}
.zurueck{font-size:13px;color:var(--muted);background:none;border:0;padding:6px 2px;cursor:pointer;flex:0 0 auto}
.zurueck:hover{color:var(--ink)}

/* ------------------------------------------------------------- Knöpfe */
button{
  font:inherit;font-size:15px;border:1px solid var(--ink);background:var(--paper-2);
  color:var(--ink);padding:12px 14px;border-radius:3px;flex:1;cursor:pointer;
  text-align:center;
}
button:active{transform:translateY(1px)}
button.solid{background:var(--ink);color:var(--paper-2)}
button.ghost{border-color:var(--rule);color:var(--muted);flex:0 0 auto}
/* In einer Knopfreihe muss auch ein Nebenknopf schrumpfen dürfen, sonst
   schiebt eine lange Beschriftung die Seite über den Rand. */
.row > button.ghost{flex:0 1 auto;min-width:0}
button[disabled]{opacity:.4;cursor:default}
button[disabled]:active{transform:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,li:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px
}
.row{display:flex;gap:8px;margin-top:14px}
.row.eng{margin-top:8px}
.modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.modes button{font-size:13.5px;padding:9px 10px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper-2)}

/* --------------------------------------------------------- Stapelwahl */
.stapel{list-style:none;padding:0;margin:0 0 18px}
.stapel li{border-top:1px solid var(--rule)}
.stapel li:last-child{border-bottom:1px solid var(--rule)}
.stapel label{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;cursor:pointer}
.stapel label > div{flex:1 1 auto;min-width:0}
.stapel input[type=checkbox]{margin:2px 0 0;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.stapel .titel{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:18px;line-height:1.25}
.stapel .zeile{font-size:13px;color:var(--muted);margin-top:3px}
.stapel .zeile b{color:var(--ink);font-weight:600}

/* Fächerbalken: fünf Segmente, Fach 5 am dunkelsten. Keine Verläufe. */
.faecher{display:flex;gap:2px;height:6px;margin-top:8px}
.faecher span{flex:0 0 auto;min-width:2px}
.faecher .f0,.faecher .f1{background:#d6d2c4}  /* Fach 1 ist die leere Spur */
.faecher .f2{background:#b9b09a}
.faecher .f3{background:#93927f}
.faecher .f4{background:#6f7861}
.faecher .f5{background:var(--accent)}

/* -------------------------------------------------------------- Karte */
.band{
  height:216px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(0,0,0,.18),0 12px 28px -16px rgba(0,0,0,.55);
}
.band span{flex:1 1 0;position:relative;display:block}
.band span.hell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
.prompt{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 0}
.frage{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:21px;
  line-height:1.3;margin:0;padding:22px 2px 6px}
.frage.klein{font-size:18px}
.antwort{background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;padding:16px;margin-top:14px}
.antwort .farben{font-size:13px;color:var(--muted);margin:0 0 12px}
.antwort .name{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-size:20px;line-height:1.25;margin:0 0 2px}
.antwort .meta{font-size:13px;color:var(--muted);margin:0}
.antwort .text{font-size:16px;line-height:1.45;margin:0}
.antwort .text + .text{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.eintrag{margin:0 0 12px}
.eintrag:last-child{margin-bottom:0}
.multi{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--rule);
  padding-bottom:8px;margin:0 0 12px}
.notiz{font-size:13px;color:var(--muted);line-height:1.45;margin:12px 0 0;
  padding-top:10px;border-top:1px solid var(--rule)}

/* Der Wechsel zur Antwort ist die einzige Bewegung im Blatt. */
.antwort{animation:auf .16s ease-out}
@keyframes auf{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.antwort{animation:none}}

/* --------------------------------------------------------- Lückentext */
.lueckentext{font-size:16px;line-height:1.9;white-space:pre-wrap;margin:0}
.luecke{border-bottom:1px solid var(--ink);padding:0 .45em}
/* Die Lösung hält die Breite der Lücke, ist aber vor dem Auflösen weder zu
   sehen noch zu markieren, zu kopieren oder vorzulesen: visibility:hidden
   nimmt sie aus Darstellung, Auswahl und Zugänglichkeitsbaum, nicht aber
   aus dem Umbruch. Mit bloß durchsichtiger Schrift wäre sie kopierbar. */
.luecke .wort{visibility:hidden;font-weight:600}
.luecke.gefuellt{border-bottom-color:var(--accent);background:rgba(61,90,63,.09)}
.luecke.gefuellt .wort{visibility:visible}
/* Nur für Screenreader: nimmt keinen Platz, bleibt aber im Zugänglichkeitsbaum. */
.nur-vorlesen{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

/* --------------------------------------------------------- Reihenfolge */
.reihe{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.reihe button{
  display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;
  border-color:var(--rule);padding:11px 12px;font-size:15px;
}
.reihe button[aria-pressed="true"]{border-color:var(--ink)}
.reihe .nr{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);
  min-width:1.4em;flex:0 0 auto}
.reihe button[aria-pressed="true"] .nr{color:var(--ink);font-weight:600}
.reihe .richtig{border-color:var(--accent)}
.reihe .falsch{border-color:var(--warn)}
.reihe .richtig .nr{color:var(--accent)}
.reihe .falsch .nr{color:var(--warn)}

/* ------------------------------------------------------------- Fußzeile */
.score{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  color:var(--muted);border-top:1px solid var(--rule);margin-top:22px;padding-top:10px;gap:12px}
.score b{color:var(--ink);font-weight:600}

/* ------------------------------------------------------------ Statistik */
/* Auf schmalen Geräten scrollt die Tabelle in sich, nie die ganze Seite. */
.tabellenrahmen{overflow-x:auto;margin-top:6px;-webkit-overflow-scrolling:touch}
.tabelle{width:100%;min-width:340px;border-collapse:collapse;font-size:14px}
.tabelle th,.tabelle td{text-align:left;padding:9px 6px 9px 0;border-bottom:1px solid var(--rule)}
.tabelle th{font-size:12.5px;color:var(--muted);font-weight:400}
.tabelle td.zahl,.tabelle th.zahl{text-align:right;padding:9px 0 9px 12px;font-variant-numeric:tabular-nums}
.hakt{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.hakt li{padding:8px 0;border-bottom:1px solid var(--rule);display:flex;
  justify-content:space-between;gap:12px;align-items:center}
.hakt .was{display:flex;gap:9px;align-items:center;min-width:0;line-height:1.3}
.hakt .wie{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.hakt .miniband{display:flex;flex-direction:column;width:34px;height:20px;
  border-radius:2px;overflow:hidden;flex:0 0 auto}
.hakt .miniband span{flex:1 1 0}

/* ------------------------------------------------------------ Redaktion */
.feld{margin:0 0 14px}
.feld label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],textarea,select{
  font:inherit;font-size:15px;width:100%;background:var(--paper-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:10px 11px;
}
textarea{line-height:1.5;resize:vertical;min-height:96px}
textarea.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px}
.hinweis{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.fehler{font-size:13.5px;color:var(--warn);line-height:1.5;margin:10px 0 0}
.fehler ul{margin:6px 0 0;padding-left:18px}
.streifen{display:flex;gap:8px;align-items:center;margin:0 0 6px}
.streifen input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--rule);
  border-radius:3px;background:var(--paper-2);flex:0 0 auto}
.streifen input[type=text]{flex:1 1 auto}
.streifen input.breite{flex:0 0 76px}
.streifen button{flex:0 0 auto;padding:10px 12px;border-color:var(--rule);color:var(--muted)}
.leer{color:var(--muted);font-size:14px;line-height:1.5}

/* Auf dem Handy gibt es keine Tastatur — der Hinweis wäre nur Rauschen. */
@media (hover:none) and (pointer:coarse){ .tasten-hinweis{display:none} }

/* ===================================================== Held und Spiel === */

.figurkasten{display:flex;justify-content:center}
.figur{width:100%;max-width:210px;height:auto;display:block}
.figur.gross{max-width:240px}
.figur.klein{max-width:86px}

/* Kopfzeile der Übersicht: Figur, Name, Kontostand, Weg zur Kammer */
/* Auf schmalen Geräten rutscht der Knopf unter Figur und Namen, statt
   die Zeile über den Rand zu schieben. */
.heldzeile{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:0 0 14px;
  border-bottom:1px solid var(--rule);padding-bottom:14px}
.heldknopf{flex:0 0 auto;width:92px;padding:3px;border-color:var(--rule);background:var(--paper-2)}
.heldknopf .figurkasten{pointer-events:none}
.heldtext{flex:1 1 112px;min-width:0}
.heldname{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-size:19px;line-height:1.2;margin:0}
.heldtext .meta{font-size:12.5px;color:var(--muted);margin:1px 0 0}
.heldzeile > button.ghost{flex:0 1 auto;margin-left:auto;align-self:center;
  font-size:13.5px;padding:9px 10px;white-space:nowrap}

.kontostand{font-size:15px;margin:3px 0 0;letter-spacing:.01em}
.kontostand b{font-weight:600;font-variant-numeric:tabular-nums}

/* Der einzige bewegte Teil der App außer dem Aufdecken: der Münzgewinn. */
.lohn{color:var(--accent);font-weight:600;margin-right:8px;
  display:inline-block;animation:lohnAuf .28s ease-out}
.lohn b{color:var(--accent);font-weight:600}
@keyframes lohnAuf{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lohn{animation:none}}

.ausbeute{font-size:22px;margin:0;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
.ausbeute b{font-weight:600}
.ausbeute .meta{font-size:13px;font-family:inherit}

/* --------------------------------------------------- Charaktererstellung */
.wahl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.wahlknopf{flex:0 0 auto;font-size:14px;padding:10px 13px;border-color:var(--rule)}
.wahlknopf[aria-pressed="true"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.farbknopf{flex:0 0 auto;width:40px;height:40px;padding:0;border-radius:50%;
  border:2px solid var(--rule)}
.farbknopf[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--paper-2)}

/* ----------------------------------------------------- Kleiderkammer */
.schaufenster{display:flex;gap:14px;align-items:center;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;
  padding:12px 14px;margin-bottom:4px}
.schaufenster .figurkasten{flex:0 0 108px}
.schaufenster .figur{max-width:108px}
.beutel{flex:1 1 auto;min-width:0}
.beutel .kontostand{font-size:23px;margin:0}
.beutel .meta{font-size:12.5px;color:var(--muted);margin:3px 0 0;line-height:1.4}

.laden{list-style:none;padding:0;margin:0}
.laden li{display:flex;gap:12px;align-items:center;justify-content:space-between;
  border-top:1px solid var(--rule);padding:12px 2px}
.laden li:last-child{border-bottom:1px solid var(--rule)}
.laden li.besessen .warenname{color:var(--ink)}
.ware{flex:1 1 auto;min-width:0}
.warenname{font-size:15.5px;margin:0;line-height:1.3}
.ware .meta{font-size:12.5px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.preis{font-size:13px;color:var(--muted);margin:4px 0 0;font-variant-numeric:tabular-nums}
.marke{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:2px;
  padding:1px 5px;margin-left:7px;vertical-align:1px;white-space:nowrap}
.laden button{flex:0 0 auto;font-size:13.5px;padding:10px 12px;white-space:nowrap}

/* ------------------------------------------------------- Fahnenwahl */
.fahnenliste{list-style:none;padding:0;margin:0 0 4px}
.fahnenliste li{border-top:1px solid var(--rule)}
.fahnenliste li:last-child{border-bottom:1px solid var(--rule)}
.fahnenwahlknopf{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:0;background:none;padding:11px 2px;border-radius:0}
.fahnenwahlknopf:hover{background:var(--paper-2)}
.fahnenband{flex:0 0 auto}
.miniband.hoch{display:flex;flex-direction:column;width:26px;height:38px;
  border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.miniband.hoch span{flex:1 1 0}
.fahnentext{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.fahnenname{font-size:15px}
.fahnentext .meta{font-size:12.5px;color:var(--muted)}

/* --------------------------------------------------------- Frisurwahl */
.frisuren{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px;margin:0 0 6px}
.frisurknopf{padding:2px;border-color:var(--rule);background:var(--paper-2);
  aspect-ratio:1;display:block;overflow:hidden}
.frisurknopf svg{width:100%;height:100%;display:block}
.frisurknopf[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

/* ================================================== Echte Abfragen === */

/* Multiple Choice. Welche Möglichkeit die richtige ist, entscheidet eine
   Mischung in auswahl.js — nicht die Position. */
.wahlfeld{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:7px}
.wahlfeld button{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  border-color:var(--rule);padding:12px 13px;font-size:15px;line-height:1.35}
.wahlfeld .nr{flex:0 0 1.3em;font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;padding-top:2px}
.wahlfeld .wahltext{flex:1 1 auto;min-width:0}
.wahlfeld button.richtig{border-color:var(--accent);border-width:2px;padding:11px 12px;
  background:rgba(61,90,63,.10)}
.wahlfeld button.richtig .nr{color:var(--accent)}
.wahlfeld button.falsch{border-color:var(--warn);border-width:2px;padding:11px 12px;
  background:rgba(125,58,46,.09)}
.wahlfeld button.falsch .nr{color:var(--warn)}
.wahlfeld button.blass{opacity:.45}
.wahlfeld button[disabled]{opacity:1}
.wahlfeld button.blass[disabled]{opacity:.45}

/* Lücken zum Eintippen. Die Auswahl muss mindestens so genau sein wie die
   allgemeine Regel für input[type=text], sonst gewinnt deren Rahmen. */
input[type=text].lueckefeld{
  font:inherit;font-size:16px;font-weight:600;text-align:center;width:auto;
  border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;
  padding:0 .15em;margin:0 .12em;color:var(--ink);vertical-align:baseline;
  line-height:inherit;-webkit-appearance:none;appearance:none}
input[type=text].lueckefeld:focus{outline:none;border-bottom-color:var(--accent);
  background:rgba(61,90,63,.08)}
input[type=text].lueckefeld:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text].lueckefeld.richtig{border-bottom-color:var(--accent);color:var(--accent)}
input[type=text].lueckefeld.falsch{border-bottom-color:var(--warn);color:var(--warn)}
input[type=text].lueckefeld[readonly]{cursor:default}

/* Das Urteil nach einer Abfrage */
.urteil{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-size:19px;margin:14px 0 0;animation:lohnAuf .2s ease-out}
.urteil.gut{color:var(--accent)}
.urteil.schlecht{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.urteil{animation:none}}

/* Ein Knopf, der etwas unwiderruflich löscht, soll nicht aussehen wie die
   anderen — aber auch nicht schreien. */
button.gefaehrlich{color:var(--warn);border-color:var(--warn)}

/* --------------------------------------------------------- Kneipspiel */
/* Die Szene ist ein Bild, kein Bedienfeld: ruhige Flächen, eine Tuschelinie,
   keine Animation. Die Sprechblasen liegen als Text darüber, damit sie
   umbrechen dürfen — im SVG täten sie das nicht. */
.szene-rahmen{position:relative;margin:0 0 16px;border:1px solid var(--rule);
  border-radius:3px;overflow:hidden;background:#e7e0d1}
.szene-bild{display:block;line-height:0}
svg.szene{display:block;width:100%;height:auto}
.blase{position:absolute;max-width:40%;margin:0;padding:7px 9px;
  background:var(--paper-2);border:1.5px solid var(--ink);border-radius:4px;
  font-size:12.5px;line-height:1.35}
.blase::after{content:"";position:absolute;width:10px;height:10px;
  background:var(--paper-2);border:1.5px solid var(--ink);
  border-top:0;border-left:0;transform:rotate(45deg)}
.blase.ruf{left:3%;top:4%}
.blase.ruf::after{left:22px;bottom:-7px}
.blase.ich{right:2%;bottom:4%;max-width:36%;background:var(--ink);color:var(--paper-2);
  border-color:var(--ink)}
.blase.ich::after{background:var(--ink);border-color:var(--ink);left:-7px;top:14px;
  transform:rotate(135deg)}
button.breit{flex:1 1 auto}
</style>
</head>
<body>
<main id="app"></main>
<script>

er kein Bundesleben","antworten":["Bis 1983"],"prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-1983","typ":"frage","rev":2,"frage":"Wiederbelebung des AMB durch die Verbandsbrüder Ingo Freiherr von Stillfried und Uwe Focke","antworten":["1983"],"notiz":"Beide zweitaktiv in Münster.","prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-1985","typ":"frage","rev":2,"frage":"SV-Vertretertag in München — Umbenennung in AMB Ingvaeonia und Verabschiedung der neuen Satzung","antworten":["WiSe 1985/86"],"notiz":"Das „Bonner SV-Präsidium“ war komplett zweitaktiv in Münster. Verstärktes Interesse am AMB als Gemischtbund, der AMB wurde zum „Musterbund“. Erste Verleihung des Traditionsträgers der Fridericiana zu Breslau.","prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-1987","typ":"frage","rev":2,"frage":"Großes Stiftungsfest zum 40-jährigen Bestehen","antworten":["1987"],"prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-1988","typ":"frage","rev":2,"frage":"Stiftung des bronzenen Hausschilds durch „OK“ Dietrich Heinemann","antworten":["1988"],"prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-1980er","typ":"frage","rev":2,"frage":"Viel Engagement im SV — insgesamt vier Mal das komplette SV-Präsidium gestellt und zwei Mal den SV-Kassenwart","antworten":["Ende der 1980er Jahre"],"prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-1993","typ":"frage","rev":2,"frage":"Aufnahme von Damen in den AHV","antworten":["Ab 1993"],"notiz":"Erst zu diesem Zeitpunkt erlaubte der VASV Damen.","prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-1996","typ":"frage","rev":2,"frage":"Überreichung des Fechters durch die Fridericiana zu Breslau","antworten":["1996"],"prompt":"Wann war das?","gruppe":"jahr"},{"id":"j-2000er","typ":"frage","rev":2,"frage":"Große Fluktuation auf dem Haus und dadurch wenige Eintritte in den AHV","antworten":["2000er Jahre"],"prompt":"Wann war das?","gruppe":"jahr"},{"id":"warum-universitas","typ":"frage","rev":1,"frage":"Warum hieß der Bund bei der Gründung AB Universitas und nicht Ingvaeonia?","antworten":["Der englischen Militärregierung gefiel der Name Ingvaeonia nicht. Außerdem wünschte sie sich Frauen im Bund. Der Bund erhielt die Wahl: entweder ein entmilitarisierter Name oder Frauen im Bund — der Name wurde geopfert."],"gruppe":"ereignis"},{"id":"woher-ingvaeonia","typ":"frage","rev":1,"frage":"Wonach ist der Name Ingvaeonia benannt?","antworten":["Nach der Kulturgemeinschaft germanischer Stämme, die im Raum Münster/Osnabrück siedelten"],"gruppe":"ereignis"},{"id":"warum-patenschaft","typ":"frage","rev":1,"frage":"Warum schloss der Bund 1954 ein Patenschaftsabkommen mit dem AHV der Fridericiana zu Breslau?","antworten":["Die AB Ingvaeonia hatte eine Aktivitas, aber keinen bzw. nur einen sehr kleinen AHV. Breslau hatte einen AHV, aber keine Aktivitas mehr."],"gruppe":"ereignis"},{"id":"abgeschafft-1968","typ":"frage","rev":1,"frage":"Was wurde mit der Satzungsänderung im WiSe 1968/69 abgeschafft?","antworten":["Fuxenstatus, Burschung, Zipfel, Kommerse und das Singen von Studentenliedern"],"gruppe":"ereignis"},{"id":"umbenannt-1968","typ":"frage","rev":1,"frage":"Was wurde mit der Satzungsänderung im WiSe 1968/69 umbenannt?","antworten":["AB Ingvaeonia in AMB Münster, Verbindung in Bund, Konvent in Mitgliederversammlung, Präside in 1. Vorsitzender"],"gruppe":"ereignis"},{"id":"gesundschrumpfen","typ":"frage","rev":1,"frage":"Was folgte auf die lose Führung des Bundes nach 1971?","antworten":["Motivgruppen und Info-AG statt erzwungener Teilnahme am Bundesleben, dazu fehlende bzw. aufgelöste Strukturen — daraus ein starker Schwund der Mitgliederzahlen, das „Gesundschrumpfen“. Die Gefahr wurde zu spät erkannt."],"gruppe":"ereignis"},{"id":"fruehes-bundesleben","typ":"frage","rev":1,"frage":"Wie sah das frühe Bundesleben nach der Aufnahme in den SV aus?","antworten":["Wöchentliche Fuxenstunden durch den Fuxmajor, Chorübungen, wöchentliche Treffen und wissenschaftliche Vorträge. Füxe durften am Burschenkonvent nicht teilnehmen."],"gruppe":"ereignis"},{"id":"reihe-heime","typ":"reihenfolge","rev":1,"frage":"Bringe die Heime des Bundes in die richtige Reihenfolge.","elemente":["Wolbecker Straße (ab 1957)","Nebenzimmer im „Schlegeleck“ am Ludgeriplatz (ab 1961/62)","Kellerraum in der Königsstraße 45 (ab 1963)","Eigenes Haus in der Wehrstraße 1a (Einzug Ende 1970)"]},{"id":"reihe-namen","typ":"reihenfolge","rev":1,"frage":"Bringe die Namen des Bundes in die richtige Reihenfolge.","elemente":["AB Universitas","AB Ingvaeonia","AMB Münster","AMB Ingvaeonia"]}]},{"schema":1,"id":"comment-kneipe","titel":"Comment: Kneipe und Kommers","untertitel":"Ablauf, Regeln, Kleidung","quelle":"Ältestenrat, Ältestenratsabend „Studentische Traditionen und Bummeln“","stand":"2026-09-07","karten":[{"id":"reihe-drei-teile","typ":"reihenfolge","rev":1,"frage":"Bringe die drei Teile eines Kneipabends in die richtige Reihenfolge.","elemente":["Officium","Inoffizium","Bierdorf"]},{"id":"reihe-ablauf","typ":"reihenfolge","rev":2,"frage":"Bringe den Ablauf einer Kneipe in die richtige Reihenfolge.","elemente":["Eröffnung","Begrüßung","Grußworte","Prinzipienrede","Inoffiz","Bierdorf"]},{"id":"eroeffnungssatz","typ":"frage","rev":2,"frage":"Mit welchem Satz eröffnet der oder die Präsid*in die Kneipe?","antworten":["„Das Kommando dieser Veranstaltung liegt bei mir und nur bei mir.“"],"ablenker":["„Das Kommando dieser Veranstaltung liegt bei mir und beim Contrarium.“","„Die Kneipe ist eröffnet, das Kommando liegt beim Präsidium.“","„Hiermit eröffne ich die Kneipe im Namen des Bundes.“"]},{"id":"kneiplatein-regel","typ":"lueckentext","rev":1,"titel":"Die Regel auf der Kneipe","text":"non licet {{vagari}} neque {{fumare}} neque {{telecomunicare}}","notiz":"Nicht aufstehen (außer in den Kolloquien), nicht rauchen, nicht telefonieren."},{"id":"regeln-kneipe","typ":"frage","rev":1,"frage":"Welche Regeln gelten auf der Kneipe?","antworten":["Nicht aufstehen (außer in den Kolloquien), nicht rauchen, nicht telefonieren, nicht laut reden — aufpassen und aktiv teilnehmen"],"notiz":"„non licet vagari neque fumare neque telecomunicare“"},{"id":"sehr-verehrlich","typ":"frage","rev":2,"frage":"Welche Bünde werden bei der Begrüßung mit „sehr verehrlich“ angesprochen?","antworten":["Die Gründungsbünde und die Bünde, die das Präsidium stellen. Alle anderen werden mit „verehrlich“ angesprochen."],"notiz":"Im SV also München und Berlin (immer) sowie der Bund, der den SVx stellt.","ablenker":["Alle anwesenden Bünde. „Verehrlich“ bleibt den Gastgebern vorbehalten.","Nur die Bünde, die das Präsidium stellen. Die Gründungsbünde werden mit „verehrlich“ angesprochen.","Die Gründungsbünde und die Bünde mit eigenem Haus."]},{"id":"begruessung-ablauf","typ":"frage","rev":1,"frage":"Wie läuft die Begrüßung auf einer Kneipe ab?","antworten":["Alle anwesenden Bünde werden namentlich genannt — man steht auf und stößt an. Träger von Ehrenzeichen werden persönlich begrüßt, wichtige Vorstände oder Vertreter namentlich."]},{"id":"grussworte","typ":"frage","rev":1,"frage":"Wann meldet man Grußworte an, und was gehört hinein?","antworten":["Ist man irgendwo zu Gast, meldet man Grußworte an und richtet sie an den Gastgeberbund: Danken, Loben, Werben."],"notiz":"Gerne bringt man ein Gastgeschenk mit, bei uns häufig Sasse — eine Münsteraner Spezialität."},{"id":"prinzipienrede","typ":"frage","rev":1,"frage":"Wer hält die Prinzipienrede und worüber?","antworten":["Der oder die Kneippräsid*in hält eine dem Anlass angemessene Rede, gerne mit persönlichen Meinungen."]},{"id":"kolloquium-regel","typ":"frage","rev":1,"frage":"Was darf man im Kolloquium, und was nicht?","antworten":["Man darf miteinander sprechen, bleibt aber an seinem Platz, bis der oder die Kneippräsid*in das OK gibt. Im Zweifel bittet man durch Handzeichen darum."],"notiz":"Das Kolloquium wird vom Kneippräsidium ausgerufen."},{"id":"spiele-sv","typ":"frage","rev":2,"frage":"Auf wessen Kneipen gibt es Spiele, und wie sehen sie aus?","antworten":["Nur auf Kneipen des Sondershäuser Verbands. Das Präsidium überlegt sie sich für die Kneipe, gerne kurz gehalten, häufig ein Abdecken der Musen: Schreiben, Malen, Theater, Singen."],"ablenker":["Auf Kneipen aller Dachverbände. Das Contrarium überlegt sie sich.","Nur auf Kneipen des eigenen Bundes, und nur im Offiz.","Nur auf Kommersen des Sondershäuser Verbands."]},{"id":"bierdorf-ablauf","typ":"frage","rev":1,"frage":"Was geschieht nach Beendigung der Kneipe?","antworten":["Das Bierdorf wird eingeläutet: geselliges Zusammensitzen, Tanzen und die Wahl eines Bürgermeisters oder einer Bürgermeisterin."]},{"id":"kleidung-herren","typ":"frage","rev":1,"frage":"Was schreibt der Kleidungscomment den Herren vor?","antworten":["Anzug, mindestens Jackett und Hemd, dazu Krawatte oder Fliege. Das Jackett bleibt an, bis der oder die Präsid*in das eigene Jackett auszieht. Die SV-Nadel sitzt am rechten Revers und zeigt zum Herzen."],"notiz":"Bei uns gilt: zieht das an, worin ihr euch wohlfühlt — aber dem Anlass angemessen."},{"id":"kleidung-damen","typ":"frage","rev":1,"frage":"Was schreibt der Kleidungscomment den Damen vor?","antworten":["Anzug oder Kleid, schick: Schultern bedeckt, knielang oder mit Strumpfhose, nicht zu freizügig. Die SV-Nadel sitzt rechts und zeigt zum Herzen."],"notiz":"Bei uns gilt: zieht das an, worin ihr euch wohlfühlt — aber dem Anlass angemessen."},{"id":"sv-nadel","typ":"frage","rev":2,"frage":"Wo wird die SV-Nadel getragen?","antworten":["Rechts, zum Herzen zeigend — bei den Herren am rechten Revers"],"ablenker":["Links, zum Herzen zeigend — bei den Herren am linken Revers","Rechts, vom Herzen weg zeigend","Mittig am Kragen, nach oben zeigend"]},{"id":"rollen-kneipe","typ":"frage","rev":2,"frage":"In welche Rollen sind die Kneipant*innen unterteilt?","antworten":["Präsidium, Chargen, Zapfen, Contrarium, Biermusikus bzw. Bierorgel, Bierversorgung und Corona"],"ablenker":["Präsidium, Chargen, Zapfen, Contrarium, Fuxmajor, Bierversorgung und Corona","Präsidium, Chargen, Zapfen, Biermusikus, Kantus und Corona","Präsidium, Contrarium, Zapfen, Bierorgel und Philisterium"]},{"id":"zipfel-wann","typ":"frage","rev":2,"frage":"Wann werden Zipfel getauscht?","antworten":["Das erste Mal üblicherweise im Offiz einer Kneipe oder eines Kommerses. Freundschaftszipfel hingegen, wenn überhaupt, im Inoffiz."],"ablenker":["Das erste Mal im Inoffiz; Freundschaftszipfel hingegen im Offiz.","Ausschließlich im Bierdorf, nach Beendigung der Kneipe.","Das erste Mal bei der Aufnahme als endgültiges Mitglied."]},{"id":"zipfel-farben","typ":"frage","rev":2,"frage":"Wessen Farben tragen getauschte Zipfel?","antworten":["Immer die Farben des oder der Schenkenden"],"ablenker":["Immer die Farben des oder der Beschenkten","Immer die Farben des Bundes, auf dessen Kneipe getauscht wird","Immer die Farben des SV"]},{"id":"braeuche-bummeln","typ":"frage","rev":2,"frage":"Welche drei Bräuche beim Bummeln nennt der Ältestenratsabend?","antworten":["Die (An- und Ab-)Stafette, der Bierjunge (BJ) und der Generalbierjunge (GBJ)"],"notiz":"Scherzhaft auch Tierlunge und Generaltierlunge.","ablenker":["Die Stafette, der Bierjunge und der Salamander","Der Bierjunge, der Generalbierjunge und der Fuxenulk","Die Stafette, das Couleurbier und der Zipfeltausch"]},{"id":"couleurbummel-sitte","typ":"frage","rev":2,"frage":"Was erhält ein Korporierter, der auf dem Couleurbummel um Einlass bittet?","antworten":["Nach guter Sitte ein kostenloses Couleurbier"],"ablenker":["Nach guter Sitte ein kostenloses Abendessen","Nach guter Sitte einen Platz im Offiz","Nach guter Sitte ein Gastgeschenk des Hauses"]},{"id":"couleurbummel-gruppe","typ":"frage","rev":1,"frage":"Wie groß ist eine Bummelgruppe üblicherweise, und wann kündigt man sich an?","antworten":["Normalerweise spontan und nicht größer als drei bis fünf Leute. Will man sicher eingelassen werden oder plant einen größeren Bummel, etwa im Semesterferienprogramm, ruft man vorher auf den angepeilten Häusern an und kündigt sich an."]}]},{"schema":1,"id":"begriffe","titel":"Fachbegriffe","untertitel":"Was heißt das eigentlich?","quelle":"Ältestenrat, Ältestenratsabend „Studentische Traditionen und Bummeln“","stand":"2026-09-07","karten":[{"id":"kommers","typ":"begriff","rev":1,"richtung":"beide","begriff":"Kommers","definition":"Umtrunk, dessen äußerer Ablauf mit seinen Trinksitten durch einen Comment geregelt wird — die feierliche Form der Kneipe.","notiz":"Hat sich aus Bräuchen des 18. und 19. Jahrhunderts entwickelt und ist mehr als eine scherzhafte Parodie des früher streng eingehaltenen allgemeinen Comments."},{"id":"kneipe","typ":"begriff","rev":1,"richtung":"beide","begriff":"Kneipe","definition":"Lockerer Comment, freiere Gestaltung mit Reden, Einlagen und Gesängen — von unterhaltsamem Charakter."},{"id":"kolloquium","typ":"begriff","rev":1,"richtung":"beide","begriff":"Kolloquium","definition":"Vom Kneippräsidium ausgerufener Abschnitt, in dem miteinander gesprochen werden darf. Alle bleiben an ihren Plätzen, bis das Präsidium das OK gibt."},{"id":"biermimik","typ":"begriff","rev":1,"richtung":"beide","begriff":"Biermimik","definition":"Ein Sketch, den ein oder mehrere Verbindungsmitglieder auf einer Kneipe halten.","notiz":"Auch Bierschwefel oder Fuxenulk genannt."},{"id":"bierdorf","typ":"begriff","rev":1,"richtung":"beide","begriff":"Bierdorf","definition":"Wird nach Beendigung der Kneipe eingeläutet: geselliges Zusammensitzen, Tanzen und die Wahl eines Bürgermeisters oder einer Bürgermeisterin."},{"id":"leibverhaeltnis","typ":"begriff","rev":1,"richtung":"beide","begriff":"Leib- bzw. Bierverhältnis","definition":"Beziehung zwischen einem endgültigen und traditionell einem vorläufigen Mitglied, vergleichbar mit Pat*innen — geprägt von tiefer Freundschaft und Verbundenheit.","notiz":"Begrifflichkeiten: Biervater und Biermutter, Biertochter und Biersohn. Symbolisiert durch den Zipfeltausch."},{"id":"zipfelbund","typ":"begriff","rev":1,"richtung":"beide","begriff":"Zipfelbund","definition":"Besteht aus zwei- oder mehrfarbigen Bändern und einigen gravierten Metallschiebern, die die Bänder halten. Ein Zipfelbund enthält immer einen Bierzipfel und unterschiedlich viele, später getauschte Weinzipfel."},{"id":"bierzipfel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Bierzipfel","definition":"Das breite Band im Zipfelbund. Jeder Zipfelbund enthält genau einen."},{"id":"weinzipfel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Weinzipfel","definition":"Das schmale Band im Zipfelbund. Davon gibt es unterschiedlich viele, sie werden später getauscht."},{"id":"couleurbummel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Couleurbummel","definition":"Zug über die Häuser verschiedener Verbindungen. Gute Sitte ist, dass ein Korporierter, der um Einlass bittet, ein kostenloses Couleurbier erhält."},{"id":"fuxenbummel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Fuxenbummel","definition":"Besondere Form des Couleurbummels: der Fuxmajor zieht mit den Füxen über die Häuser, um sie in die couleurstudentische Gesellschaft einzuführen und ihnen andere Verbindungen zu zeigen."},{"id":"zirkel","typ":"begriff","rev":1,"richtung":"beide","begriff":"Zirkel","definition":"Erkennungszeichen einer Verbindung oder eines Verbandes, bestehend aus einem Zusammenschluss einzelner Anfangsbuchstaben — etwa des Verbindungsnamens oder des Wahlspruchs."},{"id":"wahlspruch","typ":"begriff","rev":1,"richtung":"beide","begriff":"Wahlspruch","definition":"Stellt die wesentlichen Prinzipien einer Verbindung heraus, wobei immer die aktuell aktiv gelebte Interpretation Bedeutung haben sollte."},{"id":"wappen","typ":"begriff","rev":1,"richtung":"beide","begriff":"Wappen","definition":"In Verbindungen weit verbreitet; enthält neben den Farben und dem Zirkel meist weitere Elemente aus der Stadt, der Region oder der Fakultät."},{"id":"studentische-farben","typ":"begriff","rev":1,"richtung":"beide","begriff":"Studentische Farben","definition":"Erkennungsmerkmal einzelner Verbindungen oder Dachverbände. Sie finden sich in Fahnen, Zipfeln, Mützen, Farbbändern und sonstigen Couleurartikeln."}]},{"schema":1,"id":"verbandskunde","titel":"Verbandskunde","untertitel":"SV, Prinzipien, Zirkel","quelle":"Ältestenrat, Ältestenratsabend „Studentische Traditionen und Bummeln“","stand":"2026-09-07","karten":[{"id":"sv-wahlspruch","typ":"frage","rev":2,"frage":"Wie lautet der Wahlspruch des SV?","antworten":["„Lied, Freundschaft, Vaterland“"],"ablenker":["„Ehre, Freiheit, Vaterland“","„Lied, Freiheit, Vaterland“","„Lied, Freundschaft, Heimat“","„Religio, Scientia, Amicitia“"],"notiz":"„Ehre, Freiheit, Vaterland“ ist der Wahlspruch vieler Burschenschaften, nicht unserer."},{"id":"farbentragend","typ":"begriff","rev":2,"richtung":"beide","begriff":"Farbentragend","definition":"Die Mitglieder tragen üblicherweise Band und Mütze, sobald sie in Verbindungssache unterwegs sind.","ablenker":["Die Mitglieder führen Farben nur zu bestimmten Anlässen mit sich und verzichten auf Band und Mütze.","Die Verbindung führt gar keine Farben, vereinzelt nur in Fahne und Wappen.","Die Mitglieder tragen Band und Mütze ausschließlich auf Kneipen und Kommersen."]},{"id":"farbenfuehrend","typ":"begriff","rev":2,"richtung":"beide","begriff":"Farbenführend","definition":"Die Mitglieder führen Farben zu bestimmten Anlässen mit sich — etwa in Form von Zipfelbünden, Fahnen, Wappen und sonstigen Couleurgegenständen. Auf Band und Mütze wird verzichtet.","notiz":"Viele SV-Bünde sind farbenführend.","ablenker":["Die Mitglieder tragen üblicherweise Band und Mütze, sobald sie in Verbindungssache unterwegs sind.","Die Verbindung führt gar keine Farben, vereinzelt nur in Fahne und Wappen.","Die Mitglieder führen Farben ausschließlich in Form der Mütze mit sich."]},{"id":"schwarzes-prinzip","typ":"begriff","rev":2,"richtung":"beide","begriff":"Schwarzes Prinzip","definition":"Die Verbindung führt gar keine Farben, vereinzelt nur in Fahne und Wappen. Besteht zwischen den Mitgliedern ein echtes Freundschaftsband, muss dieses nicht durch äußere Zeichen bekundet werden.","ablenker":["Die Mitglieder tragen üblicherweise Band und Mütze, sobald sie in Verbindungssache unterwegs sind.","Die Mitglieder führen Farben zu bestimmten Anlässen mit sich und verzichten auf Band und Mütze.","Die Verbindung führt ausschließlich schwarze Farben."]},{"id":"ingvaeonia-farben","typ":"frage","rev":3,"frage":"Wie beschreibt man die Farben des AMB Ingvaeonia?","antworten":["Schwarz mit goldgelber Perkussion auf karmesinrotem Grund"],"notiz":"Ebenso richtig: Karmesinrot-Goldgelb-Schwarz-Goldgelb-Karmesinrot.","ablenker":["Schwarz mit karmesinroter Perkussion auf goldgelbem Grund","Goldgelb mit schwarzer Perkussion auf karmesinrotem Grund","Karmesinrot mit schwarzer Perkussion auf goldgelbem Grund"]},{"id":"zirkel-ingvaeonia","typ":"frage","rev":2,"frage":"Welche Buchstaben enthält unser Zirkel, und wofür stehen sie?","antworten":["V(ivat), C(rescat), F(loreat), I(ngvaeonia) — Blühe, wachse und gedeihe, Ingvaeonia"],"ablenker":["V(ivat), C(rescat), F(loreat), I(ngvaeonia) — Es lebe, wachse und blühe, Ingvaeonia","V(ivat), C(antat), F(loreat), I(ngvaeonia) — Lebe, singe und blühe, Ingvaeonia","V(ivat), C(rescat), F(lorescat), A(MB) — Blühe, wachse und gedeihe, AMB"]},{"id":"zirkel-ausrufezeichen","typ":"frage","rev":2,"frage":"Was bedeutet das Ausrufezeichen „!“ im Zirkel?","antworten":["Es wird im SV als Zeichen der Aktiven geführt"],"ablenker":["Es wird im SV als Zeichen der Alten Herren geführt","Es steht für den Lebensbund und wird von allen Mitgliedern geführt","Es kennzeichnet die farbentragenden Bünde im SV"]},{"id":"zirkel-wohin","typ":"frage","rev":2,"frage":"Wo gehört der Zirkel hin, und wer sollte ihn schreiben können?","antworten":["Jedes endgültige Mitglied sollte den Zirkel schreiben können. Er gehört in Verbindungsgästebücher und in den Schriftverkehr zwischen Verbindungen — hinter die Unterschrift, wenn man mag."],"ablenker":["Jedes Mitglied ab dem zweiten Semester sollte ihn schreiben können. Er gehört vor die Unterschrift.","Nur die Chargierten schreiben ihn, und zwar ausschließlich in Verbindungsgästebücher.","Er wird nur im Schriftverkehr mit dem SV-Präsidium verwendet."]},{"id":"kein-wappen","typ":"frage","rev":2,"frage":"Warum haben wir weder ein „richtiges“ Wappen noch einen eigenen Wahlspruch?","antworten":["Wir mussten uns in der Gründungszeit den strengen Auflagen der englischen Besatzung unterwerfen, die keine Vereinigung mit konservativen Ansätzen zuließ."],"notiz":"Umso mehr fühlen wir uns dem Wahlspruch des SV verbunden: Lied, Freundschaft, Vaterland.","ablenker":["Das Wappen ging im Zweiten Weltkrieg verloren und wurde nie neu gestiftet.","Der SV untersagt seinen Bünden eigene Wappen und Wahlsprüche.","Der Bund verzichtete 1968 mit der Satzungsänderung bewusst darauf."]},{"id":"nationalflagge","typ":"frage","rev":2,"frage":"Worauf beruhen die Farben der deutschen Nationalflagge?","antworten":["Auf den Farben der Urburschenschaft — Schwarz-Rot-Gold wird heute noch von einigen Burschenschaften getragen"],"ablenker":["Auf den Farben der Frankfurter Nationalversammlung von 1848","Auf den Farben des Lützowschen Freikorps, die der SV 1867 übernahm","Auf den Farben der Urburschenschaft — Schwarz-Weiß-Rot wird heute noch von einigen Burschenschaften getragen"]}]},{"schema":1,"id":"lieder","titel":"Lieder","untertitel":"Bundeslied und Liederbuch","quelle":"Ältestenrat, Ältestenratsabend „Studentische Traditionen und Bummeln“ — Strophen wörtlich übernommen, bis auf drei Schreibfehler der Vorlage: „heisst’s“ → „heißt’s“, das Wiederholungszeichen ¦: → |:, und „noch“ nach einem Punkt großgeschrieben.","stand":"2026-09-07","karten":[{"id":"bundeslied-name","typ":"frage","rev":3,"frage":"Wie heißt unser Bundeslied?","antworten":["„Noch ist die blühende goldene Zeit“"],"notiz":"Auch bekannt unter der Zeile „Noch sind die Tage der Rosen“.","ablenker":["„Gaudeamus igitur“","„O alte Burschenherrlichkeit“","„Noch sind die Rosen nicht verblüht“","„Wohlauf, die Luft geht frisch und rein“"]},{"id":"bundeslied-melodie","typ":"frage","rev":2,"frage":"Von wem stammt die Melodie des Bundeslieds?","antworten":["W. Baumgartner (1820–1867), Schweizer Chordirigent, Komponist und Pianist"],"ablenker":["O. Roquette (1824–1896), deutscher Schriftsteller und Professor für Literaturgeschichte","W. Baumgartner (1864–1912), deutscher Kapellmeister","F. Silcher (1789–1860), württembergischer Musikdirektor"],"gruppe":"bundeslied"},{"id":"bundeslied-text","typ":"frage","rev":2,"frage":"Von wem stammt der Text des Bundeslieds?","antworten":["O. Roquette (1824–1896), deutscher Schriftsteller hugenottischer Abstammung und Professor für Literaturgeschichte"],"notiz":"Mitglied der Fürstenthal-Burschenschaft Halle und der alten Heidelberger Burschenschaft Teutonia.","ablenker":["W. Baumgartner (1820–1867), Schweizer Chordirigent, Komponist und Pianist","O. Roquette (1824–1896), Schweizer Chordirigent und Pianist","J. V. von Scheffel (1826–1886), deutscher Dichter"],"gruppe":"bundeslied"},{"id":"bundeslied-str2","typ":"lueckentext","rev":2,"titel":"Bundeslied, 2. Strophe","text":"Frei ist das {{Herz}}, und frei das {{Lied}},\nund frei ist der {{Bursch}}, der die Welt durchzieht;\nund ein {{rosiger}} Kuss\nist nicht minder frei,\nso {{spröd}} und verschämt auch die Lippe sei.\nWo ein Lied erklingt, wo ein Kuss sich beut, da heißt’s:\nNoch ist blühende, goldene Zeit,\nnoch sind |:die {{Tage der Rosen}}!:|"},{"id":"bundeslied-str3","typ":"lueckentext","rev":2,"titel":"Bundeslied, 3. Strophe","text":"Ja im {{Herzen}} tief innen ist alles daheim,\nder {{Freude}} Saaten, der {{Schmerzen}} Keim.\nNoch ist die blühende goldene Zeit:\no du schöne Welt, wie bist du so {{weit}}!\nDrum {{frisch}} sei das Herz\nund {{lebendig}} der Sinn,\ndann brauset, ihr {{Stürme}}, daher und dahin!\nWir aber sind allzeit zu {{singen}} bereit:\nNoch ist die blühende, goldene Zeit,\nnoch sind |:die {{Tage der Rosen}}!:|"},{"id":"liederbuch-struktur","typ":"reihenfolge","rev":2,"frage":"Wie ist das SV-Liederbuch gegliedert? Bringe die Teile in die richtige Reihenfolge.","elemente":["A — Verbandslieder, Nationalhymne, Bundeslieder","B — Lieder zum festlichen Kommers","C — Lieder zu Inoffizium, Fidulität und Bierdorf","D — Liedsätze und Kanons aus fünf Jahrhunderten"]},{"id":"adk-wofuer","typ":"frage","rev":2,"gruppe":"liederbuch","frage":"Wofür steht die Abkürzung ADK?","antworten":["Allgemeines Deutsches Kommersbuch"],"ablenker":["Allgemeine Deutsche Kommersordnung","Akademisches Deutsches Kommersbuch","Allgemeines Deutsches Kneipbuch","Altes Deutsches Kommersbuch"],"notiz":"Viele besitzen es."},{"id":"adk-seit","typ":"frage","rev":2,"gruppe":"liedjahr","prompt":"Seit wann?","frage":"Seit wann gibt es das Allgemeine Deutsche Kommersbuch?","antworten":["1858"],"ablenker":["1848","1868","1885","1815"]},{"id":"sv-liederbuch-leitung","typ":"frage","rev":2,"gruppe":"liederbuch","frage":"Unter wessen Leitung wurde das SV-Liederbuch ausgearbeitet?","antworten":["Vbr. Hans Dieter Fleischmann"],"ablenker":["Vbr. Hans Dieter Fleischhauer","Vbr. Hans Dietrich Fleischmann","Vbr. Dieter Hans Fleischmann","AH Rasch"],"notiz":"Zu Beginn der 2000er Jahre. Heute gilt die 2. Auflage von 2010."},{"id":"sv-liederbuch-auflage","typ":"frage","rev":2,"gruppe":"liedjahr","prompt":"Welches Jahr?","frage":"Aus welchem Jahr stammt die heute gültige 2. Auflage des SV-Liederbuchs?","antworten":["2010"],"ablenker":["2000","2005","2012","1998"]},{"id":"sv-liederbuch-warum","typ":"frage","rev":2,"gruppe":"liederbuch","frage":"Warum wurde ein eigenes SV-Liederbuch ausgearbeitet?","antworten":["Wegen der politisch-gesellschaftlichen Veränderungen seit Mitte des 20. Jahrhunderts und der daraus folgenden Auswahl der Lieder"],"ablenker":["Weil das Allgemeine Deutsche Kommersbuch vergriffen war","Weil der VASV ein eigenes Liederbuch verlangte","Weil die Noten des ADK urheberrechtlich geschützt sind"],"notiz":"Einige alte Lieder sind ":"frage","rev":1,"gruppe":"jahr","prompt":"Wann war das?","frage":"Bonner Beschlüsse — Frauen können Vollmitglieder werden","antworten":["1976"],"notiz":"Im selben Jahr ergänzte der VASV-Vertretertag als Reaktion den Wahlspruch „Lied, Freundschaft, Vaterland“ um „Männerbund“ und „Lebensbund“. Die Satzungen von VASV und SV widersprachen sich damit grundlegend."},{"id":"sv-1984","typ":"frage","rev":1,"gruppe":"jahr","prompt":"Wann war das?","frage":"Aufnahme philistrierter Frauen in den AHV Göttingen — erneute Diskussion über die Damenfrage","antworten":["1984"],"notiz":"Göttingen zog die Anfrage zur Änderung der VASV-Satzung nach kontroversen Diskussionen zurück. Ein Antrag auf Ausschluss fand keine Mehrheit."},{"id":"sv-1993","typ":"frage","rev":1,"gruppe":"jahr","prompt":"Wann war das?","frage":"VASV-Vertretertag in Marburg — Streichung des Männerbundprinzips","antworten":["1993"],"notiz":"Seitdem gilt das Gestaltungsrecht der einzelnen Verbindungen."},{"id":"sv-gruendungsbuende","typ":"frage","rev":2,"gruppe":"sv","frage":"Welche beiden Bünde schlossen 1867 den Kartellvertrag, aus dem der SV wurde?","antworten":["Der Akademische Gesangverein München und die Akademische Liedertafel Berlin, heute AMV Berlin"],"ablenker":["Der Akademische Gesangverein München und der Akademische Gesangverein Berlin","Die Akademische Liedertafel Berlin und die Akademische Liedertafel Leipzig","Der Akademische Gesangverein München und die Akademische Liedertafel Dresden"]},{"id":"sv-absicht","typ":"frage","rev":1,"gruppe":"sv","frage":"Was war die ursprüngliche Absicht des Kartellvertrags von 1867?","antworten":["Austausch von Noten, Dirigenten, Chorsängern und Orchestermusikern"]},{"id":"sv-warum-sondershausen","typ":"frage","rev":2,"gruppe":"sv","frage":"Warum fand das erste Kartellfest ausgerechnet in Sondershausen statt?","antworten":["Es liegt auf halbem Weg zwischen München und Berlin"],"ablenker":["Dort wurde 1867 der Kartellvertrag unterzeichnet","Dort saß der erste Altherrenv       .map((z) => z.slice(2).trim());

      karte.antworten = nimm("a");

    } else if (typ === "begriff") {
      karte.begriff = erste("b");
      karte.definition = erste("d");
      karte.richtung = "beide";
      if (!karte.definition) fehler.push(`Block ${nr + 1}: keine Definition (D:)`);

      karte.text = nimm("t").join("\n");

        const teile = z.split("|").map((s) => s.trim()).filter(Boolean);
        return teile.length > 1 ? teile : teile[0];
      });
      if (karte.elemente.length < 2) fehler.push(`Block ${nr + 1}: weniger als zwei Elemente (E:)`);
    }
    if (notiz) karte.notiz = notiz;
    karten.push(karte);
  });
  return { karten, fehler };
}

    return h("div", { class: "faecher", "aria-hidden": "true" },
      w.faecher.map((n, i) => n
        ? h("span", { class: `f${i + 1}`, style: `flex:${n} 0 auto` })
        : null),
      w.faecher.reduce((a, b) => a + b, 0) < w.gesamt ? h("span", { class: "f0", style: "flex:1" }) : null);
  }
}

// ----------------------------------------------------------------- Lernen
function starteSitzung() {
  const einheiten = alleStapel
    .filter((s) => gewaehlt.has(s.id))
    .flatMap((s) => lerneinheiten(s));
  sitzung = neueSitzung(einheiten, modus);
  enthuellt = false;
  kartenObjekt = null;
  letzterLohn = null;
  ergebnis = null;
  sitzungsLohn = 0;
  bonusGezahlt = false;
  location.hash = "#/lernen";
}

function ansichtLernen() {
  if (!sitzung) { location.hash = "#/"; return []; }
  if (sitzung.fertig) return ansichtFertig();

  const einheit = sitzung.aktuell;
  if (!kartenObjekt) {
    kartenObjekt = erstelleKarte(einheit, {
      neuZeichnen: () => zeichne(),
      // Eine angetippte Wahl zählt sofort — kein „Gewusst“ hinterher,
      // bei dem man sich selbst belügen könnte.
      beiAntwort: (richtig) => { ergebnis = richtig; zeichne(); },
    });
    enthuellt = false;
    ergebnis = null;
  }

  const weiter = fortfahren;
  const spaeter = h("button", { class: "ghost",
    onclick: () => { sitzung.zurueckstellen(); kartenObjekt = null; ergebnis = null; zeichne(); } },
    "Später");

  const selbst = kartenObjekt.modus === "selbst";
  const beantwortet = selbst ? enthuellt : ergebnis !== null;

  let knoepfe;
  if (selbst && !enthuellt) {
    knoepfe = h("div", { class: "row" },
      h("button", { class: "solid", onclick: () => { enthuellt = true; zeichne(); } }, "Antwort zeigen"),
      spaeter);
  } else if (selbst) {
    knoepfe = h("div", { class: "row" },
      h("button", { onclick: () => weiter(false) }, "Falsch"),
      h("button", { class: "solid", onclick: () => weiter(true) }, "Gewusst"));
  } else if (!beantwortet && kartenObjekt.modus === "auswahl") {
    knoepfe = h("div", { class: "row" }, spaeter);     // das Antippen beantwortet
  } else if (!beantwortet) {
    knoepfe = h("div", { class: "row" },
      h("button", { class: "solid", disabled: kartenObjekt.bereit && !kartenObjekt.bereit(),
        onclick: () => { ergebnis = kartenObjekt.auswerten(); zeichne(); } }, "Prüfen"),
      spaeter);
  } else {
    knoepfe = h("div", { class: "row" },
      h("button", { class: "solid", onclick: () => weiter(ergebnis) }, "Weiter"));
  }

  const urteil = ergebnis === null ? null
    : h("p", { class: `urteil ${ergebnis ? "gut" : "schlecht"}`,
               text: ergebnis ? "Richtig." : "Daneben." });

  return [
    h("div", { class: "kopf" },
      h("p", { class: "sub", text: einheit.stapel.titel }),
      h("button", { class: "zurueck", onclick: () => { location.hash = "#/"; } }, "Übersicht")),
    kartenObjekt.frage(),
    kartenObjekt.feld ? kartenObjekt.feld() : null,
    urteil,
    beantwortet ? kartenObjekt.antwort() : null,
    knoepfe,
    h("div", { class: "score" },
      h("span", {}, "Offen ", h("b", { text: String(sitzung.schlange.length) }),
        " von ", h("b", { text: String(sitzung.gesamt) })),
      h("span", {},
        letzterLohn
          ? h("span", { class: "lohn" }, `+${letzterLohn.betrag + letzterLohn.bonus} `, MUENZE,
              letzterLohn.bonus ? h("b", { text: ` ${letzterLohn.serie}er-Serie!` }) : null)
          : null,
        " Richtig ", h("b", { text: String(sitzung.richtig) }),
        " · Falsch ", h("b", { text: String(sitzung.falsch) }))),
    h("p", { class: "hinweis tasten-hinweis", text: tastenHinweis(selbst, beantwortet) }),
  ];
}

function tastenHinweis(selbst, beantwortet) {
  if (beantwortet) return selbst ? "Tastatur: G gewusst, F falsch." : "Tastatur: Leertaste geht weiter.";
  if (selbst) return "Tastatur: Leertaste zeigt die Antwort, S stellt zurück.";
  if (kartenObjekt && kartenObjekt.modus === "auswahl") return "Tastatur: 1 bis 4 wählen, S stellt zurück.";
  return "Tastatur: Leertaste prüft, S stellt zurück.";
}

function ansichtFertig() {
  const s = sitzung;
  // Der Abschlussbonus wird einmal je Sitzung gezahlt, nicht bei jedem
  // Neuzeichnen dieses Bildes.
  if (!bonusGezahlt) {
    sitzungsLohn += sitzungsBonus();
    bonusGezahlt = true;
  }
  const hd = held();
  return [
    h("h1", { text: "Durch." }),
    h("p", { class: "sub",
      text: `${s.gesamt} Abfragen, ${s.richtig} mal gewusst, ${s.falsch} mal falsch.` }),
    figurKasten(beuteFarben(alleStapel), "figur"),
    h("div", { class: "antwort" },
      h("p", { class: "ausbeute" }, "+", h("b", { text: String(sitzungsLohn) }), " ", MUENZE,
        h("span", { class: "meta", text: "  in dieser Sitzung" })),
      h("p", { class: "meta", text: `Kontostand: ${hd.muenzen} · Rang: ${rang(hd.verdient).name}` })),
    h("div", { class: "row" },
      h("button", { class: "solid", onclick: () => { location.hash = "#/"; } }, "Zur Übersicht"),
      h("button", { class: "ghost", onclick: () => { location.hash = "#/kleiderkammer"; } },
        "Kleiderkammer")),
  ];
}

// -------------------------------------------------------------- Statistik
function ansichtStatistik() {
  const werte = alleStapel.map(statistik);
  return [
    h("div", { class: "kopf" },
      h("h1", { text: "Statistik" }),
      h("button", { class: "zurueck", onclick: () => { location.hash = "#/"; } }, "Übersicht")),
    h("div", { class: "tabellenrahmen" }, h("table", { class: "tabelle" },
      h("thead", {}, h("tr", {},
        h("th", { text: "Stapel" }),
        h("th", { class: "zahl", text: "Karten" }),
        h("th", { class: "zahl", text: "Abfragen" }),
        h("th", { class: "zahl", text: "neu" }),
        h("th", { class: "zahl", text: "sitzen" }),
        h("th", { class: "zahl", text: "haken" }))),
      h("tbody", {}, werte.map((w) => h("tr", {},
        h("td", { text: w.stapel.titel }),
        h("td", { class: "zahl", text: String(w.stapel.karten.length) }),
        h("td", { class: "zahl", text: String(w.gesamt) }),
        h("td", { class: "zahl", text: String(w.neu) }),
        h("td", { class: "zahl", text: String(w.sitzt) }),
        h("td", { class: "zahl", text: String(w.haken) })))))),
    h("p", { class: "hinweis",
      text: `„Sitzen“ heißt Fach 4 oder 5 von ${FAECHER}, „haken“ heißt: zuletzt falsch und noch in Fach 1 oder 2. `
        + "Ein Begriff, der in beide Richtungen abgefragt wird, ist eine Karte, aber zwei Abfragen." }),
    ...werte.flatMap((w) => {
      const liste = wasHakt(w.stapel);
      if (!liste.length) return [];
      return [
        h("h2", { text: `Was hakt — ${w.stapel.titel}` }),
        h("ul", { class: "hakt" }, liste.map(({ einheit, s }) => h("li", {},
          h("span", { class: "was" },
            einheit.karte.typ === "couleur"
              ? band(einheit.karte, hellPruefer(einheit.stapel), "miniband")
              : null,
            bezeichnung(einheit)),
          h("span", { class: "wie", text: `${s.falsch}× falsch · Fach ${s.fach}` })))),
      ];
    }),
    werte.every((w) => !wasHakt(w.stapel).length)
      ? h("p", { class: "leer", text: "Nichts hakt gerade." }) : null,
  ];
}

// ---------------------------------------------------------------- Rahmen
function zeichne() {
  const route = location.hash || "#/";
  leere(wurzel);
  let inhalt;
  if (route === "#/lernen") inhalt = ansichtLernen();
  else if (route === "#/statistik") inhalt = ansichtStatistik();
  else if (route === "#/held") inhalt = heldAnlegen(
    () => { location.hash = "#/"; },
    // Von vorn: auch den Lernfortschritt verwerfen, dann neu anlegen.
    () => { store.zuruecksetzen(); sitzung = null; kneipeBeenden(); gewaehlt = new Set(alleStapel.map((x) => x.id)); zeichne(); });
  else if (route === "#/kleiderkammer") inhalt = kleiderkammer(alleStapel, () => { location.hash = "#/"; });
  else if (route === "#/kneipspiel") inhalt = kneipspielAnsicht(
    alleStapel.find((s) => s.id === SPIEL_STAPEL),
    { zurueck: () => { location.hash = "#/"; }, neuZeichnen: () => zeichne() });
  // Die Redaktion steht nicht mehr auf der Startseite — die Neuen brauchen
  // sie nicht. Über die Adresse bleibt sie erreichbar.
  else if (route === "#/redaktion") inhalt = redaktionsAnsicht(alleStapel, kaputt, () => { location.hash = "#/"; });
  else inhalt = ansichtStart();
  for (const teil of [inhalt].flat(Infinity)) if (teil) wurzel.append(teil);
}

// --------------------------------------------------------- Spielstand
function spielstandSichern() {
  const daten = spielstandDaten(store.alleDaten());
  const name = (held().name || "held").toLowerCase().replace(/[^a-z0-9]+/g, "-") || "held";
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(daten, null, 2) + "\n"], { type: "application/json" }));
  const a = h("a", { href: url, download: `aeltestenrat-${name}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function spielstandOeffnen() {
  const eingabe = h("input", {
    type: "file", accept: ".json,application/json", style: "display:none",
    onchange: (ev) => {
      const datei = ev.currentTarget.files[0];
      if (!datei) return;
      const leser = new FileReader();
      leser.onload = () => {
        try {
          const daten = JSON.parse(leser.result);
          const hd = daten.held || {};
          if (!confirm(`Spielstand von „${hd.name || "ohne Namen"}“ vom ${daten.gesichert || "?"} laden?\n\n`
              + "Der Fortschritt auf diesem Gerät wird dabei überschrieben.")) return;
          spielstandLaden(daten, store.ersetzeAlles);
          location.hash = "#/";
          zeichne();
        } catch (fehler) {
          alert(`Konnte nicht geladen werden: ${fehler.message}`);
        }
      };
      leser.readAsText(datei);
    },
  });
  document.body.append(eingabe);
  eingabe.click();
  setTimeout(() => eingabe.remove(), 60000);
}

function tasten(ev) {
  const ziel0 = ev.target;
  if (location.hash === "#/kneipspiel") {
    if (ziel0 && (ziel0.matches("input, textarea, select") || ziel0.isContentEditable)) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^[1-9]$/.test(ev.key) && kneipTaste(Number(ev.key))) ev.preventDefault();
    return;
  }
  if (location.hash !== "#/lernen" || !sitzung || sitzung.fertig || !kartenObjekt) return;
  const ziel = ev.target;
  if (ziel && (ziel.matches("input, textarea, select") || ziel.isContentEditable)) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

  // Leertaste und Enter lösen einen fokussierten Knopf schon selbst aus.
  // Griffe die Abkürzung zusätzlich, passierte zweierlei auf einen Druck.
  const aufKnopf = ziel && ziel.tagName === "BUTTON";
  const taste = ev.key.toLowerCase();
  const leer = ev.key === " " || taste === "enter";
  const selbst = kartenObjekt.modus === "selbst";
  const beantwortet = selbst ? enthuellt : ergebnis !== null;

  const tu = (fn) => { ev.preventDefault(); fn(); };

  if (!beantwortet && taste === "s") {
    return tu(() => { sitzung.zurueckstellen(); kartenObjekt = null; ergebnis = null; zeichne(); });
  }
  if (!beantwortet && kartenObjekt.modus === "auswahl" && /^[1-9]$/.test(ev.key)) {
    return tu(() => kartenObjekt.waehle(Number(ev.key)));
  }
  if (leer && aufKnopf) return;
  if (!beantwortet && leer) {
    if (selbst) return tu(() => { enthuellt = true; zeichne(); });
    if (kartenObjekt.auswerten && (!kartenObjekt.bereit || kartenObjekt.bereit())) {
      return tu(() => { ergebnis = kartenObjekt.auswerten(); zeichne(); });
    }
    return;
  }
  if (beantwortet && !selbst && leer) {
    return tu(() => fortfahren(ergebnis));
  }
  if (beantwortet && selbst && (taste === "g" || taste === "j")) return tu(() => fortfahren(true));
  if (beantwortet && selbst && (taste === "f" || taste === "n")) return tu(() => fortfahren(false));
}

// Ein Weg nach vorn für Knöpfe und Tastatur. Das Fach vor der Bewertung
// bestimmt den Lohn: eine Karte, die noch im ersten Fach steckt, bringt
// am meisten.
function fortfahren(gewusst) {
  const einheit = sitzung.aktuell;
  if (!einheit) return;
  const altesFach = stand(einheit).fach;
  sitzung.antworte(gewusst);
  letzterLohn = verbuche(gewusst, altesFach);
  sitzungsLohn += letzterLohn.betrag + letzterLohn.bonus;
  kartenObjekt = null;
  enthuellt = false;
  ergebnis = null;
  zeichne();
}

async function start() {
  try {
    const geladen = await ladeStapel();
    alleStapel = geladen.stapel;
    kaputt = geladen.kaputt;
  } catch (fehler) {
    wurzel.append(h("p", { class: "fehler" },
      "Die Stapel konnten nicht geladen werden: ", String(fehler.message || fehler), ". ",
      "Beim Öffnen per Doppelklick benutze bitte die Einzeldatei lernapp.html."));
    return;
  }

  const gemerkt = store.auswahl();
  const bekannt = new Set(alleStapel.map((s) => s.id));
  gewaehlt = new Set(
    (gemerkt && gemerkt.filter((id) => bekannt.has(id)).length ? gemerkt.filter((id) => bekannt.has(id))
      : alleStapel.map((s) => s.id)));

  window.addEventListener("hashchange", () => {
    if (location.hash === "#/lernen" && !sitzung) location.hash = "#/";
    else zeichne();
  });
  document.addEventListener("keydown", tasten);

  // Ohne Helden geht gar nichts — der steht am Anfang.
  if (!held().angelegt && location.hash !== "#/held") {
    location.hash = "#/held";
    if (location.hash !== "#/held") zeichne();
  } else {
    zeichne();
  }
}

start();
