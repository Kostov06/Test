<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couleur in Münster</title>
<style>
  :root{--ink:#1b1d1a;--paper:#e9e6dc;--paper-2:#f6f4ee;--rule:#c3bfb0;--muted:#6c6b62;--accent:#3d5a3f}
  *{box-sizing:border-box}
  body{margin:0 auto;max-width:560px;background:var(--paper);color:var(--ink);
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding:18px 16px 40px}
  h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;font-size:22px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .band{height:216px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 1px 0 rgba(0,0,0,.18),0 12px 28px -16px rgba(0,0,0,.55)}
  .band span{flex:1 1 0;position:relative}
  .band span.pale::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
  .prompt{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 0}
  .answer{background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;padding:16px;margin-top:14px}
  .answer .farben{font-size:13px;color:var(--muted);margin:0 0 12px}
  .entry{margin:0 0 12px}
  .entry:last-child{margin-bottom:0}
  .entry .name{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:20px;line-height:1.25;margin:0 0 2px}
  .entry .meta{font-size:13px;color:var(--muted);margin:0}
  .multi{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:12px}
  .row{display:flex;gap:8px;margin-top:14px}
  button{font:inherit;font-size:15px;border:1px solid var(--ink);background:var(--paper-2);color:var(--ink);
    padding:12px 14px;border-radius:3px;flex:1;cursor:pointer}
  button:active{transform:translateY(1px)}
  button.solid{background:var(--ink);color:var(--paper-2)}
  button.ghost{border-color:var(--rule);color:var(--muted);flex:0 0 auto}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .score{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);
    border-top:1px solid var(--rule);margin-top:22px;padding-top:10px}
  .score b{color:var(--ink);font-weight:600}
  .modes{display:flex;gap:8px;margin-bottom:16px}
  .modes button{font-size:13.5px;padding:9px 10px}
  .modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper-2)}
</style>

<h1>Couleur in Münster</h1>
<p class="sub">Die aktiven Verbindungen. Farben sehen, Bund nennen, umdrehen.</p>

<div class="modes">
  <button id="mAll" aria-pressed="true">Alle 25</button>
  <button id="mMiss" aria-pressed="false">Nur Fehler</button>
</div>

<div id="app"></div>

<script>
const CARDS = [{"hex": ["#0f37cf", "#f0c31c", "#0f37cf"], "farben": "blau-gold-blau", "eintraege": [{"name": "L! Sorabia-Westfalen", "jahr": 1716, "verband": "CC", "anm": "Zweitband: weiß-schwarz-grün-weiß"}]}, {"hex": ["#95cef0", "#ffffff", "#101f78"], "farben": "hellblau-weiß-dunkelblau (v.u.)", "eintraege": [{"name": "S! zu St. Pauli Jena et Burgundia Breslau", "jahr": 1828, "verband": "DS", "anm": "Zweitband: weiß-blau-rot-weiß"}, {"name": "Akad. Ruderverbindung Westfalen", "jahr": 1891, "verband": "ARB", "anm": ""}]}, {"hex": ["#7b2f8f", "#ffffff", "#f0c31c"], "farben": "violett-weiß-gold", "eintraege": [{"name": "B! der Pflüger Halle", "jahr": 1837, "verband": "verbandsfrei", "anm": ""}]}, {"hex": ["#0f37cf", "#ffffff", "#17a02a"], "farben": "blau-weiß-grün", "eintraege": [{"name": "KDStV Sauerlandia", "jahr": 1847, "verband": "CV", "anm": ""}]}, {"hex": ["#0f37cf", "#ffffff", "#e2122b"], "farben": "blau-weiß-rot", "eintraege": [{"name": "L! Rhenania", "jahr": 1850, "verband": "CC", "anm": ""}]}, {"hex": ["#17a02a", "#e2122b", "#f0c31c"], "farben": "grün-rot-gold", "eintraege": [{"name": "KDStV Winfridia Breslau", "jahr": 1856, "verband": "CV", "anm": ""}]}, {"hex": ["#e2122b", "#ffffff", "#17a02a"], "farben": "rot-weiß-grün", "eintraege": [{"name": "VKDSt Saxonia", "jahr": 1863, "verband": "CV", "anm": ""}]}, {"hex": ["#e2122b", "#ffffff", "#141414"], "farben": "rot-weiß-schwarz", "eintraege": [{"name": "KStV Germania", "jahr": 1864, "verband": "KV", "anm": "farbenführend"}]}, {"hex": ["#7b2f8f", "#ffffff", "#e2122b"], "farben": "violett-weiß-rot", "eintraege": [{"name": "B! Franconia", "jahr": 1878, "verband": "DB", "anm": ""}]}, {"hex": ["#141414", "#ffffff", "#e2122b"], "farben": "schwarz-weiß-rot", "eintraege": [{"name": "VDSt Münster", "jahr": 1881, "verband": "VVDSt", "anm": "farbenführend"}]}, {"hex": ["#141414", "#f0c31c", "#17a02a"], "farben": "schwarz-gold-grün", "eintraege": [{"name": "KDStV Alemannia zu Greifswald und Münster", "jahr": 1891, "verband": "CV", "anm": ""}]}, {"hex": ["#7b2f8f", "#ffffff", "#141414"], "farben": "violett-weiß-schwarz", "eintraege": [{"name": "AV Cheruscia", "jahr": 1901, "verband": "CV", "anm": ""}]}, {"hex": ["#ffffff", "#e2122b", "#141414", "#ffffff"], "farben": "rot-schwarz auf weiß", "eintraege": [{"name": "AV Zollern", "jahr": 1901, "verband": "CV", "anm": ""}], "w": [0.5, 1, 1, 0.5]}, {"hex": ["#141414", "#f0c31c", "#e2122b"], "farben": "schwarz-gold-rot", "eintraege": [{"name": "KStV Markomannia", "jahr": 1901, "verband": "KV", "anm": "farbenführend"}]}, {"hex": ["#f0c31c", "#141414", "#ffffff"], "farben": "gold-schwarz-weiß", "eintraege": [{"name": "KStV Cimbria", "jahr": 1901, "verband": "KV", "anm": "farbenführend"}]}, {"hex": ["#e2122b", "#ffffff", "#f0c31c"], "farben": "rot-weiß-gold", "eintraege": [{"name": "ATV Westmark", "jahr": 1902, "verband": "ATB", "anm": "farbenführend"}, {"name": "Münsterscher Wingolf", "jahr": 1903, "verband": "WB", "anm": ""}]}, {"hex": ["#0f37cf", "#ffffff", "#f0c31c"], "farben": "blau-weiß-gold", "eintraege": [{"name": "WKStV Unitas Winfridia", "jahr": 1902, "verband": "UV", "anm": "farbenführend"}, {"name": "WKStV Unitas Rolandia", "jahr": 1919, "verband": "UV", "anm": "farbenführend"}, {"name": "WKStV Unitas Anna Westphalia", "jahr": 2016, "verband": "UV", "anm": "farbenführend"}]}, {"hex": ["#95cef0", "#c3c6cb", "#141414"], "farben": "hellblau-silber-schwarz", "eintraege": [{"name": "AV Alsatia", "jahr": 1904, "verband": "CV", "anm": ""}]}, {"hex": ["#ffffff", "#0f37cf", "#e2122b"], "farben": "weiß-blau-rot", "eintraege": [{"name": "Corps Rheno-Guestphalia", "jahr": 1908, "verband": "KSCV", "anm": "pflichtschlagend"}]}, {"hex": ["#17a02a", "#f0c31c", "#e2122b"], "farben": "grün-gold-rot", "eintraege": [{"name": "KStV Ravensberg", "jahr": 1919, "verband": "KV", "anm": "farbenführend"}]}, {"hex": ["#141414", "#ffffff", "#f2d200"], "farben": "schwarz-weiß-gelb", "eintraege": [{"name": "KStV Franko-Silesia-Breslau et Eresburg", "jahr": 1922, "verband": "KV", "anm": "farbenführend"}]}, {"hex": ["#e2122b", "#f2d200", "#141414", "#f2d200", "#e2122b"], "farben": "gelb-schwarz-gelb auf rot", "eintraege": [{"name": "AMB Ingvaeonia", "jahr": 1947, "verband": "SV", "anm": "farbenführend"}], "w": [1, 0.09, 0.9, 0.09, 1]}, {"hex": ["#17a02a", "#141414", "#ffffff"], "farben": "grün-schwarz-weiß", "eintraege": [{"name": "Akad. Jagdverbindung Hermann Löns", "jahr": 1954, "verband": "WJSC", "anm": ""}]}, {"hex": ["#c3c6cb", "#2fd3bd", "#f0c31c"], "farben": "silber-türkisgrün-gold", "eintraege": [{"name": "ADV Helenia Monasteria", "jahr": 1988, "verband": "verbandsfrei", "anm": ""}]}, {"hex": ["#ffffff", "#f3b4c6", "#141414"], "farben": "weiß-rosa-schwarz", "eintraege": [{"name": "ADV Athena", "jahr": 2012, "verband": "verbandsfrei", "anm": ""}]}];
const PALE = ["#ffffff","#c3c6cb","#f2d200","#f0c31c","#95cef0","#f3b4c6","#2fd3bd"];
let order=[], idx=0, shown=false, right=0, wrong=0, missed=new Set(), onlyMissed=false;

const shuffle = arr => { const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pool = () => onlyMissed && missed.size ? [...missed] : CARDS.map((_,i)=>i);
function build(){ order=shuffle(pool()); idx=0; shown=false; render(); }
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const c = CARDS[order[idx]];
  const w = c.w || c.hex.map(()=>1);
  const bands = c.hex.map((h,i) =>
    `<span style="background:${h};flex:${w[i]} 1 0" class="${PALE.includes(h)?'pale':''}"></span>`).join("");
  const multi = c.eintraege.length>1
    ? `<p class="multi">Diese Farben führen ${c.eintraege.length} Bünde.</p>` : "";
  const list = c.eintraege.map(e => `
      <div class="entry">
        <p class="name">${esc(e.name)}</p>
        <p class="meta">${e.jahr} · ${esc(e.verband)}${e.anm ? " · "+esc(e.anm) : ""}</p>
      </div>`).join("");
  document.getElementById("app").innerHTML = `
    <div class="band">${bands}</div>
    ${shown ? `
      <div class="answer">
        <p class="farben">${esc(c.farben)}</p>
        ${multi}${list}
      </div>
      <div class="row">
        <button id="no">Falsch</button>
        <button class="solid" id="yes">Gewusst</button>
      </div>` : `
      <p class="prompt">Welcher Bund?</p>
      <div class="row">
        <button class="solid" id="flip">Antwort zeigen</button>
        <button class="ghost" id="skip">Weiter</button>
      </div>`}
    <div class="score">
      <span>Karte <b>${idx+1}</b> von <b>${order.length}</b></span>
      <span>Gewusst <b>${right}</b> · Falsch <b>${wrong}</b></span>
    </div>`;
  const on=(id,fn)=>{const e=document.getElementById(id); if(e) e.onclick=fn;};
  on("flip",()=>{shown=true;render();});
  on("skip",next);
  on("yes",()=>{right++; missed.delete(order[idx]); next();});
  on("no",()=>{wrong++; missed.add(order[idx]); next();});
}
function next(){ shown=false; idx++; if(idx>=order.length){ order=shuffle(pool()); idx=0; } render(); }
document.getElementById("mAll").onclick=()=>{onlyMissed=false;setModes();build();};
document.getElementById("mMiss").onclick=()=>{ if(!missed.size) return; onlyMissed=true; setModes(); build(); };
function setModes(){
  document.getElementById("mAll").setAttribute("aria-pressed",!onlyMissed);
  document.getElementById("mMiss").setAttribute("aria-pressed",onlyMissed);
}
build();
</script>
