      'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';

    var now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    var core = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
      'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
      'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      '<dc:creator>Schichtplaner</dc:creator><cp:lastModifiedBy>Schichtplaner</cp:lastModifiedBy>' +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + now + '</dcterms:created>' +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + now + '</dcterms:modified>' +
      '</cp:coreProperties>';

    var app = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" ' +
      'xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
      '<Application>Schichtplaner</Application></Properties>';

    var files = [
      { name: '[Content_Types].xml', data: utf8(contentTypes) },
      { name: '_rels/.rels', data: utf8(rootRels) },
      { name: 'docProps/core.xml', data: utf8(core) },
      { name: 'docProps/app.xml', data: utf8(app) },
      { name: 'xl/workbook.xml', data: utf8(workbook) },
      { name: 'xl/_rels/workbook.xml.rels', data: utf8(workbookRels) },
      { name: 'xl/styles.xml', data: utf8(stylesXml()) }
    ];
    sheets.forEach(function (sheet, i) {
      files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: utf8(sheetXml(sheet)) });
    });

    return zip(files);
  }

  return { build: build, colName: colName, zip: zip, crc32: crc32 };
})();

</script>
<script>
/* ---- src/export.js ---- */
/* ============================================================
   export.js – Aufbau der Excel-Mappe aus Plan + Stammdaten
   ------------------------------------------------------------
   Tabellenblätter:
     1. Schichtplan       – eine Zeile je Schicht, Personen in Spalten
     2. Teilnehmende      – Namen, Zeiten, Auslastung
     3. Verfügbarkeiten   – Abwesenheiten und An-/Abreisezeiten
     4. Offene Schichten  – nicht besetzbare / problematische Schichten
     5. Veranstaltung     – Rahmendaten und Kennzahlen

   Alle Werte werden als Text bzw. einfache Zahlen geschrieben,
   damit die Datei anschließend problemlos von Hand weiter
   bearbeitet werden kann.
   ============================================================ */

window.Exporter = (function () {
  'use strict';

  var U = window.Util;

  function h(text) { return { v: text, s: 'header' }; }
  function c(value, style) { return { v: value, s: style || 'cell' }; }
  function n(value, style) { return { v: value, t: 'n', s: style || 'cell' }; }

  /* ---------------- Blatt 1: Schichtplan ---------------- */

  function sheetPlan(state, schedule) {
    var maxPeople = 1;
    schedule.slots.forEach(function (s) { maxPeople = Math.max(maxPeople, s.required); });

    var header = [h('Datum'), h('Aufgabe'), h('Startzeit'), h('Endzeit'), h('Dauer (min)')];
    for (var i = 0; i < maxPeople; i++) header.push(h('Person ' + (i + 1)));
    header.push(h('Bemerkung'));

    var rows = [];
    rows.push([{ v: state.event.name || 'Schichtplan', s: 'title' }]);
    rows.push([{
      v: U.formatDate(state.event.date) + ' · ' +
        U.formatTime(schedule.window.start) + '–' + U.formatTimeDay(schedule.window.end) +
        (state.event.notes ? ' · ' + state.event.notes : ''),
      s: 'muted'
    }]);
    rows.push([]);
    rows.push(header);

    var slots = schedule.slots.slice().sort(sortSlots);
    slots.forEach(function (slot) {
      var open = slot.required - slot.assigned.filter(Boolean).length;
      var rowStyle = open === 0 ? 'cell' : (open === slot.required ? 'bad' : 'warn');
      var row = [
        c(U.formatDate(U.dateForMinutes(state.event.date, slot.start)), rowStyle),
        c(slot.taskName, rowStyle),
        c(U.formatTime(slot.start), 'time'),
        c(U.formatTimeDay(slot.end), 'time'),
        n(slot.end - slot.start, rowStyle)
      ];
      for (var i = 0; i < maxPeople; i++) {
        if (i >= slot.required) { row.push(c('', 'cell')); continue; }
        var pid = slot.assigned[i];
        row.push(pid ? c(nameOf(state, pid), rowStyle) : c('— offen —', 'bad'));
      }
      var remark = [];
      if (open > 0) remark.push(open === 1 ? '1 Platz offen' : open + ' Plätze offen');
      if (slot.taskNote) remark.push(slot.taskNote);
      row.push(c(remark.join(' · '), open > 0 ? 'bad' : 'wrap'));
      rows.push(row);
    });

    if (!slots.length) rows.push([c('Keine Schichten vorhanden', 'cell')]);

    var columns = [{ width: 13 }, { width: 26 }, { width: 11 }, { width: 12 }, { width: 12 }];
    for (var k = 0; k < maxPeople; k++) columns.push({ width: 20 });
    columns.push({ width: 34 });

    return {
      name: 'Schichtplan',
      columns: columns,
      rows: rows,
      freeze: 4,
      headerRow: 4,
      autoFilter: true,
      autoFilterRow: 4
    };
  }

  function sortSlots(a, b) {
    return a.start - b.start || a.taskName.localeCompare(b.taskName, 'de') || a.end - b.end;
  }

  function nameOf(state, personId) {
    var p = null;
    for (var i = 0; i < state.people.length; i++) if (state.people[i].id === personId) p = state.people[i];
    return p ? (p.name || 'Ohne Namen') : 'Unbekannt';
  }

  /* ---------------- Blatt 2: Teilnehmende ---------------- */

  function sheetPeople(state, schedule) {
    var rows = [[
      h('Name'), h('Kommt ab'), h('Geht bis'), h('Notiz'),
      h('Anzahl Schichten'), h('Gesamtzeit (h)'), h('Aufgabenverteilung')
    ]];

    var byId = {};
    schedule.stats.perPerson.forEach(function (r) { byId[r.personId] = r; });

    state.people.forEach(function (p) {
      if (!p.name.trim()) return;
      var rec = byId[p.id] || { count: 0, minutes: 0, tasks: {} };
      var mix = Object.keys(rec.tasks).sort().map(function (t) {
        return t + ': ' + rec.tasks[t];
      }).join(', ');
      rows.push([
        c(p.name.trim(), 'bold'),
        c(p.arrival || '', 'time'),
        c(p.departure || '', 'time'),
        c(p.note || ''),
        n(rec.count),
        n(Math.round(rec.minutes / 60 * 100) / 100, 'number'),
        c(mix, 'wrap')
      ]);
    });

    return {
      name: 'Teilnehmende',
      columns: [{ width: 22 }, { width: 12 }, { width: 12 }, { width: 26 }, { width: 16 }, { width: 15 }, { width: 40 }],
      rows: rows,
      freeze: 1,
      headerRow: 1,
      autoFilter: true
    };
  }

  /* ---------------- Blatt 3: Verfügbarkeiten ---------------- */

  function sheetAvailability(state) {
    var rows = [[h('Person'), h('Art'), h('Nicht verfügbar von'), h('bis'), h('Grund')]];

    state.people.forEach(function (p) {
      if (!p.name.trim()) return;
      var name = p.name.trim();
      if (p.arrival) {
        rows.push([c(name, 'bold'), c('kommt später'), c(state.event.startTime, 'time'), c(p.arrival, 'time'), c('vor Ankunft')]);
      }
      if (p.departure) {
        rows.push([c(name, 'bold'), c('geht früher'), c(p.departure, 'time'), c(state.event.endTime, 'time'), c('nach Abreise')]);
      }
      state.absences.filter(function (a) { return a.personId === p.id; }).forEach(function (a) {
        rows.push([c(name, 'bold'), c('Abwesenheit'), c(a.startTime, 'time'), c(a.endTime, 'time'), c(a.reason || '')]);
      });
    });

    if (rows.length === 1) rows.push([c('Keine Einschränkungen erfasst – alle Personen sind durchgehend verfügbar.', 'cell')]);

    return {
      name: 'Verfügbarkeiten',
      columns: [{ width: 22 }, { width: 16 }, { width: 20 }, { width: 12 }, { width: 32 }],
      rows: rows,
      freeze: 1,
      headerRow: 1,
      autoFilter: true
    };
  }

  /* ---------------- Blatt 4: Offene Schichten ---------------- */

  function sheetIssues(state, schedule) {
    var rows = [[
      h('Aufgabe'), h('Datum'), h('Von'), h('Bis'),
      h('Benötigt'), h('Besetzt'), h('Fehlt'), h('Hinweis')
    ]];

    schedule.issues.forEach(function (issue) {
      var style = issue.severity === 'error' ? 'bad' : 'warn';
      rows.push([
        c(issue.taskName || '', style),
        c(issue.start != null ? U.formatDate(U.dateForMinutes(state.event.date, issue.start)) : '', style),
        c(issue.start != null ? U.formatTime(issue.start) : '', 'time'),
        c(issue.end != null ? U.formatTimeDay(issue.end) : '', 'time'),
        issue.required ? n(issue.required, style) : c('', style),
        issue.required ? n(issue.filled, style) : c('', style),
        issue.required ? n(issue.required - issue.filled, style) : c('', style),
        c(issue.message, 'wrap')
      ]);
    });

    if (rows.length === 1) {
      rows.push([c('Keine offenen oder problematischen Schichten – der Plan ist vollständig besetzt.', 'good')]);
    }

    return {
      name: 'Offene Schichten',
      columns: [{ width: 26 }, { width: 13 }, { width: 10 }, { width: 11 }, { width: 10 }, { width: 10 }, { width: 8 }, { width: 52 }],
      rows: rows,
      freeze: 1,
      headerRow: 1,
      autoFilter: true
    };
  }

  /* ---------------- Blatt 5: Veranstaltung ---------------- */

  function sheetInfo(state, schedule) {
    var s = schedule.stats;
    var rows = [];
    rows.push([{ v: 'Veranstaltung', s: 'title' }]);
    rows.push([]);
    rows.push([h('Feld'), h('Wert')]);
    rows.push([c('Name', 'bold'), c(state.event.name || '')]);
    rows.push([c('Datum', 'bold'), c(U.formatDate(state.event.date) + ' (' + U.weekdayName(state.event.date) + ')')]);
    rows.push([c('Beginn', 'bold'), c(U.formatTime(schedule.window.start), 'time')]);
    rows.push([c('Ende', 'bold'), c(U.formatTimeDay(schedule.window.end), 'time')]);
    rows.push([c('Dauer', 'bold'), c(U.formatDuration(schedule.window.end - schedule.window.start))]);
    rows.push([c('Bemerkungen', 'bold'), c(state.event.notes || '', 'wrap')]);
    rows.push([]);
    rows.push([h('Kennzahl'), h('Wert')]);
    rows.push([c('Aufgaben', 'bold'), n(state.tasks.length)]);
    rows.push([c('Personen', 'bold'), n(s.perPerson.length)]);
    rows.push([c('Schichten gesamt', 'bold'), n(s.totalSlots)]);
    rows.push([c('Benötigte Plätze', 'bold'), n(s.requiredSeats)]);
    rows.push([c('Besetzte Plätze', 'bold'), n(s.filledSeats)]);
    rows.push([c('Offene Plätze', 'bold'), s.openSeats ? n(s.openSeats, 'bad') : n(0, 'good')]);
    rows.push([c('Gesamtarbeitszeit (h)', 'bold'), n(Math.round(s.totalMinutes / 60 * 100) / 100, 'number')]);
    rows.push([c('Ø je Person (h)', 'bold'), n(Math.round(s.meanMinutes / 60 * 100) / 100, 'number')]);
    rows.push([c('Spanne min/max (h)', 'bold'), c(U.hoursText(s.minMinutes) + ' – ' + U.hoursText(s.maxMinutes))]);
    rows.push([]);
    rows.push([{ v: 'Erstellt am ' + new Date(schedule.generatedAt).toLocaleString('de-DE') +
      ' mit Schichtplaner (Zufallsstartwert ' + schedule.seed + ')', s: 'muted' }]);

    return {
      name: 'Veranstaltung',
      columns: [{ width: 26 }, { width: 46 }],
      rows: rows
    };
  }

  /* ---------------- Öffentliche API ---------------- */

  function buildWorkbook(state, schedule) {
    var opt = (state.options && state.options.exportSheets) || {};
    var sheets = [sheetPlan(state, schedule)];
    if (opt.people !== false) sheets.push(sheetPeople(state, schedule));
    if (opt.availability !== false) sheets.push(sheetAvailability(state));
    if (opt.issues !== false) sheets.push(sheetIssues(state, schedule));
    if (opt.info !== false) sheets.push(sheetInfo(state, schedule));
    return window.XlsxWriter.build(sheets);
  }

  function filename(state) {
    return 'Schichtplan_' + U.slugify(state.event.name) + '_' + (state.event.date || U.todayIso()) + '.xlsx';
  }

  function downloadXlsx(state, schedule) {
    var blob = buildWorkbook(state, schedule);
    U.downloadBlob(blob, filename(state));
  }

  /** Zusätzlicher CSV-Export des Schichtplans (Semikolon, Excel-tauglich) */
  function downloadCsv(state, schedule) {
    var maxPeople = 1;
    schedule.slots.forEach(function (s) { maxPeople = Math.max(maxPeople, s.required); });
    var head = ['Datum', 'Aufgabe', 'Startzeit', 'Endzeit', 'Dauer (min)'];
    for (var i = 0; i < maxPeople; i++) head.push('Person ' + (i + 1));
    head.push('Bemerkung');

    var lines = [head.join(';')];
    schedule.slots.slice().sort(sortSlots).forEach(function (slot) {
      var open = slot.required - slot.assigned.filter(Boolean).length;
      var cells = [
        U.formatDate(U.dateForMinutes(state.event.date, slot.start)),
        slot.taskName,
        U.formatTime(slot.start),
        U.formatTimeDay(slot.end),
        String(slot.end - slot.start)
      ];
      for (var j = 0; j < maxPeople; j++) {
        var pid = j < slot.required ? slot.assigned[j] : null;
        cells.push(j >= slot.required ? '' : (pid ? nameOf(state, pid) : 'offen'));
      }
      cells.push((open > 0 ? open + ' Plätze offen. ' : '') + (slot.taskNote || ''));
      lines.push(cells.map(csvCell).join(';'));
    });

    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    U.downloadBlob(blob, filename(state).replace(/\.xlsx$/, '.csv'));
  }

  function csvCell(value) {
    var s = String(value == null ? '' : value);
    return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  return {
    buildWorkbook: buildWorkbook,
    downloadXlsx: downloadXlsx,
    downloadCsv: downloadCsv,
    filename: filename
  };
})();

</script>
<script>
/* ---- src/ui.js ---- */
/* ============================================================
   ui.js – Darstellung der einzelnen Wizard-Schritte
   Liefert HTML-Strings; die Ereignisbehandlung übernimmt app.js
   per Delegation (data-action / data-bind).
   ============================================================ */

window.UI = (function () {
  'use strict';

  var U = window.Util;
  var e = U.escapeHtml;

  var STEPS = [
    { n: 1, label: 'Veranstaltung',   desc: 'Name, Datum, Zeitraum' },
    { n: 2, label: 'Personen',        desc: 'Wer kann eingeteilt werden?' },
    { n: 3, label: 'Aufgaben',        desc: 'Schichtarten und Längen' },
    { n: 4, label: 'Verfügbarkeit',   desc: 'Abwesenheiten eintragen' },
    { n: 5, label: 'Planungsregeln',  desc: 'Feineinstellungen' },
    { n: 6, label: 'Plan & Export',   desc: 'Ergebnis und Excel' }
  ];

  var TASK_PRESETS = [
    { name: 'Teeschicht',             slotMinutes: 120, peoplePerSlot: 1, wholeEvent: true },
    { name: 'Türschicht',             slotMinutes: 60,  peoplePerSlot: 2, wholeEvent: true },
    { name: 'Küchendienst / Essen',   slotMinutes: 90,  peoplePerSlot: 2, wholeEvent: false },
    { name: 'Frühstücksvorbereitung', slotMinutes: 90,  peoplePerSlot: 2, wholeEvent: false },
    { name: 'Aufräumen',              slotMinutes: 60,  peoplePerSlot: 2, wholeEvent: false },
    { name: 'Brötchen besorgen',      slotMinutes: 60,  peoplePerSlot: 1, wholeEvent: false }
  ];

  /* view-lokaler Zustand (nicht persistiert) */
  var view = { tab: 'timeline' };

  /* ---------------- Navigation ---------------- */

  function renderNav(state) {
    return STEPS.map(function (s) {
      var current = s.n === state.step;
      var done = s.n < state.step;
      return '<button type="button" class="stepnav-item' + (done ? ' done' : '') + '"' +
        (current ? ' aria-current="step"' : '') +
        ' data-action="goto-step" data-step="' + s.n + '">' +
        '<span class="stepnav-num">' + (done ? '✓' : s.n) + '</span>' +
        '<span><span class="stepnav-label">' + e(s.label) + '</span><br>' +
        '<span class="stepnav-desc">' + e(s.desc) + '</span></span>' +
        '</button>';
    }).join('');
  }

  function head(step, title, text) {
    return '<div class="step-head">' +
      '<div class="step-kicker">Schritt ' + step + ' von 6</div>' +
      '<h2>' + e(title) + '</h2>' +
      '<p>' + text + '</p></div>';
  }

  /* ---------------- Schritt 1: Veranstaltung ---------------- */

  /** Live-Hinweis zur Dauer der Veranstaltung (wird gezielt aktualisiert) */
  function eventDurationHtml(state) {
    var ev = state.event;
    var s = U.parseTime(ev.startTime), en = U.parseTime(ev.endTime);
    if (s === null || en === null || s === en) return '';
    var w = U.normalizeWindow(s, en);
    return 'Dauer: <strong>' + U.formatDuration(w.end - w.start) + '</strong>' +
      (w.end > U.MIN_PER_DAY ? ' · endet am Folgetag um ' + U.formatTime(w.end) : '') +
      (ev.date ? ' · ' + U.weekdayName(ev.date) + ', ' + U.formatDate(ev.date) : '');
  }

  function step1(state) {
    var ev = state.event;

    return '<section class="panel">' +
      head(1, 'Veranstaltung anlegen',
        'Rahmendaten der Veranstaltung. Der hier festgelegte Zeitraum ist die Obergrenze für alle Schichten.') +
      '<div class="field-grid">' +
        field('Name der Veranstaltung *', '<input type="text" data-bind="event.name" value="' + e(ev.name) + '" placeholder="z. B. Sommerfest der Gemeinde" autocomplete="off">', '', 'span-2') +
        field('Datum *', '<input type="date" data-bind="event.date" value="' + e(ev.date) + '">',
          ev.date ? U.weekdayName(ev.date) : '') +
        field('Startzeit *', '<input type="time" data-bind="event.startTime" value="' + e(ev.startTime) + '">') +
        field('Endzeit *', '<input type="time" data-bind="event.endTime" value="' + e(ev.endTime) + '">',
          'Liegt die Endzeit vor der Startzeit, endet die Veranstaltung am Folgetag.') +
        field('Bemerkungen (optional)', '<textarea data-bind="event.notes" placeholder="Hinweise, die im Plan und im Excel-Export erscheinen">' + e(ev.notes) + '</textarea>', '', 'span-2') +
      '</div>' +
      '<p class="small muted mt-16" id="eventDuration">' + eventDurationHtml(state) + '</p>' +
      '</section>';
  }

  function field(label, control, hint, extraClass) {
    return '<div class="field ' + (extraClass || '') + '">' +
      '<label>' + e(label) + '</label>' + control +
      (hint ? '<span class="hint">' + hint + '</span>' : '') +
      '</div>';
  }

  /* ---------------- Schritt 2: Personen ---------------- */

  function peopleCountText(state) {
    return state.people.filter(function (p) { return p.name.trim(); }).length + ' Person(en) erfasst';
  }

  function step2(state) {
    var rows = state.people.map(function (p, i) {
      return '<div class="row-item">' +
        '<span class="idx">' + (i + 1) + '.</span>' +
        '<input type="text" data-bind="person.name" data-id="' + p.id + '" value="' + e(p.name) + '" placeholder="Vor- und Nachname" autocomplete="off">' +
        '<input type="text" data-bind="person.note" data-id="' + p.id + '" value="' + e(p.note) + '" placeholder="Notiz (optional)" style="max-width:220px">' +
        '<button type="button" class="btn btn-icon" data-action="remove-person" data-id="' + p.id + '" title="Person entfernen" aria-label="Person entfernen">✕</button>' +
        '</div>';
    }).join('');

    return '<section class="panel">' +
      head(2, 'Teilnehmende Personen erfassen',
        'Alle Personen, die grundsätzlich für Schichten eingeplant werden dürfen. Abwesenheiten werden erst in Schritt&nbsp;4 eingetragen.') +
      (state.people.length
        ? '<div class="row-list">' + rows + '</div>'
        : '<div class="empty">Noch keine Personen erfasst.</div>') +
      '<div class="actions-row mt-16">' +
        '<button type="button" class="btn btn-secondary" data-action="add-person">+ Person hinzufügen</button>' +
        '<span class="small muted" id="peopleCount">' + peopleCountText(state) + '</span>' +
      '</div>' +
      '<div class="mt-16">' +
        '<div class="section-title"><h3>Mehrere Namen auf einmal einfügen</h3></div>' +
        '<textarea id="bulkNames" placeholder="Ein Name pro Zeile oder durch Komma getrennt"></textarea>' +
        '<div class="actions-row mt-16"><button type="button" class="btn btn-secondary btn-sm" data-action="add-bulk">Namen übernehmen</button></div>' +
      '</div>' +
      '</section>';
  }

  /* ---------------- Schritt 3: Aufgaben ---------------- */

  function step3(state) {
    var cards = state.tasks.map(function (t, i) { return taskCard(state, t, i); }).join('');
    var presets = TASK_PRESETS.map(function (p, i) {
      return '<button type="button" class="btn btn-ghost btn-sm" data-action="add-preset" data-preset="' + i + '">+ ' + e(p.name) + '</button>';
    }).join('');

    return '<section class="panel">' +
      head(3, 'Aufgaben und Schichtarten definieren',
        'Je Aufgabe wird festgelegt, wann sie benötigt wird, wie lang eine Schicht ist und wie viele Personen gleichzeitig gebraucht werden.') +
      '<div class="note note-info"><strong>Vorlagen:</strong> ' + presets + '</div>' +
      (state.tasks.length ? cards : '<div class="empty">Noch keine Aufgaben angelegt.</div>') +
      '<div class="actions-row mt-16">' +
        '<button type="button" class="btn btn-secondary" data-action="add-task">+ Eigene Aufgabe hinzufügen</button>' +
      '</div>' +
      '</section>';
  }

  function taskTitleText(task, index) {
    return 'Aufgabe ' + (index + 1) + (task.name.trim() ? ': ' + task.name.trim() : '');
  }

  function taskCard(state, task, index) {
    return '<div class="card">' +
      '<div class="card-head">' +
        '<h4 id="taskTitle_' + task.id + '">' + e(taskTitleText(task, index)) + '</h4>' +
        '<button type="button" class="btn btn-icon" data-action="remove-task" data-id="' + task.id + '" title="Aufgabe entfernen" aria-label="Aufgabe entfernen">✕</button>' +
      '</div>' +
      '<div class="field-grid">' +
        field('Name der Aufgabe *', '<input type="text" data-bind="task.name" data-id="' + task.id + '" value="' + e(task.name) + '" placeholder="z. B. Teeschicht" autocomplete="off">', '', 'span-2') +
        field('Zeitraum', '<label class="check"><input type="checkbox" data-bind="task.wholeEvent" data-id="' + task.id + '"' + (task.wholeEvent ? ' checked' : '') + '> Läuft über die gesamte Veranstaltung</label>',
          task.wholeEvent ? e(state.event.startTime) + '–' + e(state.event.endTime) : '') +
        (task.wholeEvent ? '' :
          field('Benötigt von *', '<input type="time" data-bind="task.startTime" data-id="' + task.id + '" value="' + e(task.startTime) + '">') +
          field('bis *', '<input type="time" data-bind="task.endTime" data-id="' + task.id + '" value="' + e(task.endTime) + '">')) +
        field('Länge einer Schicht (Minuten) *', '<input type="number" min="5" step="5" data-bind="task.slotMinutes" data-id="' + task.id + '" value="' + e(task.slotMinutes) + '">', U.formatDuration(task.slotMinutes)) +
        field('Personen pro Schicht *', '<input type="number" min="1" max="10" step="1" data-bind="task.peoplePerSlot" data-id="' + task.id + '" value="' + e(task.peoplePerSlot) + '">') +
        field('Bemerkung (optional)', '<input type="text" data-bind="task.note" data-id="' + task.id + '" value="' + e(task.note) + '" placeholder="erscheint im Excel-Export">', '', 'span-2') +
      '</div>' +
      '<p class="small muted mt-16" id="taskPreview_' + task.id + '">' + previewSlots(state, task) + '</p>' +
      '</div>';
  }

  /** Kleine Vorschau: wie viele Schichten entstehen aus dieser Aufgabe? */
  function previewSlots(state, task) {
    var evs = U.parseTime(state.event.startTime), eve = U.parseTime(state.event.endTime);
    if (evs === null || eve === null) return '';
    var win = U.normalizeWindow(evs, eve);
    var start, end;
    if (task.wholeEvent) { start = win.start; end = win.end; }
    else {
      var ts = U.parseTime(task.startTime), te = U.parseTime(task.endTime);
      if (ts === null || te === null) return '';
      start = U.alignToWindow(ts, win.start);
      end = U.alignToWindow(te, start);
      if (end <= start) end += U.MIN_PER_DAY;
      start = Math.max(start, win.start);
      end = Math.min(end, win.end);
      if (end <= start) return '<span style="color:var(--danger)">Zeitraum liegt außerhalb der Veranstaltung.</span>';
    }
    var len = Math.max(5, parseInt(task.slotMinutes, 10) || 60);
    var count = Math.ceil((end - start) / len);
    var required = U.clamp(parseInt(task.peoplePerSlot, 10) || 1, 1, 10);
    return 'Ergibt <strong>' + count + '</strong> Schicht(en) à ' + U.formatDuration(len) +
      ' von ' + U.formatTime(start) + ' bis ' + U.formatTimeDay(end) +
      ' · Personenstunden gesamt: <strong>' + U.hoursText((end - start) * required) + ' h</strong>';
  }

  /* ---------------- Schritt 4: Verfügbarkeiten ---------------- */

  function step4(state) {
    var people = state.people.filter(function (p) { return p.name.trim(); });
    if (!people.length) {
      return '<section class="panel">' + head(4, 'Verfügbarkeiten und Abwesenheiten', 'Bitte zuerst Personen erfassen.') +
        '<div class="empty">Keine Personen vorhanden – zurück zu Schritt 2.</div></section>';
    }

    var cards = people.map(function (p) {
      var absences = state.absences.filter(function (a) { return a.personId === p.id; });
      var rows = absences.map(function (a) {
        return '<div class="row-item">' +
          '<span class="small muted">nicht da von</span>' +
          '<input type="time" data-bind="absence.startTime" data-id="' + a.id + '" value="' + e(a.startTime) + '" style="max-width:130px">' +
          '<span class="small muted">bis</span>' +
          '<input type="time" data-bind="absence.endTime" data-id="' + a.id + '" value="' + e(a.endTime) + '" style="max-width:130px">' +
          '<input type="text" data-bind="absence.reason" data-id="' + a.id + '" value="' + e(a.reason) + '" placeholder="Grund (optional)">' +
          '<button type="button" class="btn btn-icon" data-action="remove-absence" data-id="' + a.id + '" title="Eintrag entfernen" aria-label="Eintrag entfernen">✕</button>' +
          '</div>';
      }).join('');

      return '<div class="card">' +
        '<div class="card-head"><h4>' + e(p.name) + '</h4>' +
        '<span class="card-meta">' + (absences.length ? absences.length + ' Abwesenheit(en)' : 'durchgehend verfügbar') + '</span></div>' +
        '<div class="field-grid">' +
          field('Kommt erst ab (optional)', '<input type="time" data-bind="person.arrival" data-id="' + p.id + '" value="' + e(p.arrival) + '">') +
          field('Geht früher ab (optional)', '<input type="time" data-bind="person.departure" data-id="' + p.id + '" value="' + e(p.departure) + '">') +
        '</div>' +
        (rows ? '<div class="row-list mt-16">' + rows + '</div>' : '') +
        '<div class="actions-row mt-16">' +
          '<button type="button" class="btn btn-secondary btn-sm" data-action="add-absence" data-id="' + p.id + '">+ Abwesenheit eintragen</button>' +
        '</div>' +
        '</div>';
    }).join('');

    return '<section class="panel">' +
      head(4, 'Verfügbarkeiten und Abwesenheiten festlegen',
        'Zeiten, in denen jemand <strong>nicht</strong> eingeplant werden darf. Wer immer da ist, braucht keinen Eintrag.') +
      cards +
      '</section>';
  }

  /* ---------------- Schritt 5: Planungsregeln ---------------- */

  function step5(state) {
    var o = state.options;
    var demand = totalDemand(state);

    return '<section class="panel">' +
      head(5, 'Planungsregeln festlegen',
        'Die Grundregeln (keine Abwesenheiten, keine Doppelbelegung, faire Verteilung) gelten immer. Hier lassen sich zusätzliche Wünsche einstellen.') +
      '<div class="field-grid">' +
        field('Mindestpause zwischen zwei Schichten (Minuten)',
          '<input type="number" min="0" step="15" data-bind="option.minRestMinutes" value="' + e(o.minRestMinutes) + '">',
          '0 = keine Vorgabe. Wird nur eingehalten, wenn der Plan sonst besetzbar bleibt.') +
        field('Höchstzahl Schichten je Person',
          '<input type="number" min="0" step="1" data-bind="option.maxShiftsPerPerson" value="' + e(o.maxShiftsPerPerson) + '">',
          '0 = keine Obergrenze. Eine zu niedrige Zahl führt zu offenen Schichten.') +
        field('Zufallsstartwert',
          '<input type="number" step="1" data-bind="option.seed" value="' + e(o.seed) + '">',
          'Gleicher Wert = gleicher Plan. Ändern erzeugt eine andere faire Variante.') +
        field('Weitere Regeln',
          '<label class="check"><input type="checkbox" data-bind="option.preferBlocks"' + (o.preferBlocks ? ' checked' : '') + '> Schichten möglichst am Stück (Blöcke)</label>' +
          '<label class="check"><input type="checkbox" data-bind="option.balanceTaskTypes"' + (o.balanceTaskTypes !== false ? ' checked' : '') + '> Aufgabenarten gleichmäßig verteilen</label>' +
          '<label class="check"><input type="checkbox" data-bind="option.mergeShortLastSlot"' + (o.mergeShortLastSlot !== false ? ' checked' : '') + '> Sehr kurze Restschicht an die vorherige anhängen</label>',
          '', 'span-2') +
      '</div>' +

      '<div class="note note-info mt-16" id="demandPreview"><strong>Bedarfsvorschau:</strong> ' + demand.text + '</div>' +
      '<div class="note note-warn" id="demandWarning"' + (demand.warning ? '' : ' hidden') + '>' + demand.warning + '</div>' +

      '<div class="actions-row mt-16">' +
        '<button type="button" class="btn btn-primary" data-action="compute">⚙️ Plan berechnen</button>' +
        '<span class="small muted">Die Berechnung dauert nur einen Augenblick und kann beliebig oft wiederholt werden.</span>' +
      '</div>' +
      '</section>';
  }

  function totalDemand(state) {
    var evs = U.parseTime(state.event.startTime), eve = U.parseTime(state.event.endTime);
    if (evs === null || eve === null) return { text: 'Zeitraum unvollständig.', warning: '' };
    var win = U.normalizeWindow(evs, eve);
    var personMinutes = 0, slotCount = 0;

    state.tasks.forEach(function (t) {
      var start, end;
      if (t.wholeEvent) { start = win.start; end = win.end; }
      else {
        var ts = U.parseTime(t.startTime), te = U.parseTime(t.endTime);
        if (ts === null || te === null) return;
        start = U.alignToWindow(ts, win.start);
        end = U.alignToWindow(te, start);
        if (end <= start) end += U.MIN_PER_DAY;
        start = Math.max(start, win.start);
        end = Math.min(end, win.end);
        if (end <= start) return;
      }
      var len = Math.max(5, parseInt(t.slotMinutes, 10) || 60);
      var required = U.clamp(parseInt(t.peoplePerSlot, 10) || 1, 1, 10);
      personMinutes += (end - start) * required;
      slotCount += Math.ceil((end - start) / len);
    });

    var ctx = window.Scheduler.buildContext(state);
    var capacity = 0;
    ctx.peopleIds.forEach(function (id) { capacity += ctx.availableMinutes[id]; });
    var people = ctx.peopleIds.length;

    var text = slotCount + ' Schichten · ' + U.hoursText(personMinutes) + ' Personenstunden zu verteilen · ' +
      people + ' Person(en) · rechnerisch <strong>' +
      (people ? U.hoursText(personMinutes / people) : '0') + ' h</strong> pro Person.';

    var warning = '';
    if (!people) warning = 'Es sind keine Personen erfasst – der Plan bliebe komplett leer.';
    else if (personMinutes > capacity) {
      warning = 'Der Bedarf (' + U.hoursText(personMinutes) + ' h) übersteigt die verfügbare Zeit aller Personen (' +
        U.hoursText(capacity) + ' h). Es werden zwangsläufig Schichten offen bleiben.';
    }
    return { text: text, warning: warning };
  }

  /* ---------------- Schritt 6: Ergebnis ---------------- */

  function step6(state) {
    var schedule = state.schedule;
    if (!schedule) {
      return '<section class="panel">' +
        head(6, 'Schichtplan & Export', 'Es wurde noch kein Plan berechnet.') +
        '<div class="empty">Bitte in Schritt 5 auf „Plan berechnen“ klicken.</div>' +
        '<div class="actions-row mt-16"><button type="button" class="btn btn-primary" data-action="compute">⚙️ Plan jetzt berechnen</button></div>' +
        '</section>';
    }

    var s = schedule.stats;
    var openIssues = schedule.issues.length;

    var html = '<section class="panel">' +
      head(6, 'Schichtplan & Export',
        'Der Plan kann hier noch von Hand angepasst werden. Der Excel-Export übernimmt immer den aktuell angezeigten Stand.');

    if (schedule.stale) {
      html += '<div class="note note-warn">Die Stammdaten wurden nach der Berechnung geändert. ' +
        '<button type="button" class="btn btn-sm btn-secondary" data-action="compute">Plan neu berechnen</button></div>';
    }

    html += '<div class="stat-grid">' +
      stat('Schichten', s.totalSlots) +
      stat('Besetzte Plätze', s.filledSeats + ' / ' + s.requiredSeats, s.openSeats ? 'is-warn' : 'is-ok') +
      stat('Offene Plätze', s.openSeats, s.openSeats ? 'is-danger' : 'is-ok') +
      stat('Ø Zeit je Person', U.hoursText(s.meanMinutes) + ' h') +
      stat('Spanne min–max', U.hoursText(s.minMinutes) + '–' + U.hoursText(s.maxMinutes) + ' h', s.spreadMinutes > 90 ? 'is-warn' : 'is-ok') +
      stat('Schichten je Person', s.minCount + '–' + s.maxCount) +
      '</div>';

    html += '<div class="actions-row mt-16">' +
      '<button type="button" class="btn btn-primary" data-action="download-xlsx">⬇️ Excel herunterladen (.xlsx)</button>' +
      '<button type="button" class="btn btn-secondary" data-action="download-csv">CSV herunterladen</button>' +
      '<button type="button" class="btn btn-secondary" data-action="print">Drucken</button>' +
      '<button type="button" class="btn btn-secondary" data-action="compute">Neu berechnen</button>' +
      '</div>';

    html += '<div class="mt-16"><div class="section-title"><h3>Inhalt der Excel-Datei</h3></div>' +
      '<div class="field-grid">' +
        '<label class="check"><input type="checkbox" checked disabled> Blatt „Schichtplan“ (immer enthalten)</label>' +
        '<label class="check"><input type="checkbox" data-bind="export.people"' + (state.options.exportSheets.people !== false ? ' checked' : '') + '> Blatt „Teilnehmende“</label>' +
        '<label class="check"><input type="checkbox" data-bind="export.availability"' + (state.options.exportSheets.availability !== false ? ' checked' : '') + '> Blatt „Verfügbarkeiten“</label>' +
        '<label class="check"><input type="checkbox" data-bind="export.issues"' + (state.options.exportSheets.issues !== false ? ' checked' : '') + '> Blatt „Offene Schichten“</label>' +
        '<label class="check"><input type="checkbox" data-bind="export.info"' + (state.options.exportSheets.info !== false ? ' checked' : '') + '> Blatt „Veranstaltung“</label>' +
      '</div></div>';

    html += '</section>';

    html += '<section class="panel">' +
      '<div class="tabs" role="tablist">' +
        tab('timeline', 'Zeitplan') +
        tab('people', 'Nach Person') +
        tab('issues', 'Probleme' + (openIssues ? ' (' + openIssues + ')' : '')) +
      '</div>' +
      (view.tab === 'people' ? renderPeopleView(state, schedule)
        : view.tab === 'issues' ? renderIssuesView(state, schedule)
        : renderTimeline(state, schedule)) +
      '</section>';

    return html;
  }

  function stat(key, value, cls) {
    return '<div class="stat ' + (cls || '') + '"><div class="k">' + e(key) + '</div>' +
      '<div class="v">' + e(value) + '</div></div>';
  }

  function tab(id, label) {
    return '<button type="button" class="tab" role="tab" aria-selected="' + (view.tab === id) + '" ' +
      'data-action="tab" data-tab="' + id + '">' + e(label) + '</button>';
  }

  function renderTimeline(state, schedule) {
    if (!schedule.slots.length) return '<div class="empty">Keine Schichten vorhanden.</div>';

    var options = window.Scheduler.seatOptions(state, schedule);
    var maxSeats = 1;
    schedule.slots.forEach(function (s) { maxSeats = Math.max(maxSeats, s.required); });

    var slots = schedule.slots.slice().sort(function (a, b) {
      return a.start - b.start || a.taskName.localeCompare(b.taskName, 'de');
    });

    var headCells = '<th>Zeit</th><th>Aufgabe</th>';
    for (var i = 0; i < maxSeats; i++) headCells += '<th>Person ' + (i + 1) + '</th>';
    headCells += '<th>Status</th>';

    var lastStart = null;
    var body = slots.map(function (slot) {
      var filled = slot.assigned.filter(Boolean).length;
      var cls = filled === 0 ? 'is-open' : (filled < slot.required ? 'is-partial' : '');
      if (lastStart !== null && slot.start !== lastStart) cls += ' row-gap';
      lastStart = slot.start;

      var cells = '<td class="time">' + U.formatTime(slot.start) + '–' + U.formatTimeDay(slot.end) +
        '<br><span class="small muted">' + U.formatDuration(slot.end - slot.start) + '</span></td>' +
        '<td>' + e(slot.taskName) + (slot.taskNote ? '<br><span class="small muted">' + e(slot.taskNote) + '</span>' : '') + '</td>';

      for (var seat = 0; seat < maxSeats; seat++) {
        if (seat >= slot.required) { cells += '<td class="muted small">–</td>'; continue; }
        cells += '<td class="seat">' + seatSelect(slot, seat, options[slot.id][seat]) + '</td>';
      }

      cells += '<td>' + (filled >= slot.required
        ? '<span class="badge badge-ok">besetzt</span>'
        : (filled === 0
          ? '<span class="badge badge-danger">offen</span>'
          : '<span class="badge badge-warn">' + (slot.required - filled) + ' fehlt</span>')) + '</td>';

      return '<tr class="' + cls + '">' + cells + '</tr>';
    }).join('');

    return '<div class="table-wrap"><table class="data"><thead><tr>' + headCells + '</tr></thead>' +
      '<tbody>' + body + '</tbody></table></div>' +
      '<p class="small muted mt-16">Über die Auswahlfelder lassen sich Personen manuell tauschen. ' +
      'Nicht auswählbare Personen sind zu dieser Zeit abwesend oder bereits eingeteilt.</p>';
  }

  function seatSelect(slot, seat, candidates) {
    var current = slot.assigned[seat] || '';
    var opts = '<option value=""' + (current ? '' : ' selected') + '>— frei —</option>';
    (candidates || []).forEach(function (cand) {
      var selected = cand.personId === current;
      opts += '<option value="' + e(cand.personId) + '"' +
        (selected ? ' selected' : '') +
        (!cand.ok && !selected ? ' disabled' : '') + '>' +
        e(cand.name) + (cand.ok || selected ? '' : ' – ' + e(cand.reason)) +
        '</option>';
    });
    return '<select class="' + (current ? '' : 'is-empty') + '" data-action="seat" data-slot="' + e(slot.id) +
      '" data-seat="' + seat + '" aria-label="Person für ' + e(slot.taskName) + '">' + opts + '</select>';
  }

  function renderPeopleView(state, schedule) {
    var s = schedule.stats;
    if (!s.perPerson.length) return '<div class="empty">Keine Personen erfasst.</div>';
    var max = Math.max(1, s.maxMinutes);
    var slotById = {};
    schedule.slots.forEach(function (slot) { slotById[slot.id] = slot; });

    var cards = s.perPerson.slice().sort(function (a, b) {
      return b.minutes - a.minutes || a.name.localeCompare(b.name, 'de');
    }).map(function (rec) {
      var shifts = rec.shifts.map(function (id) { return slotById[id]; })
        .filter(Boolean)
        .sort(function (a, b) { return a.start - b.start; })
        .map(function (slot) {
          return '<li><span class="t">' + U.formatTime(slot.start) + '–' + U.formatTimeDay(slot.end) + '</span>' +
            '<span>' + e(slot.taskName) + '</span></li>';
        }).join('');

      return '<div class="person-card">' +
        '<h4><span>' + e(rec.name) + '</span>' +
        '<span class="small muted">' + rec.count + ' Schicht(en) · ' + U.hoursText(rec.minutes) + ' h</span></h4>' +
        '<div class="bar mt-16"><span style="width:' + Math.round(rec.minutes / max * 100) + '%"></span></div>' +
        (rec.availableMinutes < (schedule.window.end - schedule.window.start)
          ? '<p class="small muted mt-16">verfügbar: ' + U.hoursText(rec.availableMinutes) + ' h von ' +
            U.hoursText(schedule.window.end - schedule.window.start) + ' h</p>' : '') +
        (shifts ? '<ul>' + shifts + '</ul>' : '<p class="small muted mt-16">Keine Schicht zugeteilt.</p>') +
        '</div>';
    }).join('');

    return '<div class="person-grid">' + cards + '</div>';
  }

  function renderIssuesView(state, schedule) {
    if (!schedule.issues.length) {
      return '<div class="note note-ok">Alle Schichten sind vollständig besetzt – es gibt keine offenen Punkte.</div>';
    }
    var rows = schedule.issues.map(function (issue) {
      return '<tr class="' + (issue.severity === 'error' ? 'is-open' : 'is-partial') + '">' +
        '<td>' + e(issue.taskName || '') + '</td>' +
        '<td class="time">' + (issue.start != null
          ? U.formatTime(issue.start) + '–' + U.formatTimeDay(issue.end) : '–') + '</td>' +
        '<td class="num">' + (issue.required ? issue.filled + ' / ' + issue.required : '–') + '</td>' +
        '<td>' + e(issue.message) + '</td>' +
        '</tr>';
    }).join('');

    return '<div class="table-wrap"><table class="data">' +
      '<thead><tr><th>Aufgabe</th><th>Zeit</th><th>Besetzt</th><th>Hinweis</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      '<p class="small muted mt-16">Mögliche Gegenmaßnahmen: Schichtlänge ändern, Personen pro Schicht reduzieren, ' +
      'weitere Personen erfassen oder Abwesenheiten prüfen.</p>';
  }

  /* ---------------- Dispatcher ---------------- */

  function renderStep(state) {
    switch (state.step) {
      case 1: return step1(state);
      case 2: return step2(state);
      case 3: return step3(state);
      case 4: return step4(state);
      case 5: return step5(state);
      case 6: return step6(state);
      default: return step1(state);
    }
  }

  function primaryLabel(step) {
    if (step === 5) return '⚙️ Plan berechnen';
    if (step === 6) return '⬇️ Excel herunterladen';
    return 'Weiter ›';
  }

  return {
    STEPS: STEPS,
    TASK_PRESETS: TASK_PRESETS,
    view: view,
    renderNav: renderNav,
    renderStep: renderStep,
    primaryLabel: primaryLabel,
    // Bausteine für gezielte Aktualisierungen ohne Neuaufbau des DOM
    eventDurationHtml: eventDurationHtml,
    peopleCountText: peopleCountText,
    taskTitleText: taskTitleText,
    previewSlots: previewSlots,
    totalDemand: totalDemand
  };
})();

</script>
<script>
/* ---- src/app.js ---- */
/* ============================================================
   app.js – Wizard-Steuerung, Ereignisbehandlung, Bootstrap
   ============================================================ */

(function () {
  'use strict';

  var U = window.Util;
  var Store = window.Store;
  var UI = window.UI;

  var content = U.$('#stepContent');
  var nav = U.$('#stepNav');
  var footerHint = U.$('#footerHint');
  var toastHost = U.$('#toastHost');
  var fileInput = U.$('#jsonFileInput');

  var lastErrors = [];

  /* ---------------- Rendering ---------------- */

  function render(focusHint) {
    var state = Store.get();
    nav.innerHTML = UI.renderNav(state);
    content.innerHTML = UI.renderStep(state);

    // Fußzeile
    U.$('[data-action="prev"]').disabled = state.step <= 1;
    var nextBtn = U.$('[data-action="next"]');
    nextBtn.textContent = UI.primaryLabel(state.step);
    nextBtn.classList.toggle('btn-primary', true);

    showHint();
    restoreFocus(focusHint);
  }

  function restoreFocus(hint) {
    if (!hint || !hint.bind) return;
    var selector = '[data-bind="' + hint.bind + '"]' + (hint.id ? '[data-id="' + hint.id + '"]' : '');
    var el = content.querySelector(selector);
    if (!el) return;
    el.focus();
    if (hint.selStart != null && typeof el.setSelectionRange === 'function') {
      try { el.setSelectionRange(hint.selStart, hint.selEnd); } catch (err) { /* z. B. bei type=time */ }
    }
  }

  function focusHintFrom(target) {
    if (!target || document.activeElement !== target || !target.dataset || !target.dataset.bind) return null;
    var hint = { bind: target.dataset.bind, id: target.dataset.id || '' };
    if (typeof target.selectionStart === 'number') {
      try { hint.selStart = target.selectionStart; hint.selEnd = target.selectionEnd; } catch (err) { /* egal */ }
    }
    return hint;
  }

  function showHint(message, isError) {
    if (message) {
      footerHint.innerHTML = message;
      footerHint.classList.toggle('is-error', !!isError);
      return;
    }
    var state = Store.get();
    footerHint.classList.remove('is-error');
    var texts = {
      1: 'Rahmendaten der Veranstaltung eingeben.',
      2: 'Alle Personen erfassen, die eingeplant werden dürfen.',
      3: 'Aufgaben mit Zeitraum, Schichtlänge und Personenzahl anlegen.',
      4: 'Abwesenheiten eintragen – wer immer da ist, braucht keinen Eintrag.',
      5: 'Regeln prüfen und den Plan berechnen.',
      6: 'Plan prüfen, bei Bedarf anpassen und als Excel herunterladen.'
    };
    footerHint.textContent = texts[state.step] || '';
  }

  function toast(message, type) {
    var el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = message;
    toastHost.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .3s';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
    }, 3200);
  }

  function showErrors(errors) {
    lastErrors = errors;
    if (!errors.length) { showHint(); return; }
    showHint('<strong>Bitte prüfen:</strong> ' + U.escapeHtml(errors[0]) +
      (errors.length > 1 ? ' (+' + (errors.length - 1) + ' weitere)' : ''), true);
  }

  /* ---------------- Navigation ---------------- */

  function goTo(step) {
    var state = Store.get();
    state.step = U.clamp(step, 1, 6);
    Store.save();
    lastErrors = [];
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    content.focus();
  }

  function next() {
    var state = Store.get();
    if (state.step === 5) { compute(); return; }
    if (state.step === 6) { downloadXlsx(); return; }

    var errors = Store.validateStep(state.step);
    if (errors.length) { showErrors(errors); toast(errors[0], 'error'); return; }
    goTo(state.step + 1);
  }

  function prev() {
    var state = Store.get();
    goTo(state.step - 1);
  }

  /* ---------------- Aktionen ---------------- */

  function compute() {
    var state = Store.get();
    // Alle vorherigen Schritte prüfen, bevor gerechnet wird
    var errors = [];
    for (var s = 1; s <= 4; s++) errors = errors.concat(Store.validateStep(s));
    if (errors.length) {
      showErrors(errors);
      toast(errors[0], 'error');
      return;
    }

    var t0 = performance.now();
    state.schedule = window.Scheduler.compute(state);
    state.step = 6;
    UI.view.tab = 'timeline';
    Store.save();
    render();

    var st = state.schedule.stats;
    var ms = Math.round(performance.now() - t0);
    if (st.openSeats > 0) {
      toast('Plan berechnet (' + ms + ' ms) – ' + st.openSeats + ' Platz/Plätze konnten nicht besetzt werden.', 'error');
    } else {
      toast('Plan berechnet (' + ms + ' ms) – alle ' + st.requiredSeats + ' Plätze sind besetzt.', 'ok');
    }
  }

  function downloadXlsx() {
    var state = Store.get();
    if (!state.schedule) { toast('Bitte zuerst einen Plan berechnen.', 'error'); return; }
    try {
      window.Exporter.downloadXlsx(state, state.schedule);
      toast('Excel-Datei wurde erzeugt.', 'ok');
    } catch (err) {
      toast('Excel-Export fehlgeschlagen: ' + err.message, 'error');
    }
  }

  function downloadCsv() {
    var state = Store.get();
    if (!state.schedule) { toast('Bitte zuerst einen Plan berechnen.', 'error'); return; }
    window.Exporter.downloadCsv(state, state.schedule);
    toast('CSV-Datei wurde erzeugt.', 'ok');
  }

  function addBulkNames() {
    var box = U.$('#bulkNames');
    if (!box) return;
    var names = box.value.split(/[\n,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!names.length) { toast('Keine Namen gefunden.', 'error'); return; }
    names.forEach(function (n) { Store.addPerson(n); });
    box.value = '';
    render();
    toast(names.length + ' Person(en) hinzugefügt.', 'ok');
  }

  function exportJson() {
    var state = Store.get();
    var blob = new Blob([Store.toJson()], { type: 'application/json' });
    U.downloadBlob(blob, 'schichtplaner_' + U.slugify(state.event.name) + '.json');
    toast('Projektdatei gespeichert.', 'ok');
  }

  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        Store.fromJson(String(reader.result));
        render();
        toast('Projektdatei geladen.', 'ok');
      } catch (err) {
        toast('Datei konnte nicht gelesen werden.', 'error');
      }
    };
    reader.readAsText(file);
  }

  /* ---------------- Datenbindung ---------------- */

  function applyBinding(target) {
    var bind = target.dataset.bind;
    if (!bind) return false;
    var id = target.dataset.id || '';
    var parts = bind.split('.');
    var group = parts[0], key = parts[1];
    var state = Store.get();
    var value;

    if (target.type === 'checkbox') value = target.checked;
    else if (target.type === 'number') value = target.value === '' ? 0 : Number(target.value);
    else value = target.value;

    if (group === 'event') {
      state.event[key] = value;
    } else if (group === 'option') {
      state.options[key] = value;
    } else if (group === 'export') {
      state.options.exportSheets[key] = value;
    } else if (group === 'person') {
      var person = Store.personById(id);
      if (!person) return false;
      person[key] = value;
    } else if (group === 'task') {
      var task = Store.taskById(id);
      if (!task) return false;
      if (key === 'peoplePerSlot') value = U.clamp(parseInt(value, 10) || 1, 1, 10);
      if (key === 'slotMinutes') value = Math.max(5, parseInt(value, 10) || 60);
      task[key] = value;
    } else if (group === 'absence') {
      var absence = null;
      state.absences.forEach(function (a) { if (a.id === id) absence = a; });
      if (!absence) return false;
      absence[key] = value;
    } else {
      return false;
    }

    if (group !== 'export') Store.invalidateSchedule();
    Store.save();
    return true;
  }

  /* ---------------- Ereignisse ---------------- */

  /**
   * Aktualisiert nur die abgeleiteten Textbausteine des aktuellen
   * Schritts. Bewusst kein Neuaufbau des DOM: Ein Neuaufbau während
   * eines laufenden Klicks (Feld verlassen -> change -> Klick auf
   * Button) würde den Klick verschlucken.
   */
  function updateDerived(target) {
    var state = Store.get();
    var id = target && target.dataset ? (target.dataset.id || '') : '';

    var duration = U.$('#eventDuration');
    if (duration) duration.innerHTML = UI.eventDurationHtml(state);

    var count = U.$('#peopleCount');
    if (count) count.textContent = UI.peopleCountText(state);

    if (state.step === 3) {
      state.tasks.forEach(function (task, index) {
        var preview = U.$('#taskPreview_' + task.id);
        if (preview) preview.innerHTML = UI.previewSlots(state, task);
        var title = U.$('#taskTitle_' + task.id);
        if (title) title.textContent = UI.taskTitleText(task, index);
      });
    }

    if (state.step === 5) {
      var demand = UI.totalDemand(state);
      var box = U.$('#demandPreview');
      if (box) box.innerHTML = '<strong>Bedarfsvorschau:</strong> ' + demand.text;
      var warn = U.$('#demandWarning');
      if (warn) {
        warn.innerHTML = demand.warning;
        warn.hidden = !demand.warning;
      }
    }
    return id;
  }

  document.addEventListener('input', function (ev) {
    var target = ev.target;
    if (!target.dataset || !target.dataset.bind) return;
    applyBinding(target);
    updateDerived(target);
    if (lastErrors.length) showErrors(Store.validateStep(Store.get().step));
  });

  document.addEventListener('change', function (ev) {
    var target = ev.target;
    if (!target.dataset) return;

    if (target.dataset.action === 'seat') {
      handleSeatChange(target);
      return;
    }
    if (target === fileInput) {
      if (fileInput.files && fileInput.files[0]) importJson(fileInput.files[0]);
      fileInput.value = '';
      return;
    }
    if (!target.dataset.bind) return;

    if (applyBinding(target)) {
      updateDerived(target);
      // Nur dieser Schalter blendet Felder ein bzw. aus und braucht
      // deshalb einen echten Neuaufbau.
      if (target.dataset.bind === 'task.wholeEvent') render(focusHintFrom(target));
    }
  });

  function handleSeatChange(select) {
    var state = Store.get();
    var schedule = state.schedule;
    if (!schedule) return;
    var slotId = select.dataset.slot;
    var seat = parseInt(select.dataset.seat, 10);
    var personId = select.value || null;

    var slot = null;
    schedule.slots.forEach(function (s) { if (s.id === slotId) slot = s; });
    if (!slot) return;

    slot.assigned[seat] = personId;
    if (slot.manual) slot.manual[seat] = true;
    window.Scheduler.refresh(state, schedule);
    Store.save();
    render();
    toast(personId ? 'Schicht neu zugeteilt.' : 'Platz freigegeben.', 'ok');
  }

  document.addEventListener('click', function (ev) {
    var target = ev.target.closest('[data-action]');
    if (!target) return;
    var action = target.dataset.action;
    var id = target.dataset.id;
    var state = Store.get();

    switch (action) {
      case 'next': next(); break;
      case 'prev': prev(); break;
      case 'goto-step': goTo(parseInt(target.dataset.step, 10)); break;

      case 'add-person':
        Store.addPerson('');
        render();
        var inputs = U.$$('[data-bind="person.name"]', content);
        if (inputs.length) inputs[inputs.length - 1].focus();
        break;
      case 'remove-person': Store.removePerson(id); render(); break;
      case 'add-bulk': addBulkNames(); break;

      case 'add-task': Store.addTask(); render(); break;
      case 'add-preset':
        var preset = UI.TASK_PRESETS[parseInt(target.dataset.preset, 10)];
        Store.addTask(Object.assign({}, preset, {
          startTime: preset.wholeEvent ? state.event.startTime : state.event.startTime,
          endTime: preset.wholeEvent ? state.event.endTime : state.event.endTime
        }));
        render();
        break;
      case 'remove-task': Store.removeTask(id); render(); break;

      case 'add-absence': Store.addAbsence(id); render(); break;
      case 'remove-absence': Store.removeAbsence(id); render(); break;

      case 'compute': compute(); break;
      case 'download-xlsx': downloadXlsx(); break;
      case 'download-csv': downloadCsv(); break;
      case 'print': window.print(); break;

      case 'tab':
        UI.view.tab = target.dataset.tab;
        render();
        break;

      case 'load-demo':
        if (state.people.length || state.tasks.length) {
          if (!window.confirm('Die aktuellen Eingaben werden durch das Beispiel ersetzt. Fortfahren?')) return;
        }
        Store.loadDemo();
        render();
        toast('Beispieldaten geladen.', 'ok');
        break;
      case 'reset-all':
        if (!window.confirm('Wirklich alle Eingaben löschen?')) return;
        Store.reset();
        render();
        toast('Alles zurückgesetzt.', 'ok');
        break;
      case 'export-json': exportJson(); break;
      case 'import-json': fileInput.click(); break;
      default: break;
    }
  });

  /* ---------------- Start ---------------- */

  Store.load();
  render();
})();

</script>
</body>
</html>
