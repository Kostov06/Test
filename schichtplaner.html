<!DOCTYPE html>
<html lang="de">
<head>

<title>Schichtplaner – Faire Schichtpläne für Veranstaltungen</title>

<style>
/* ============================================================
   Schichtplaner – Stylesheet
   Reines CSS, keine Frameworks.

   Farben liegen ausschließlich als Custom Properties vor. Das helle
   Set steht auf :root, das dunkle wird an drei Stellen gesetzt:
     1. @media (prefers-color-scheme: dark) – Systemeinstellung
     2. :root[data-theme="dark"]            – ausdrücklicher Umschalter
     3. :root[data-theme="light"]           – zurück auf hell, auch wenn
                                              das System dunkel meldet
   Die Attributselektoren sind spezifischer als :root und gewinnen
   deshalb in beide Richtungen gegen die Systemeinstellung.
   ============================================================ */

:root {
  --bg:            #f4f6fb;
  --bg-elev:       #ffffff;
  --bg-sunken:     #eef1f8;
  --border:        #dbe0ec;
  --border-strong: #c2cadb;
  --text:          #1b2233;
  --text-muted:    #626c85;
  --text-faint:    #8b94a8;
  --accent:        #3457d5;
  --accent-hover:  #2b47b4;
  --accent-soft:   #e8edfd;
  --ok:            #1c8a53;
  --ok-soft:       #e3f6ec;
  --warn:          #a56100;
  --warn-soft:     #fdf0dc;
  --danger:        #c0362c;
  --danger-soft:   #fdeae8;
  --radius:        12px;
  --radius-sm:     8px;
  --shadow:        0 1px 2px rgba(20, 30, 60, .06), 0 8px 24px rgba(20, 30, 60, .07);
  --shadow-sm:     0 1px 2px rgba(20, 30, 60, .08);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:            #12151c;
    --bg-elev:       #1a1e27;
    --bg-sunken:     #15181f;
    --border:        #2b313e;
    --border-strong: #3b4353;
    --text:          #e8ebf2;
    --text-muted:    #9aa4b8;
    --text-faint:    #77819a;
    --accent:        #6b8bff;
    --accent-hover:  #85a0ff;
    --accent-soft:   #1e2740;
    --ok:            #4ec98a;
    --ok-soft:       #16301f;
    --warn:          #e0a458;
    --warn-soft:     #33260f;
    --danger:        #ff8478;
    --danger-soft:   #341a19;
    --shadow:        0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-sm:     0 1px 2px rgba(0,0,0,.4);
  }
}

/* Ausdrücklich gewähltes dunkles Erscheinungsbild */
:root[data-theme="dark"] {
  --bg:            #12151c;
  --bg-elev:       #1a1e27;
  --bg-sunken:     #15181f;
  --border:        #2b313e;
  --border-strong: #3b4353;
  --text:          #e8ebf2;
  --text-muted:    #9aa4b8;
  --text-faint:    #77819a;
  --accent:        #6b8bff;
  --accent-hover:  #85a0ff;
  --accent-soft:   #1e2740;
  --ok:            #4ec98a;
  --ok-soft:       #16301f;
  --warn:          #e0a458;
  --warn-soft:     #33260f;
  --danger:        #ff8478;
  --danger-soft:   #341a19;
  --shadow:        0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-sm:     0 1px 2px rgba(0,0,0,.4);
}

/* Ausdrücklich gewähltes helles Erscheinungsbild */
:root[data-theme="light"] {
  --bg:            #f4f6fb;
  --bg-elev:       #ffffff;
  --bg-sunken:     #eef1f8;
  --border:        #dbe0ec;
  --border-strong: #c2cadb;
  --text:          #1b2233;
  --text-muted:    #626c85;
  --text-faint:    #8b94a8;
  --accent:        #3457d5;
  --accent-hover:  #2b47b4;
  --accent-soft:   #e8edfd;
  --ok:            #1c8a53;
  --ok-soft:       #e3f6ec;
  --warn:          #a56100;
  --warn-soft:     #fdf0dc;
  --danger:        #c0362c;
  --danger-soft:   #fdeae8;
  --shadow:        0 1px 2px rgba(20, 30, 60, .06), 0 8px 24px rgba(20, 30, 60, .07);
  --shadow-sm:     0 1px 2px rgba(20, 30, 60, .08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 650; }
p { margin: 0; }

/* ---------- Header ---------- */

.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { font-size: 26px; line-height: 1; }
.brand h1 { font-size: 18px; letter-spacing: -.01em; }
.brand-sub { font-size: 12.5px; color: var(--text-muted); }
.header-actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Layout ---------- */

.layout {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 24px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px 140px;
}

.content { min-width: 0; outline: none; }

/* ---------- Schrittnavigation ---------- */

.stepnav { position: sticky; top: 82px; align-self: start; display: flex; flex-direction: column; gap: 4px; }

.stepnav-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-muted);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.stepnav-item:hover { background: var(--bg-elev); color: var(--text); }
.stepnav-item[aria-current="step"] {
  background: var(--bg-elev);
  border-color: var(--border);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.stepnav-num {
  flex: none;
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 650;
}
.stepnav-item[aria-current="step"] .stepnav-num { background: var(--accent); border-color: var(--accent); color: #fff; }
.stepnav-item.done .stepnav-num { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.stepnav-label { font-size: 14px; font-weight: 550; }
.stepnav-desc { font-size: 12px; color: var(--text-faint); }

/* ---------- Karten & Panels ---------- */

.panel {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 18px;
}

.step-head { margin-bottom: 18px; }
.step-kicker { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.step-head h2 { font-size: 22px; margin-top: 4px; }
.step-head p { color: var(--text-muted); margin-top: 6px; max-width: 68ch; }

.section-title {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 12px;
}
.section-title h3 { font-size: 15px; }

/* ---------- Formulare ---------- */

.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.span-2 { grid-column: span 2; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
.field .hint { font-size: 12px; color: var(--text-faint); }

input[type="text"], input[type="date"], input[type="time"], input[type="number"],
textarea, select {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-elev);
  color: var(--text);
  font: inherit;
  font-size: 14px;
}
textarea { resize: vertical; min-height: 68px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-soft); }

.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--bg-sunken);
  color: var(--text);
  font: inherit; font-size: 14px; font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { filter: brightness(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-elev); border-color: var(--border-strong); }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); font-size: 13px; padding: 7px 11px; }
.btn-ghost:hover { color: var(--text); background: var(--bg-sunken); }
.btn-danger { color: var(--danger); }
.btn-icon {
  padding: 6px 9px; background: transparent; border-color: transparent;
  color: var(--text-faint); font-size: 15px; line-height: 1;
}
.btn-icon:hover { background: var(--danger-soft); color: var(--danger); }
.btn-sm { padding: 6px 11px; font-size: 13px; }
.btn-block { width: 100%; justify-content: center; }

/* ---------- Listen (Personen, Aufgaben, Abwesenheiten) ---------- */

.row-list { display: flex; flex-direction: column; gap: 8px; }

.row-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-sunken);
}
.row-item .idx { flex: none; width: 22px; text-align: right; color: var(--text-faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.row-item input[type="text"] { background: var(--bg-elev); }

.card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-sunken);
  padding: 16px;
  margin-bottom: 12px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h4 { font-size: 14px; }
.card-head .card-meta { font-size: 12.5px; color: var(--text-muted); }

.empty {
  padding: 26px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  text-align: center;
  color: var(--text-muted);
  background: var(--bg-sunken);
}

/* ---------- Hinweise ---------- */

.note { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13.5px; border: 1px solid; margin-bottom: 14px; }
.note-info   { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.note-warn   { background: var(--warn-soft);   border-color: var(--warn);   color: var(--text); }
.note-error  { background: var(--danger-soft); border-color: var(--danger); color: var(--text); }
.note-ok     { background: var(--ok-soft);     border-color: var(--ok);     color: var(--text); }
.note ul { margin: 6px 0 0; padding-left: 20px; }

/* ---------- Statistik-Kacheln ---------- */

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.stat .k { font-size: 12px; color: var(--text-muted); }
.stat .v { font-size: 19px; font-weight: 660; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat.is-warn .v { color: var(--warn); }
.stat.is-danger .v { color: var(--danger); }
.stat.is-ok .v { color: var(--ok); }

/* ---------- Tabs ---------- */

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  padding: 9px 14px; border: none; background: none; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 550; color: var(--text-muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- Tabellen ---------- */

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th, table.data td { padding: 8px 11px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--bg-sunken);
  font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted);
  white-space: nowrap;
}
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: var(--bg-sunken); }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data td.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.row-gap td { border-top: 2px solid var(--border-strong); }
tr.is-open td { background: var(--danger-soft); }
tr.is-partial td { background: var(--warn-soft); }

td.seat select { padding: 5px 8px; font-size: 13px; min-width: 130px; }
td.seat select.is-empty { color: var(--danger); border-color: var(--danger); }

/* ---------- Badges & Balken ---------- */

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; border: 1px solid;
}
.badge-ok     { background: var(--ok-soft);     border-color: var(--ok);     color: var(--ok); }
.badge-warn   { background: var(--warn-soft);   border-color: var(--warn);   color: var(--warn); }
.badge-danger { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.badge-muted  { background: var(--bg-sunken);   border-color: var(--border); color: var(--text-muted); }

.bar { height: 8px; border-radius: 999px; background: var(--bg-sunken); border: 1px solid var(--border); overflow: hidden; min-width: 90px; }
.bar > span { display: block; height: 100%; background: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--border); color: var(--text-muted);
}

/* ---------- Personenansicht ---------- */

.person-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.person-card { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-sunken); padding: 14px; }
.person-card h4 { font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.person-card ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.person-card li { font-size: 13px; display: flex; gap: 8px; }
.person-card li .t { font-variant-numeric: tabular-nums; color: var(--text-muted); white-space: nowrap; }

/* ---------- Footer ---------- */

.wizard-footer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
}
.wizard-footer-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 20px;
}
.footer-hint { flex: 1; font-size: 13px; color: var(--text-muted); min-width: 0; }
.footer-hint.is-error { color: var(--danger); }

/* ---------- Toasts ---------- */

.toast-host { position: fixed; bottom: 78px; right: 20px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 15px; border-radius: var(--radius-sm);
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow); font-size: 13.5px; max-width: 340px;
}
.toast.ok    { border-color: var(--ok);     background: var(--ok-soft); }
.toast.error { border-color: var(--danger); background: var(--danger-soft); }

/* ---------- Sonstiges ---------- */

.muted { color: var(--text-muted); }
.small { font-size: 12.5px; }
.mt-16 { margin-top: 16px; }
.actions-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding-bottom: 150px; }
  .stepnav {
    position: static;
    flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px;
  }
  .stepnav-item { flex: none; width: auto; }
  .stepnav-desc { display: none; }
  .field.span-2 { grid-column: auto; }
}

/* ---------- Handy ---------- */

@media (max-width: 640px) {
  .app-header { padding: 10px 14px; gap: 8px; }
  .brand h1 { font-size: 16px; }
  .brand-sub { display: none; }
  .header-actions {
    width: 100%;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .header-actions .btn { flex: none; }

  .layout { padding: 16px 14px 108px; gap: 16px; }
  .panel { padding: 16px; }
  .step-head h2 { font-size: 19px; }

  /* Fußzeile: Buttons nebeneinander in voller Breite, Hinweis nur im Fehlerfall */
  .wizard-footer-inner { flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
  .wizard-footer-inner .btn { flex: 1 1 0; justify-content: center; }
  .footer-hint { display: none; order: -1; width: 100%; flex-basis: 100%; font-size: 12.5px; }
  .footer-hint.is-error { display: block; }

  .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { padding: 10px 12px; }
  .stat .v { font-size: 17px; }

  .toast-host { right: 12px; left: 12px; bottom: 84px; }
  .toast { max-width: none; }

  /* Eingabezeilen umbrechen lassen, statt sie zu quetschen */
  .row-item { flex-wrap: wrap; }
  .row-item input[type="text"] { min-width: 60%; max-width: none !important; }
  .row-item input[type="time"] { max-width: 46% !important; }

  table.data th, table.data td { padding: 7px 9px; }
}

@media print {
  .app-header, .stepnav, .wizard-footer, .toast-host, .tabs, .btn { display: none !important; }
  .layout { display: block; padding: 0; }
  .panel { box-shadow: none; border: none; padding: 0; }
  table.data { font-size: 11px; }
}

</style>

<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">🗓️</span>
    <div>
      <h1>Schichtplaner</h1>
      <p class="brand-sub">Faire Schichtpläne für Veranstaltungen</p>
    </div>
  </div>
  <div class="header-actions">
    <button type="button" class="btn btn-ghost" data-action="load-demo">Beispiel laden</button>
    <button type="button" class="btn btn-ghost" data-action="export-json">Speichern (JSON)</button>
    <button type="button" class="btn btn-ghost" data-action="import-json">Laden (JSON)</button>
    <button type="button" class="btn btn-ghost btn-danger" data-action="reset-all">Zurücksetzen</button>
    <input type="file" id="jsonFileInput" accept="application/json,.json" hidden>
  </div>
</header>

<div class="layout">
  <nav class="stepnav" id="stepNav" aria-label="Schritte"></nav>
  <main class="content" id="stepContent" tabindex="-1"></main>
</div>

<footer class="wizard-footer">
  <div class="wizard-footer-inner">
    <button type="button" class="btn btn-secondary" data-action="prev">‹ Zurück</button>
    <div class="footer-hint" id="footerHint"></div>
    <button type="button" class="btn btn-primary" data-action="next">Weiter ›</button>
  </div>
</footer>

<div class="toast-host" id="toastHost" aria-live="polite"></div>

<script>
/* ---- src/util.js ---- */
/* ============================================================
   util.js – Hilfsfunktionen (Zeit, IDs, DOM, Zufall)
   Klassisches Script, damit die App auch per Doppelklick
   (file://) ohne Server läuft. Alles hängt an window.Util.
   ============================================================ */

window.Util = (function () {
  'use strict';

  var MIN_PER_DAY = 1440;

  /* ---------- Zeit ---------- */

  /** "HH:MM" -> Minuten seit Mitternacht; ungültig -> null */
  function parseTime(value) {
    if (typeof value !== 'string') return null;
    var m = value.trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    var h = parseInt(m[1], 10), min = parseInt(m[2], 10);
    if (h > 23 || min > 59) return null;
    return h * 60 + min;
  }

  /** Minuten -> "HH:MM" (Tagesüberlauf wird abgeschnitten) */
  function formatTime(minutes) {
    var m = ((Math.round(minutes) % MIN_PER_DAY) + MIN_PER_DAY) % MIN_PER_DAY;
    return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
  }

  /** Minuten -> "HH:MM" bzw. "HH:MM (+1)" bei Folgetag */
  function formatTimeDay(minutes) {
    var day = Math.floor(minutes / MIN_PER_DAY);
    return formatTime(minutes) + (day > 0 ? ' (+' + day + ')' : '');
  }

  /**
   * Normalisiert ein Zeitfenster: Endet es rechnerisch vor dem Start,
   * liegt das Ende am Folgetag (z. B. 20:00 – 02:00).
   */
  function normalizeWindow(startMin, endMin) {
    var e = endMin;
    while (e <= startMin) e += MIN_PER_DAY;
    return { start: startMin, end: e };
  }

  /**
   * Richtet eine Uhrzeit am Bezugsfenster aus: liegt sie vor dem
   * Fensterstart, wird sie auf den Folgetag geschoben.
   */
  function alignToWindow(minutes, windowStart) {
    var v = minutes;
    while (v < windowStart) v += MIN_PER_DAY;
    return v;
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /** Zwei halboffene Intervalle [a1,a2) und [b1,b2) überschneiden sich? */
  function overlaps(a1, a2, b1, b2) { return a1 < b2 && b1 < a2; }

  /** Minuten -> "2 h 30 min" */
  function formatDuration(minutes) {
    var m = Math.round(minutes);
    var h = Math.floor(m / 60), r = m % 60;
    if (h && r) return h + ' h ' + r + ' min';
    if (h) return h + ' h';
    return r + ' min';
  }

  /** Minuten -> "2,5" (Stunden mit Komma, deutsche Schreibweise) */
  function hoursText(minutes) {
    return (minutes / 60).toFixed(2).replace('.', ',');
  }

  /* ---------- Datum ---------- */

  /** "YYYY-MM-DD" -> "DD.MM.YYYY" */
  function formatDate(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    if (p.length !== 3) return String(iso);
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  /** "YYYY-MM-DD" + n Tage -> "YYYY-MM-DD" */
  function addDays(iso, days) {
    if (!iso) return '';
    var p = String(iso).split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    d.setUTCDate(d.getUTCDate() + (days || 0));
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }

  /** Kalenderdatum für einen Minutenwert relativ zum Veranstaltungsstart */
  function dateForMinutes(isoDate, minutes) {
    return addDays(isoDate, Math.floor(minutes / MIN_PER_DAY));
  }

  var WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  function weekdayName(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return WEEKDAYS[d.getUTCDay()] || '';
  }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /* ---------- IDs & Zufall ---------- */

  var idCounter = 0;
  function uid(prefix) {
    idCounter += 1;
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + idCounter.toString(36);
  }

  /** Deterministischer PRNG (mulberry32) – gleicher Seed, gleicher Plan */
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashString(str) {
    var h = 2166136261;
    for (var i = 0; i < String(str).length; i++) {
      h ^= String(str).charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  /* ---------- Statistik ---------- */

  function sum(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return s; }
  function mean(arr) { return arr.length ? sum(arr) / arr.length : 0; }
  function variance(arr) {
    if (!arr.length) return 0;
    var m = mean(arr), s = 0;
    for (var i = 0; i < arr.length; i++) s += (arr[i] - m) * (arr[i] - m);
    return s / arr.length;
  }
  function stdev(arr) { return Math.sqrt(variance(arr)); }

  /* ---------- DOM ---------- */

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function $(selector, root) { return (root || document).querySelector(selector); }
  function $$(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /** Dateinamen-tauglicher Text */
  function slugify(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60) || 'schichtplan';
  }

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

  return {
    MIN_PER_DAY: MIN_PER_DAY,
    parseTime: parseTime,
    formatTime: formatTime,
    formatTimeDay: formatTimeDay,
    normalizeWindow: normalizeWindow,
    alignToWindow: alignToWindow,
    overlaps: overlaps,
    formatDuration: formatDuration,
    hoursText: hoursText,
    formatDate: formatDate,
    addDays: addDays,
    dateForMinutes: dateForMinutes,
    weekdayName: weekdayName,
    todayIso: todayIso,
    pad2: pad2,
    uid: uid,
    rng: rng,
    hashString: hashString,
    sum: sum,
    mean: mean,
    variance: variance,
    stdev: stdev,
    escapeHtml: escapeHtml,
    $: $,
    $$: $$,
    downloadBlob: downloadBlob,
    slugify: slugify,
    clamp: clamp
  };
})();

</script>
<script>
/* ---- src/store.js ---- */
/* ============================================================
   store.js – Datenmodell, Persistenz, Validierung
   ------------------------------------------------------------
   Datenmodell (Version 1):

   state = {
     version: 1,
     step:    Number,                       // aktueller Wizard-Schritt (1..6)
     event:   { name, date, startTime, endTime, notes },
     people:  [ { id, name, arrival, departure, note } ],
     tasks:   [ { id, name, wholeEvent, startTime, endTime,
                  slotMinutes, peoplePerSlot, note } ],
     absences:[ { id, personId, startTime, endTime, reason } ],
     options: { seed, minRestMinutes, preferBlocks, maxShiftsPerPerson,
                mergeShortLastSlot, balanceTaskTypes },
     schedule: null | Ergebnisobjekt aus scheduler.js
   }

   Uhrzeiten werden als "HH:MM" gespeichert und beim Rechnen in
   Minuten seit Veranstaltungsbeginn umgerechnet. Endet eine Zeit
   rechnerisch vor ihrem Start, liegt sie am Folgetag – damit sind
   Veranstaltungen über Mitternacht abgedeckt.
   ============================================================ */

window.Store = (function () {
  'use strict';

  var U = window.Util;
  var STORAGE_KEY = 'schichtplaner.state.v1';
  var VERSION = 1;

  function defaultState() {
    return {
      version: VERSION,
      step: 1,
      event: { name: '', date: U.todayIso(), startTime: '08:00', endTime: '22:00', notes: '' },
      people: [],
      tasks: [],
      absences: [],
      options: {
        seed: 42,
        minRestMinutes: 0,
        preferBlocks: false,
        maxShiftsPerPerson: 0,      // 0 = keine Obergrenze
        mergeShortLastSlot: true,
        balanceTaskTypes: true,
        exportSheets: { people: true, availability: true, issues: true, info: true }
      },
      schedule: null
    };
  }

  var state = defaultState();

  /* ---------- Persistenz ---------- */

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      /* Speicher voll oder nicht verfügbar – App funktioniert trotzdem weiter. */
    }
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var parsed = JSON.parse(raw);
      state = migrate(parsed);
      return true;
    } catch (err) {
      return false;
    }
  }

  /** Fehlende Felder ergänzen – hält alte gespeicherte Stände lauffähig. */
  function migrate(raw) {
    var base = defaultState();
    if (!raw || typeof raw !== 'object') return base;
    var next = {
      version: VERSION,
      step: U.clamp(parseInt(raw.step, 10) || 1, 1, 6),
      event: Object.assign({}, base.event, raw.event || {}),
      people: (raw.people || []).map(function (p) {
        return {
          id: p.id || U.uid('p'),
          name: String(p.name || ''),
          arrival: p.arrival || '',
          departure: p.departure || '',
          note: String(p.note || '')
        };
      }),
      tasks: (raw.tasks || []).map(function (t) {
        return {
          id: t.id || U.uid('t'),
          name: String(t.name || ''),
          wholeEvent: t.wholeEvent !== false,
          startTime: t.startTime || '',
          endTime: t.endTime || '',
          slotMinutes: parseInt(t.slotMinutes, 10) || 60,
          peoplePerSlot: U.clamp(parseInt(t.peoplePerSlot, 10) || 1, 1, 10),
          note: String(t.note || '')
        };
      }),
      absences: (raw.absences || []).map(function (a) {
        return {
          id: a.id || U.uid('a'),
          personId: a.personId || '',
          startTime: a.startTime || '',
          endTime: a.endTime || '',
          reason: String(a.reason || '')
        };
      }),
      options: Object.assign({}, base.options, raw.options || {}, {
        exportSheets: Object.assign({}, base.options.exportSheets, (raw.options || {}).exportSheets || {})
      }),
      schedule: raw.schedule || null
    };
    // Abwesenheiten ohne existierende Person verwerfen.
    var ids = {};
    next.people.forEach(function (p) { ids[p.id] = true; });
    next.absences = next.absences.filter(function (a) { return ids[a.personId]; });
    return next;
  }

  function reset() {
    state = defaultState();
    save();
  }

  /* ---------- Zugriff ---------- */

  function get() { return state; }

  function set(patch) {
    Object.assign(state, patch);
    save();
  }

  function personById(id) {
    for (var i = 0; i < state.people.length; i++) if (state.people[i].id === id) return state.people[i];
    return null;
  }

  function personName(id) {
    var p = personById(id);
    return p ? (p.name || 'Ohne Namen') : '';
  }

  function taskById(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }

  /* ---------- Mutationen ---------- */

  function addPerson(name) {
    var person = { id: U.uid('p'), name: name || '', arrival: '', departure: '', note: '' };
    state.people.push(person);
    invalidateSchedule();
    save();
    return person;
  }

  function removePerson(id) {
    state.people = state.people.filter(function (p) { return p.id !== id; });
    state.absences = state.absences.filter(function (a) { return a.personId !== id; });
    invalidateSchedule();
    save();
  }

  function addTask(preset) {
    var task = Object.assign({
      id: U.uid('t'),
      name: '',
      wholeEvent: true,
      startTime: state.event.startTime,
      endTime: state.event.endTime,
      slotMinutes: 60,
      peoplePerSlot: 1,
      note: ''
    }, preset || {});
    task.id = U.uid('t');
    state.tasks.push(task);
    invalidateSchedule();
    save();
    return task;
  }

  function removeTask(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    invalidateSchedule();
    save();
  }

  function addAbsence(personId) {
    var absence = {
      id: U.uid('a'),
      personId: personId,
      startTime: state.event.startTime,
      endTime: state.event.endTime,
      reason: ''
    };
    state.absences.push(absence);
    invalidateSchedule();
    save();
    return absence;
  }

  function removeAbsence(id) {
    state.absences = state.absences.filter(function (a) { return a.id !== id; });
    invalidateSchedule();
    save();
  }

  function absencesFor(personId) {
    return state.absences.filter(function (a) { return a.personId === personId; });
  }

  /** Ein bereits berechneter Plan passt nach Datenänderungen nicht mehr. */
  function invalidateSchedule() {
    if (state.schedule) state.schedule.stale = true;
  }

  /* ---------- Validierung ---------- */

  /** Prüft einen Wizard-Schritt. Rückgabe: Array von Fehlermeldungen. */
  function validateStep(step) {
    var errors = [];
    var ev = state.event;

    if (step === 1) {
      if (!ev.name.trim()) errors.push('Bitte einen Namen für die Veranstaltung eingeben.');
      if (!ev.date) errors.push('Bitte ein Datum auswählen.');
      var s = U.parseTime(ev.startTime), e = U.parseTime(ev.endTime);
      if (s === null) errors.push('Startzeit ist ungültig (Format HH:MM).');
      if (e === null) errors.push('Endzeit ist ungültig (Format HH:MM).');
      if (s !== null && e !== null && s === e) {
        errors.push('Start- und Endzeit dürfen nicht identisch sein.');
      }
    }

    if (step === 2) {
      var named = state.people.filter(function (p) { return p.name.trim(); });
      if (named.length < 1) errors.push('Bitte mindestens eine Person erfassen.');
      var seen = {};
      named.forEach(function (p) {
        var key = p.name.trim().toLowerCase();
        if (seen[key]) errors.push('Der Name „' + p.name.trim() + '“ kommt mehrfach vor.');
        seen[key] = true;
      });
    }

    if (step === 3) {
      if (!state.tasks.length) errors.push('Bitte mindestens eine Aufgabe anlegen.');
      state.tasks.forEach(function (t, i) {
        var label = t.name.trim() || 'Aufgabe ' + (i + 1);
        if (!t.name.trim()) errors.push('Aufgabe ' + (i + 1) + ': Bitte einen Namen eingeben.');
        if (!(t.slotMinutes > 0)) errors.push(label + ': Schichtlänge muss größer als 0 sein.');
        if (!(t.peoplePerSlot >= 1)) errors.push(label + ': Es wird mindestens 1 Person pro Schicht benötigt.');
        if (!t.wholeEvent) {
          var ts = U.parseTime(t.startTime), te = U.parseTime(t.endTime);
          if (ts === null || te === null) {
            errors.push(label + ': Zeitraum ist unvollständig oder ungültig.');
          } else if (ts === te) {
            errors.push(label + ': Start- und Endzeit dürfen nicht identisch sein.');
          }
        }
      });
    }

    if (step === 4) {
      state.absences.forEach(function (a) {
        var name = personName(a.personId) || 'Unbekannt';
        var as = U.parseTime(a.startTime), ae = U.parseTime(a.endTime);
        if (as === null || ae === null) {
          errors.push(name + ': Abwesenheit hat eine ungültige Uhrzeit.');
        } else if (as === ae) {
          errors.push(name + ': Abwesenheit hat identische Start- und Endzeit.');
        }
      });
      state.people.forEach(function (p) {
        if (p.arrival && U.parseTime(p.arrival) === null) {
          errors.push((p.name || 'Person') + ': „kommt erst ab“ ist ungültig.');
        }
        if (p.departure && U.parseTime(p.departure) === null) {
          errors.push((p.name || 'Person') + ': „geht früher“ ist ungültig.');
        }
      });
    }

    return errors;
  }

  /** Personen mit Namen – nur diese werden verplant. */
  function activePeople() {
    return state.people.filter(function (p) { return p.name.trim(); });
  }

  /* ---------- Import / Export ---------- */

  function toJson() { return JSON.stringify(state, null, 2); }

  function fromJson(text) {
    var parsed = JSON.parse(text);
    state = migrate(parsed);
    save();
  }

  /* ---------- Demodaten ---------- */

  function loadDemo() {
    state = defaultState();
    state.event = {
      name: 'Jugendfreizeit – Sommerfest',
      date: U.todayIso(),
      startTime: '08:00',
      endTime: '22:00',
      notes: 'Treffpunkt für alle Schichten ist der Info-Tisch im Foyer.'
    };
    ['Anna', 'Ben', 'Clara', 'David', 'Elena', 'Frank', 'Greta', 'Hannes']
      .forEach(function (n) { state.people.push({ id: U.uid('p'), name: n, arrival: '', departure: '', note: '' }); });

    state.people[3].arrival = '12:00';   // David kommt später
    state.people[6].departure = '18:00'; // Greta geht früher

    state.tasks = [
      { id: U.uid('t'), name: 'Teeschicht',            wholeEvent: true,  startTime: '08:00', endTime: '22:00', slotMinutes: 120, peoplePerSlot: 1, note: 'Teeküche im Foyer' },
      { id: U.uid('t'), name: 'Türschicht',            wholeEvent: true,  startTime: '08:00', endTime: '22:00', slotMinutes: 60,  peoplePerSlot: 2, note: 'Immer zu zweit besetzen' },
      { id: U.uid('t'), name: 'Küchendienst / Essen',  wholeEvent: false, startTime: '11:30', endTime: '14:00', slotMinutes: 75,  peoplePerSlot: 2, note: '' },
      { id: U.uid('t'), name: 'Frühstücksvorbereitung',wholeEvent: false, startTime: '08:00', endTime: '09:30', slotMinutes: 90,  peoplePerSlot: 2, note: '' },
      { id: U.uid('t'), name: 'Aufräumen',             wholeEvent: false, startTime: '20:00', endTime: '22:00', slotMinutes: 60,  peoplePerSlot: 2, note: '' },
      { id: U.uid('t'), name: 'Brötchen besorgen',     wholeEvent: false, startTime: '08:00', endTime: '09:00', slotMinutes: 60,  peoplePerSlot: 1, note: 'Bäckerei Ecke Hauptstraße' }
    ];

    state.absences = [
      { id: U.uid('a'), personId: state.people[0].id, startTime: '14:00', endTime: '16:00', reason: 'Workshop-Leitung' },
      { id: U.uid('a'), personId: state.people[2].id, startTime: '17:00', endTime: '19:00', reason: 'Probe' },
      { id: U.uid('a'), personId: state.people[5].id, startTime: '09:00', endTime: '11:00', reason: 'Anreise Gäste' }
    ];

    state.step = 1;
    save();
  }

  return {
    VERSION: VERSION,
    defaultState: defaultState,
    get: get,
    set: set,
    save: save,
    load: load,
    reset: reset,
    personById: personById,
    personName: personName,
    taskById: taskById,
    addPerson: addPerson,
    removePerson: removePerson,
    addTask: addTask,
    removeTask: removeTask,
    addAbsence: addAbsence,
    removeAbsence: removeAbsence,
    absencesFor: absencesFor,
    invalidateSchedule: invalidateSchedule,
    validateStep: validateStep,
    activePeople: activePeople,
    toJson: toJson,
    fromJson: fromJson,
    loadDemo: loadDemo
  };
})();

</script>
<script>
/* ---- src/scheduler.js ---- */
/* ============================================================
   scheduler.js – Faire automatische Schichtverteilung
   ------------------------------------------------------------
   Ablauf:
     1. Kontext aufbauen (Zeitfenster, Nichtverfügbarkeiten)
     2. Schichten (Slots) aus den Aufgaben erzeugen
     3. Greedy-Erstbelegung: knappste Schicht zuerst,
        günstigste Person (= geringste Last) zuerst
     4. Reparaturlauf: freie Plätze durch Umsetzen füllen
     5. Ausgleichslauf: Verschieben & Tauschen, solange die
        Fairness-Kostenfunktion sinkt
     6. Statistik und Problemliste

   Harte Regeln (werden nie verletzt):
     - keine Einteilung in Abwesenheitszeiten
     - keine zwei Aufgaben gleichzeitig
     - keine Person doppelt in derselben Schicht
     - optionale Obergrenze an Schichten pro Person

   Weiche Regeln (fließen in die Kostenfunktion ein):
     - gleiche Gesamtarbeitszeit für alle
     - gleiche Anzahl Schichten für alle
     - gleichmäßige Verteilung über die Aufgabenarten
     - Mindestpause zwischen zwei Schichten
     - Blöcke bevorzugen bzw. Schichten hintereinander vermeiden
   ============================================================ */

window.Scheduler = (function () {
  'use strict';

  var U = window.Util;
  var EPS = 1e-9;

  /* Gewichte der Kostenfunktion (kleiner = fairer) */
  var W_MINUTES = 1;      // Varianz der Gesamtminuten (Leitgröße)
  var W_COUNT = 900;      // Varianz der Schichtanzahl
  var W_TASKMIX = 250;    // Varianz je Aufgabenart
  var W_REST = 2500;      // verletzte Mindestpause
  var W_ADJACENT = 400;   // direkt aneinandergrenzende Schichten

  /* ---------------- Kontext ---------------- */

  /**
   * Bereitet alle Zeitangaben in Minuten relativ zum Veranstaltungstag auf.
   * Ergebnis enthält u. a. die Nichtverfügbarkeiten je Person.
   */
  function buildContext(state) {
    var ev = state.event;
    var evStart = U.parseTime(ev.startTime);
    var evEnd = U.parseTime(ev.endTime);
    if (evStart === null) evStart = 0;
    if (evEnd === null) evEnd = evStart + 60;
    var win = U.normalizeWindow(evStart, evEnd);

    var people = state.people.filter(function (p) { return p.name.trim(); });
    var unavailable = {};
    var availableMinutes = {};

    people.forEach(function (p) {
      var blocks = [];

      // Kommt erst später / geht früher -> Randzeiten sperren
      if (p.arrival && U.parseTime(p.arrival) !== null) {
        var arr = U.alignToWindow(U.parseTime(p.arrival), win.start);
        if (arr > win.start) blocks.push({ start: win.start, end: Math.min(arr, win.end), reason: 'kommt später' });
      }
      if (p.departure && U.parseTime(p.departure) !== null) {
        var dep = U.alignToWindow(U.parseTime(p.departure), win.start);
        if (dep < win.end) blocks.push({ start: Math.max(dep, win.start), end: win.end, reason: 'geht früher' });
      }

      // Eingetragene Abwesenheiten
      state.absences.forEach(function (a) {
        if (a.personId !== p.id) return;
        var s = U.parseTime(a.startTime), e = U.parseTime(a.endTime);
        if (s === null || e === null) return;
        var as = U.alignToWindow(s, win.start);
        var ae = U.alignToWindow(e, as);
        if (ae <= as) ae += U.MIN_PER_DAY;
        blocks.push({ start: as, end: ae, reason: a.reason || 'abwesend' });
      });

      unavailable[p.id] = blocks;

      // Wie viel Zeit steht die Person überhaupt zur Verfügung?
      var free = win.end - win.start;
      blocks.forEach(function (b) {
        var s = Math.max(b.start, win.start), e = Math.min(b.end, win.end);
        if (e > s) free -= (e - s);
      });
      availableMinutes[p.id] = Math.max(0, free);
    });

    return {
      window: win,
      people: people,
      peopleIds: people.map(function (p) { return p.id; }),
      unavailable: unavailable,
      availableMinutes: availableMinutes,
      options: state.options,
      date: ev.date
    };
  }

  /** Ist die Person im gesamten Intervall [start,end) verfügbar? */
  function isAvailable(ctx, personId, start, end) {
    var blocks = ctx.unavailable[personId] || [];
    for (var i = 0; i < blocks.length; i++) {
      if (U.overlaps(start, end, blocks[i].start, blocks[i].end)) return false;
    }
    return true;
  }

  /** Grund der Nichtverfügbarkeit (für Anzeige/Export) */
  function blockingReason(ctx, personId, start, end) {
    var blocks = ctx.unavailable[personId] || [];
    for (var i = 0; i < blocks.length; i++) {
      if (U.overlaps(start, end, blocks[i].start, blocks[i].end)) return blocks[i].reason;
    }
    return '';
  }

  /* ---------------- Schichten erzeugen ---------------- */

  function buildSlots(state, ctx) {
    var slots = [];
    var warnings = [];
    var win = ctx.window;
    var merge = state.options.mergeShortLastSlot !== false;

    state.tasks.forEach(function (task) {
      var start, end;
      if (task.wholeEvent) {
        start = win.start;
        end = win.end;
      } else {
        var ts = U.parseTime(task.startTime), te = U.parseTime(task.endTime);
        if (ts === null || te === null) {
          warnings.push({ type: 'task', taskName: task.name, message: 'Zeitraum unvollständig – Aufgabe wurde übersprungen.' });
          return;
        }
        start = U.alignToWindow(ts, win.start);
        end = U.alignToWindow(te, start);
        if (end <= start) end += U.MIN_PER_DAY;
        // auf das Veranstaltungsfenster begrenzen
        var clippedStart = Math.max(start, win.start);
        var clippedEnd = Math.min(end, win.end);
        if (clippedEnd <= clippedStart) {
          warnings.push({
            type: 'task', taskName: task.name,
            message: 'Zeitraum liegt außerhalb der Veranstaltung – Aufgabe wurde übersprungen.'
          });
          return;
        }
        if (clippedStart !== start || clippedEnd !== end) {
          warnings.push({
            type: 'task', taskName: task.name,
            message: 'Zeitraum wurde auf die Veranstaltungszeit gekürzt (' +
              U.formatTime(clippedStart) + '–' + U.formatTime(clippedEnd) + ').'
          });
        }
        start = clippedStart;
        end = clippedEnd;
      }

      var len = Math.max(5, parseInt(task.slotMinutes, 10) || 60);
      var required = U.clamp(parseInt(task.peoplePerSlot, 10) || 1, 1, 10);
      var taskSlots = [];
      var cursor = start;
      while (cursor < end) {
        var slotEnd = Math.min(cursor + len, end);
        taskSlots.push({ start: cursor, end: slotEnd });
        cursor = slotEnd;
      }
      // Sehr kurze Restschicht an die vorherige anhängen
      if (merge && taskSlots.length > 1) {
        var last = taskSlots[taskSlots.length - 1];
        if ((last.end - last.start) < len / 2) {
          taskSlots[taskSlots.length - 2].end = last.end;
          taskSlots.pop();
        }
      }

      taskSlots.forEach(function (s, i) {
        slots.push({
          id: U.uid('s'),
          taskId: task.id,
          taskName: task.name.trim() || 'Aufgabe',
          taskNote: task.note || '',
          index: i + 1,
          start: s.start,
          end: s.end,
          required: required,
          assigned: new Array(required).fill(null),
          manual: new Array(required).fill(false)
        });
      });
    });

    slots.sort(function (a, b) {
      return a.start - b.start || a.taskName.localeCompare(b.taskName, 'de');
    });
    return { slots: slots, warnings: warnings };
  }

  /* ---------------- Belegungszustand ---------------- */

  function createAssignmentState(ctx, slots) {
    var st = {
      ctx: ctx,
      slots: slots,
      byPerson: {},      // personId -> [{start, end, slotId, taskId}]
      minutes: {},
      count: {},
      taskCount: {},     // personId -> { taskId: n }
      penalty: {},       // personId -> weiche Einzelstrafen
      taskIds: []
    };
    ctx.peopleIds.forEach(function (id) {
      st.byPerson[id] = [];
      st.minutes[id] = 0;
      st.count[id] = 0;
      st.taskCount[id] = {};
      st.penalty[id] = 0;
    });
    var seen = {};
    slots.forEach(function (s) { if (!seen[s.taskId]) { seen[s.taskId] = true; st.taskIds.push(s.taskId); } });
    return st;
  }

  function assign(st, slot, seat, personId) {
    slot.assigned[seat] = personId;
    st.byPerson[personId].push({ start: slot.start, end: slot.end, slotId: slot.id, taskId: slot.taskId });
    st.minutes[personId] += (slot.end - slot.start);
    st.count[personId] += 1;
    st.taskCount[personId][slot.taskId] = (st.taskCount[personId][slot.taskId] || 0) + 1;
    updatePenalty(st, personId);
  }

  function unassign(st, slot, seat) {
    var personId = slot.assigned[seat];
    if (!personId) return null;
    slot.assigned[seat] = null;
    var list = st.byPerson[personId];
    for (var i = 0; i < list.length; i++) {
      if (list[i].slotId === slot.id) { list.splice(i, 1); break; }
    }
    st.minutes[personId] -= (slot.end - slot.start);
    st.count[personId] -= 1;
    st.taskCount[personId][slot.taskId] -= 1;
    updatePenalty(st, personId);
    return personId;
  }

  /** Weiche Strafen einer Person: Mindestpause und Blockbildung */
  function updatePenalty(st, personId) {
    var opts = st.ctx.options || {};
    var minRest = parseInt(opts.minRestMinutes, 10) || 0;
    var list = st.byPerson[personId].slice().sort(function (a, b) { return a.start - b.start; });
    var penalty = 0;
    for (var i = 1; i < list.length; i++) {
      var gap = list[i].start - list[i - 1].end;
      if (gap < 0) gap = 0;
      if (gap === 0) {
        // direkt aneinander: je nach Wunsch Bonus oder Strafe
        penalty += opts.preferBlocks ? -W_ADJACENT / 2 : W_ADJACENT;
      } else if (minRest > 0 && gap < minRest) {
        penalty += W_REST;
      }
    }
    st.penalty[personId] = penalty;
  }

  /** Fairness-Kosten des aktuellen Gesamtplans (kleiner ist besser) */
  function cost(st) {
    var ids = st.ctx.peopleIds;
    if (!ids.length) return 0;
    var mins = [], cnts = [];
    var total = 0;
    for (var i = 0; i < ids.length; i++) {
      mins.push(st.minutes[ids[i]]);
      cnts.push(st.count[ids[i]]);
      total += st.penalty[ids[i]];
    }
    var c = W_MINUTES * U.variance(mins) + W_COUNT * U.variance(cnts) + total;

    if (st.ctx.options && st.ctx.options.balanceTaskTypes !== false) {
      for (var t = 0; t < st.taskIds.length; t++) {
        var tid = st.taskIds[t];
        var per = [];
        for (var j = 0; j < ids.length; j++) per.push(st.taskCount[ids[j]][tid] || 0);
        c += W_TASKMIX * U.variance(per);
      }
    }
    return c;
  }

  /* ---------------- Eignungsprüfung ---------------- */

  function hasConflict(st, personId, start, end, exceptSlotId) {
    var list = st.byPerson[personId] || [];
    for (var i = 0; i < list.length; i++) {
      if (exceptSlotId && list[i].slotId === exceptSlotId) continue;
      if (U.overlaps(start, end, list[i].start, list[i].end)) return true;
    }
    return false;
  }

  function inSlot(slot, personId) {
    for (var i = 0; i < slot.assigned.length; i++) if (slot.assigned[i] === personId) return true;
    return false;
  }

  function isEligible(st, slot, personId) {
    var max = parseInt(st.ctx.options.maxShiftsPerPerson, 10) || 0;
    if (max > 0 && st.count[personId] >= max) return false;
    if (inSlot(slot, personId)) return false;
    if (!isAvailable(st.ctx, personId, slot.start, slot.end)) return false;
    if (hasConflict(st, personId, slot.start, slot.end, slot.id)) return false;
    return true;
  }

  /** Personen, die (nur nach Abwesenheiten betrachtet) infrage kämen */
  function availableCountFor(ctx, slot) {
    var n = 0;
    for (var i = 0; i < ctx.peopleIds.length; i++) {
      if (isAvailable(ctx, ctx.peopleIds[i], slot.start, slot.end)) n++;
    }
    return n;
  }

  /* ---------------- Greedy-Erstbelegung ---------------- */

  function greedyFill(st, rand) {
    var ctx = st.ctx;
    var maxAvail = 1;
    ctx.peopleIds.forEach(function (id) { maxAvail = Math.max(maxAvail, ctx.availableMinutes[id]); });

    // Knappste Schichten zuerst: wenig Auswahl, viele benötigte Personen
    var order = st.slots.slice().map(function (slot) {
      return { slot: slot, slack: availableCountFor(ctx, slot) - slot.required };
    });
    order.sort(function (a, b) {
      return a.slack - b.slack || a.slot.start - b.slot.start ||
        a.slot.taskName.localeCompare(b.slot.taskName, 'de');
    });

    order.forEach(function (entry) {
      var slot = entry.slot;
      for (var seat = 0; seat < slot.required; seat++) {
        if (slot.assigned[seat]) continue;
        var best = null, bestScore = Infinity;
        for (var i = 0; i < ctx.peopleIds.length; i++) {
          var pid = ctx.peopleIds[i];
          if (!isEligible(st, slot, pid)) continue;
          var score = candidateScore(st, slot, pid, maxAvail, rand);
          if (score < bestScore) { bestScore = score; best = pid; }
        }
        if (best) assign(st, slot, seat, best);
      }
    });
  }

  function candidateScore(st, slot, personId, maxAvail, rand) {
    var opts = st.ctx.options;
    var score = st.minutes[personId] + st.count[personId] * 15;

    if (opts.balanceTaskTypes !== false) {
      score += (st.taskCount[personId][slot.taskId] || 0) * 25;
    }

    // Wer insgesamt wenig Zeit hat, wird früher berücksichtigt
    var ratio = maxAvail > 0 ? (st.ctx.availableMinutes[personId] / maxAvail) : 1;
    score -= (1 - ratio) * 90;

    // Nachbarschaft zu bereits vergebenen Schichten
    var minRest = parseInt(opts.minRestMinutes, 10) || 0;
    var list = st.byPerson[personId];
    for (var i = 0; i < list.length; i++) {
      var gap = list[i].start >= slot.end ? (list[i].start - slot.end)
        : (slot.start >= list[i].end ? (slot.start - list[i].end) : 0);
      if (gap === 0) score += opts.preferBlocks ? -35 : 45;
      else if (minRest > 0 && gap < minRest) score += 200;
    }

    // Deterministischer Mini-Zufall bricht Gleichstände auf
    score += rand() * 4;
    return score;
  }

  /* ---------------- Reparatur: freie Plätze füllen ---------------- */

  /**
   * Für jeden freien Platz wird versucht, eine verfügbare Person
   * freizuräumen, indem ihre kollidierende Schicht an jemand
   * anderen abgegeben wird (einstufige Kettenverschiebung).
   */
  function repairOpenSeats(st) {
    var changed = false;
    st.slots.forEach(function (slot) {
      for (var seat = 0; seat < slot.required; seat++) {
        if (slot.assigned[seat]) continue;

        // 1. Direkt jemanden einsetzen, falls möglich
        var direct = bestEligible(st, slot);
        if (direct) { assign(st, slot, seat, direct); changed = true; continue; }

        // 2. Kettenverschiebung
        if (moveChain(st, slot, seat)) changed = true;
      }
    });
    return changed;
  }

  function bestEligible(st, slot, excludeId) {
    var best = null, bestScore = Infinity;
    for (var i = 0; i < st.ctx.peopleIds.length; i++) {
      var pid = st.ctx.peopleIds[i];
      if (excludeId && pid === excludeId) continue;
      if (!isEligible(st, slot, pid)) continue;
      var score = st.minutes[pid] + st.count[pid] * 15;
      if (score < bestScore) { bestScore = score; best = pid; }
    }
    return best;
  }

  function moveChain(st, slot, seat) {
    var ctx = st.ctx;
    for (var i = 0; i < ctx.peopleIds.length; i++) {
      var pid = ctx.peopleIds[i];
      if (inSlot(slot, pid)) continue;
      if (!isAvailable(ctx, pid, slot.start, slot.end)) continue;
      var max = parseInt(ctx.options.maxShiftsPerPerson, 10) || 0;
      if (max > 0 && st.count[pid] >= max) continue;

      // Kollidierende Schichten dieser Person suchen
      var clashes = st.byPerson[pid].filter(function (a) {
        return U.overlaps(slot.start, slot.end, a.start, a.end);
      });
      if (clashes.length !== 1) continue;

      var clashSlot = findSlot(st, clashes[0].slotId);
      if (!clashSlot) continue;
      var clashSeat = clashSlot.assigned.indexOf(pid);
      if (clashSeat < 0) continue;
      if (clashSlot.manual && clashSlot.manual[clashSeat]) continue;

      // Ersatz für die freigewordene Schicht suchen
      unassign(st, clashSlot, clashSeat);
      var replacement = bestEligible(st, clashSlot, pid);
      if (replacement) {
        assign(st, clashSlot, clashSeat, replacement);
        assign(st, slot, seat, pid);
        return true;
      }
      assign(st, clashSlot, clashSeat, pid); // zurückrollen
    }
    return false;
  }

  function findSlot(st, slotId) {
    for (var i = 0; i < st.slots.length; i++) if (st.slots[i].id === slotId) return st.slots[i];
    return null;
  }

  /* ---------------- Ausgleich: Verschieben & Tauschen ---------------- */

  function balance(st, rand, maxPasses) {
    var passes = 0;
    while (passes < maxPasses) {
      passes++;
      var improved = false;
      if (improveByMoving(st)) improved = true;
      if (improveBySwapping(st, rand)) improved = true;
      if (!improved) break;
    }
    return passes;
  }

  function improveByMoving(st) {
    var improved = false;
    for (var i = 0; i < st.slots.length; i++) {
      var slot = st.slots[i];
      for (var seat = 0; seat < slot.required; seat++) {
        var current = slot.assigned[seat];
        if (!current) continue;
        if (slot.manual && slot.manual[seat]) continue;

        var before = cost(st);
        var bestPerson = null, bestCost = before;
        for (var j = 0; j < st.ctx.peopleIds.length; j++) {
          var pid = st.ctx.peopleIds[j];
          if (pid === current) continue;
          unassign(st, slot, seat);
          var ok = isEligible(st, slot, pid);
          if (ok) {
            assign(st, slot, seat, pid);
            var c = cost(st);
            if (c < bestCost - EPS) { bestCost = c; bestPerson = pid; }
            unassign(st, slot, seat);
          }
          assign(st, slot, seat, current); // Ausgangszustand wiederherstellen
        }
        if (bestPerson) {
          unassign(st, slot, seat);
          assign(st, slot, seat, bestPerson);
          improved = true;
        }
      }
    }
    return improved;
  }

  function improveBySwapping(st, rand) {
    // Liste aller belegten Plätze
    var seats = [];
    st.slots.forEach(function (slot) {
      for (var seat = 0; seat < slot.required; seat++) {
        if (slot.assigned[seat] && !(slot.manual && slot.manual[seat])) {
          seats.push({ slot: slot, seat: seat });
        }
      }
    });
    if (seats.length < 2) return false;

    var improved = false;
    var attemptsPerSeat = Math.min(seats.length - 1, 24);

    for (var i = 0; i < seats.length; i++) {
      for (var k = 0; k < attemptsPerSeat; k++) {
        var j = Math.floor(rand() * seats.length);
        if (j === i) continue;
        var a = seats[i], b = seats[j];
        if (a.slot.id === b.slot.id) continue;
        var pa = a.slot.assigned[a.seat], pb = b.slot.assigned[b.seat];
        if (!pa || !pb || pa === pb) continue;

        var before = cost(st);
        unassign(st, a.slot, a.seat);
        unassign(st, b.slot, b.seat);

        if (isEligible(st, a.slot, pb) && isEligible(st, b.slot, pa)) {
          assign(st, a.slot, a.seat, pb);
          assign(st, b.slot, b.seat, pa);
          if (cost(st) < before - EPS) { improved = true; continue; }
          unassign(st, a.slot, a.seat);
          unassign(st, b.slot, b.seat);
        }
        assign(st, a.slot, a.seat, pa);
        assign(st, b.slot, b.seat, pb);
      }
    }
    return improved;
  }

  /* ---------------- Statistik & Probleme ---------------- */

  function buildStats(state, ctx, slots) {
    var perPerson = {};
    ctx.people.forEach(function (p) {
      perPerson[p.id] = {
        personId: p.id,
        name: p.name.trim(),
        count: 0,
        minutes: 0,
        availableMinutes: ctx.availableMinutes[p.id],
        tasks: {},
        shifts: []
      };
    });

    var requiredSeats = 0, filledSeats = 0;
    slots.forEach(function (slot) {
      requiredSeats += slot.required;
      slot.assigned.forEach(function (pid) {
        if (!pid || !perPerson[pid]) return;
        filledSeats++;
        var rec = perPerson[pid];
        rec.count += 1;
        rec.minutes += (slot.end - slot.start);
        rec.tasks[slot.taskName] = (rec.tasks[slot.taskName] || 0) + 1;
        rec.shifts.push(slot.id);
      });
    });

    var list = ctx.people.map(function (p) { return perPerson[p.id]; });
    var mins = list.map(function (r) { return r.minutes; });
    var counts = list.map(function (r) { return r.count; });

    return {
      perPerson: list,
      totalSlots: slots.length,
      requiredSeats: requiredSeats,
      filledSeats: filledSeats,
      openSeats: requiredSeats - filledSeats,
      totalMinutes: U.sum(mins),
      meanMinutes: U.mean(mins),
      minMinutes: mins.length ? Math.min.apply(null, mins) : 0,
      maxMinutes: mins.length ? Math.max.apply(null, mins) : 0,
      spreadMinutes: mins.length ? (Math.max.apply(null, mins) - Math.min.apply(null, mins)) : 0,
      stdevMinutes: U.stdev(mins),
      minCount: counts.length ? Math.min.apply(null, counts) : 0,
      maxCount: counts.length ? Math.max.apply(null, counts) : 0
    };
  }

  function buildIssues(ctx, slots, taskWarnings) {
    var issues = [];

    taskWarnings.forEach(function (w) {
      issues.push({
        severity: 'warn',
        taskName: w.taskName,
        start: null,
        end: null,
        required: 0,
        filled: 0,
        message: w.message
      });
    });

    slots.forEach(function (slot) {
      var filled = slot.assigned.filter(Boolean).length;
      if (filled >= slot.required) return;
      var avail = availableCountFor(ctx, slot);
      var message;
      if (avail === 0) {
        message = 'Niemand ist in diesem Zeitraum verfügbar.';
      } else if (avail < slot.required) {
        message = 'Nur ' + avail + ' von ' + slot.required + ' benötigten Personen sind überhaupt verfügbar.';
      } else {
        message = 'Alle verfügbaren Personen sind zu dieser Zeit bereits anderweitig eingeteilt.';
      }
      issues.push({
        severity: filled === 0 ? 'error' : 'warn',
        slotId: slot.id,
        taskName: slot.taskName,
        start: slot.start,
        end: slot.end,
        required: slot.required,
        filled: filled,
        message: message
      });
    });

    return issues;
  }

  /* ---------------- Öffentliche API ---------------- */

  /** Berechnet einen kompletten Plan aus dem aktuellen Zustand. */
  function compute(state) {
    var ctx = buildContext(state);
    var built = buildSlots(state, ctx);
    var slots = built.slots;
    var st = createAssignmentState(ctx, slots);
    var seed = parseInt(state.options.seed, 10);
    if (isNaN(seed)) seed = 42;
    var rand = U.rng(seed);

    if (ctx.peopleIds.length && slots.length) {
      greedyFill(st, rand);
      repairOpenSeats(st);
      balance(st, rand, 8);
      repairOpenSeats(st);
      balance(st, rand, 3);
    }

    var schedule = {
      generatedAt: new Date().toISOString(),
      seed: seed,
      window: ctx.window,
      date: state.event.date,
      slots: slots,
      stats: buildStats(state, ctx, slots),
      issues: buildIssues(ctx, slots, built.warnings),
      stale: false
    };
    return schedule;
  }

  /**
   * Kandidatenlisten für die manuelle Nachbesetzung in der Oberfläche.
   * Rückgabe: { slotId: [ [ {personId, name, ok, reason}, ... ] je Platz ] }
   */
  function seatOptions(state, schedule) {
    var ctx = buildContext(state);
    var busy = {};
    ctx.peopleIds.forEach(function (id) { busy[id] = []; });
    schedule.slots.forEach(function (slot) {
      slot.assigned.forEach(function (pid) {
        if (pid && busy[pid]) busy[pid].push({ start: slot.start, end: slot.end, slotId: slot.id });
      });
    });

    function busyElsewhere(pid, slot) {
      var list = busy[pid] || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].slotId === slot.id) continue;
        if (U.overlaps(slot.start, slot.end, list[i].start, list[i].end)) return true;
      }
      return false;
    }

    var result = {};
    schedule.slots.forEach(function (slot) {
      var seats = [];
      for (var seat = 0; seat < slot.required; seat++) {
        var current = slot.assigned[seat];
        /* jshint loopfunc:true */
        seats.push(ctx.people.map(function (p) {
          if (p.id === current) return { personId: p.id, name: p.name.trim(), ok: true, reason: '' };
          if (inSlot(slot, p.id)) return { personId: p.id, name: p.name.trim(), ok: false, reason: 'schon in dieser Schicht' };
          if (!isAvailable(ctx, p.id, slot.start, slot.end)) {
            return {
              personId: p.id, name: p.name.trim(), ok: false,
              reason: blockingReason(ctx, p.id, slot.start, slot.end) || 'nicht verfügbar'
            };
          }
          if (busyElsewhere(p.id, slot)) {
            return { personId: p.id, name: p.name.trim(), ok: false, reason: 'andere Schicht zur gleichen Zeit' };
          }
          return { personId: p.id, name: p.name.trim(), ok: true, reason: '' };
        }));
      }
      result[slot.id] = seats;
    });
    return result;
  }

  /** Statistik und Problemliste nach manueller Änderung neu berechnen. */
  function refresh(state, schedule) {
    var ctx = buildContext(state);
    schedule.stats = buildStats(state, ctx, schedule.slots);
    schedule.issues = buildIssues(ctx, schedule.slots, []);
    return schedule;
  }

  return {
    compute: compute,
    seatOptions: seatOptions,
    refresh: refresh,
    buildContext: buildContext,
    isAvailable: isAvailable
  };
})();

</script>
<script>
/* ---- src/xlsx.js ---- */
/* ============================================================
   xlsx.js – Minimaler XLSX-Writer ohne externe Bibliotheken
   ------------------------------------------------------------
   Erzeugt eine gültige .xlsx-Datei (Office Open XML) als Blob.
   Die ZIP-Container werden ohne Kompression ("stored") geschrieben,
   das ist für Tabellen dieser Größe völlig ausreichend und kommt
   ohne Deflate-Implementierung aus. Texte werden als inlineStr
   abgelegt – dadurch ist keine sharedStrings-Tabelle nötig und die
   Datei bleibt in Excel/LibreOffice frei bearbeitbar.

   Verwendung:
     XlsxWriter.build([
       { name: 'Blattname', columns: [{width:14}, ...],
         freeze: 1, autoFilter: true,
         rows: [ [ {v:'Text', s:'header'}, {v:12, t:'n'} ], ... ] }
     ]) -> Blob

   Zellformate (s): 'default' | 'header' | 'title' | 'bold' | 'muted'
                    'cell' | 'wrap' | 'bad' | 'warn' | 'good' | 'time'
   ============================================================ */

window.XlsxWriter = (function () {
  'use strict';

  /* ---------------- ZIP ---------------- */

  var CRC_TABLE = (function () {
    var table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function utf8(str) { return new TextEncoder().encode(str); }

  function dosDateTime(date) {
    var d = date || new Date();
    var year = Math.max(1980, d.getFullYear());
    return {
      time: ((d.getHours() << 11) | (d.getMinutes() << 5) | (Math.floor(d.getSeconds() / 2))) & 0xFFFF,
      date: (((year - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF
    };
  }

  /** files: [{ name, data: Uint8Array }] -> Blob (ZIP, gespeichert) */
  function zip(files) {
    var stamp = dosDateTime(new Date());
    var chunks = [];
    var central = [];
    var offset = 0;

    files.forEach(function (file) {
      var nameBytes = utf8(file.name);
      var crc = crc32(file.data);
      var size = file.data.length;

      var local = new Uint8Array(30 + nameBytes.length);
      var lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);   // Signatur
      lv.setUint16(4, 20, true);           // benötigte Version
      lv.setUint16(6, 0x0800, true);       // Flags: UTF-8 Dateinamen
      lv.setUint16(8, 0, true);            // Methode: stored
      lv.setUint16(10, stamp.time, true);
      lv.setUint16(12, stamp.date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      chunks.push(local, file.data);

      var entry = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(entry.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);           // erzeugt von Version
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, stamp.time, true);
      cv.setUint16(14, stamp.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      entry.set(nameBytes, 46);
      central.push(entry);

      offset += local.length + size;
    });

    var centralSize = central.reduce(function (n, e) { return n + e.length; }, 0);
    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    return new Blob(chunks.concat(central, [end]),
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /* ---------------- XML-Hilfen ---------------- */

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      // Steuerzeichen sind in XML nicht erlaubt
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  }

  function colName(index) {
    var n = index + 1, s = '';
    while (n > 0) {
      var rest = (n - 1) % 26;
      s = String.fromCharCode(65 + rest) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  /* Reihenfolge muss zu cellXfs in styles.xml passen */
  var STYLE_INDEX = {
    default: 0,
    title: 1,
    header: 2,
    cell: 3,
    wrap: 4,
    bold: 5,
    muted: 6,
    bad: 7,
    warn: 8,
    good: 9,
    time: 10,
    number: 11
  };

  function styleId(name) {
    return STYLE_INDEX[name] != null ? STYLE_INDEX[name] : 0;
  }

  function stylesXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<numFmts count="1"><numFmt numFmtId="164" formatCode="0.00"/></numFmts>' +
      '<fonts count="5">' +
        '<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><b/><sz val="14"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><i/><sz val="10"/><color rgb="FF666666"/><name val="Calibri"/><family val="2"/></font>' +
      '</fonts>' +
      '<fills count="6">' +
        '<fill><patternFill patternType="none"/></fill>' +
        '<fill><patternFill patternType="gray125"/></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FF2F4F9E"/><bgColor indexed="64"/></patternFill></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFFBD8D3"/><bgColor indexed="64"/></patternFill></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFFDEFD3"/><bgColor indexed="64"/></patternFill></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFDFF3E5"/><bgColor indexed="64"/></patternFill></fill>' +
      '</fills>' +
      '<borders count="2">' +
        '<border><left/><right/><top/><bottom/><diagonal/></border>' +
        '<border>' +
          '<left style="thin"><color rgb="FFD0D5E0"/></left>' +
          '<right style="thin"><color rgb="FFD0D5E0"/></right>' +
          '<top style="thin"><color rgb="FFD0D5E0"/></top>' +
          '<bottom style="thin"><color rgb="FFD0D5E0"/></bottom>' +
          '<diagonal/>' +
        '</border>' +
      '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="12">' +
        // 0 default
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        // 1 title
        '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
        // 2 header
        '<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>' +
        // 3 cell
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
        // 4 wrap
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
        // 5 bold
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
        // 6 muted
        '<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
        // 7 bad
        '<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
        // 8 warn
        '<xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
        // 9 good
        '<xf numFmtId="0" fontId="0" fillId="5" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
        // 10 time (linksbündig, als Text bearbeitbar)
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>' +
        // 11 number
        '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Standard" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  /**
   * Eine Zelle beschreiben:
   *   String / Zahl direkt, oder { v, t:'s'|'n', s:'header' }
   */
  function cellXml(cell, ref) {
    var value, type, style;
    if (cell == null) return '';
    if (typeof cell === 'object') {
      value = cell.v;
      type = cell.t || (typeof value === 'number' ? 'n' : 's');
      style = styleId(cell.s || 'cell');
    } else {
      value = cell;
      type = typeof cell === 'number' ? 'n' : 's';
      style = styleId('cell');
    }
    if (value == null || value === '') {
      return '<c r="' + ref + '" s="' + style + '"/>';
    }
    if (type === 'n' && typeof value === 'number' && isFinite(value)) {
      return '<c r="' + ref + '" s="' + style + '"><v>' + value + '</v></c>';
    }
    return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' +
      esc(value) + '</t></is></c>';
  }

  function sheetXml(sheet) {
    var rows = sheet.rows || [];
    var maxCols = 0;
    rows.forEach(function (r) { maxCols = Math.max(maxCols, (r || []).length); });
    maxCols = Math.max(maxCols, (sheet.columns || []).length, 1);

    var xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';

    xml += '<dimension ref="A1:' + colName(maxCols - 1) + Math.max(1, rows.length) + '"/>';

    xml += '<sheetViews><sheetView workbookViewId="0">';
    if (sheet.freeze) {
      xml += '<pane ySplit="' + sheet.freeze + '" topLeftCell="A' + (sheet.freeze + 1) +
        '" activePane="bottomLeft" state="frozen"/>' +
        '<selection pane="bottomLeft" activeCell="A' + (sheet.freeze + 1) + '" sqref="A' + (sheet.freeze + 1) + '"/>';
    }
    xml += '</sheetView></sheetViews>';
    xml += '<sheetFormatPr defaultRowHeight="15"/>';

    if (sheet.columns && sheet.columns.length) {
      xml += '<cols>';
      sheet.columns.forEach(function (col, i) {
        xml += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' +
          (col.width || 14) + '" customWidth="1"/>';
      });
      xml += '</cols>';
    }

    xml += '<sheetData>';
    rows.forEach(function (row, rIdx) {
      if (!row) { return; }
      xml += '<row r="' + (rIdx + 1) + '"' + (sheet.headerRow === rIdx + 1 ? ' ht="22" customHeight="1"' : '') + '>';
      row.forEach(function (cell, cIdx) {
        xml += cellXml(cell, colName(cIdx) + (rIdx + 1));
      });
      xml += '</row>';
    });
    xml += '</sheetData>';

    if (sheet.autoFilter && rows.length > (sheet.autoFilterRow || 1)) {
      var fRow = sheet.autoFilterRow || 1;
      xml += '<autoFilter ref="A' + fRow + ':' + colName(maxCols - 1) + rows.length + '"/>';
    }

    xml += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>';
    xml += '</worksheet>';
    return xml;
  }

  /** Blattnamen für Excel entschärfen (max. 31 Zeichen, keine Sonderzeichen) */
  function safeSheetName(name, index) {
    var clean = String(name || ('Blatt' + (index + 1))).replace(/[\\\/\?\*\[\]:]/g, ' ').trim();
    if (!clean) clean = 'Blatt' + (index + 1);
    return clean.slice(0, 31);
  }

  /** sheets -> Blob */
  function build(sheets) {
    var names = sheets.map(function (s, i) { return safeSheetName(s.name, i); });

    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheets.map(function (s, i) {
        return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ' +
          'ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      }).join('') +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
      '</Types>';

    var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>' +
      '</Relationships>';

    var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>' +
      names.map(function (n, i) {
        return '<sheet name="' + esc(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
      }).join('') +
      '</sheets></workbook>';

    var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map(function (s, i) {
        return '<Relationship Id="rId' + (i + 1) + '" ' +
          'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" ' +
          'Target="worksheets/sheet' + (i + 1) + '.xml"/>';
      }).join('') +
      '<Relationship Id="rId' + (sheets.length + 1) + '" ' +
